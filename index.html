y-huquqiy norma", "Norma umumiy qoida belgilaydi, aniq ishni hal etmaydi."], ["Ma’muriy-protsessual akt", "Protsessual akt jarayon davomida chiqadi."]]], ["Boshqaruv bilan bog‘liq ma’muriy protsessning asosini qanday jarayonlar tashkil etadi?", "Boshqaruv organi tizimini takomillashtirish, ish samaradorligi va xizmat sifatini oshirishga qaratilgan tashkiliy-huquqiy jarayonlar", "Bu ichki boshqaruv jarayonlari.", [["Fuqarolarning murojaatlari bo‘yicha litsenziya, ruxsatnoma va boshqa ma’muriy hujjatlar berishga qaratilgan tashkiliy-huquqiy jarayonlar", "Bu tartib-taomillar bilan bog‘liq protsess."], ["Shikoyat asosida boshqaruv organlarining noqonuniy qarorlarini qayta ko‘rish va qonuniylikni tiklashga qaratilgan tashkiliy-huquqiy jarayonlar", "Bu yustitsiyaviy protsess."], ["Huquqbuzarlik haqidagi ishlarni ko‘rish va jazo qo‘llashga qaratilgan, huquq-tartibotni ta’minlovchi tashkiliy-huquqiy jarayonlar", "Bu yurisdiksiyaviy protsess."]]], ["Ma’muriy protsess natijasida qanday turdagi huquqiy akt qabul qilinadi?", "Ma’muriy-huquqiy akt (ma’muriy hujjat)", "Natija ma’muriy hujjatdir.", [["Qonun hujjati (parlament qabul qiladi)", "Qonunni parlament qabul qiladi."], ["Idoraviy normativ hujjat (ichki tartib)", "Normativ hujjat umumiy qoida belgilaydi."], ["Sud ijro varaqasi (majburiy ijro uchun)", "Bu sud faoliyati natijasi."]]], ["Ma’muriy-protsessual normalar qanday munosabatlarni tartibga soladi?", "Ijro organlarining vakolatlarini amalga oshirishda yakka tartibdagi aniq ishlarni hal etish bo‘yicha munosabatlarni", "Normalar aniq ishni hal etish munosabatlarini tartibga soladi.", [["Ijro organlarining ichki tuzilmasi va shtat jadvalini belgilashda yuzaga keladigan tashkiliy munosabatlarni", "Bu tashkiliy normalar sohasi."], ["Sud va ijro organlari o‘rtasidagi vakolat taqsimotini belgilash bo‘yicha konstitutsiyaviy munosabatlarni", "Bu konstitutsiyaviy normalar sohasi."], ["Fuqarolar o‘rtasidagi ma’muriy nizolarni hal etishda yuzaga keladigan fuqarolik-huquqiy munosabatlarni", "Fuqarolar o‘rtasidagi nizo ma’muriy protsess predmeti emas."]]], ["Ma’muriy protsessda qaror qabul qilish qanday bo‘lishi mumkin?", "Kollegial yoki yakka tartibda", "Protsessda ikkala usul qo‘llanadi.", [["Faqat yakka tartibda", "Kollegial qaror ham mumkin."], ["Faqat kollegial tarzda", "Yakka tartibdagi qaror ham mumkin."], ["Faqat yuqori organning ko‘rsatmasi bilan", "Ko‘rsatma qaror qabul qilish shakli emas."]]], ["Keng ma’noda ma’muriy protsess – bu ...", "Butun davlat boshqaruvi faoliyatini o‘z ichiga oluvchi faoliyat", "Keng ma’no butun boshqaruvni qamraydi.", [["Faqat ma’muriy huquqbuzarlik ishlarini ko‘rish faoliyati", "Bu tor ma’no."], ["Faqat shikoyatlarni ko‘rib chiqish tartibi", "Bu tor ma’noning bir qismi."], ["Faqat sud tomonidan ma’muriy ishlarni hal etish faoliyati", "Bu sud protsessi."]]], ["Ma’muriy protsess qanday normalar bilan tartibga solinadi?", "Ma’muriy huquqning protsessual normalari bilan", "Ma’muriy huquq protsessual normalari tartibga soladi.", [["Fuqarolik protsessual huquqining normalari bilan", "Bu fuqarolik ishlari uchun."], ["Konstitutsiyaviy huquqning umumiy normalari bilan", "Ular umumiy asoslarni belgilaydi."], ["Jinoyat-protsessual huquqning normalari bilan", "Bu jinoyat ishlariga tegishli."]]], ["Ma’muriy-huquqiy faoliyat sohasida ma’muriy boshqaruv vakolati berilgan organlar – bu ...", "Ma’muriy organlar", "Ta’rif aynan ma’muriy organlarga tegishli.", [["Ijro organlari", "Bu doiraga kirmagan ma’muriy organlar ham bor."], ["Vakolatli idoralar", "Bu noaniq umumiy atama."], ["Nazorat organlari", "Bu faqat nazorat vazifasi bor organlar."]]], ["Ma’muriy ish yuritishda qanday ma’muriy organlar o‘rtasidagi munosabatlar idoralararo hamkorlik hisoblanmaydi?", "Bo‘ysunuv munosabatlarida bo‘lgan ma’muriy organlar o‘rtasidagi munosabatlar", "Hamkorlik bo‘ysunmaydigan organlar o‘rtasida bo‘ladi.", [["Bo‘ysunmaydigan ma’muriy organlar o‘rtasidagi hujjat almashinuvi va axborot bilan o‘zaro ta’minlanishi", "Bu idoralararo hamkorlik hisoblanadi."], ["Bir vazirlikka qarashli turli bo‘linmalar o‘rtasidagi ma’lumotlar almashinuvi munosabatlari", "Bu idoralararo hamkorlik hisoblanadi."], ["Teng huquqli ma’muriy organlarning o‘zaro ma’lumot so‘rovi va javob berishi munosabatlari", "Bu idoralararo hamkorlik hisoblanadi."]]], ["Ma’muriy tartib-taomillar quyidagi qaysi faoliyatga nisbatan tatbiq etilmaydi?", "Soliq va majburiy to‘lovlarni undirish, davlat xizmatini o‘tash, saylov va referendumlar", "Bu faoliyatlar qonun qo‘llanish doirasidan chiqarilgan.", [["Litsenziya va ruxsatnomalar berish, ro‘yxatdan o‘tkazish va davlat xizmatlarini ko‘rsatish", "Bu faoliyatga ma’muriy tartib-taomillar tatbiq etiladi."], ["Yer uchastkalarini ajratish, mulk huquqini ro‘yxatdan o‘tkazish va ijozat berish faoliyati", "Bu faoliyatga ma’muriy tartib-taomillar tatbiq etiladi."], ["Tadbirkorlik subyektlarini ro‘yxatga olish, litsenziyalash va davlat xizmatlarini ko‘rsatish faoliyati", "Bu faoliyatga ma’muriy tartib-taomillar tatbiq etiladi."]]], ["Jismoniy va yuridik shaxslarning murojaatlari to‘g‘risidagi qonunchilik Qonunning qo‘llanilish sohasiga kiruvchi munosabatlarga nisbatan ...", "Tatbiq etilmaydi", "Murojaatlar to‘g‘risidagi qonun bu munosabatlarga qo‘llanmaydi.", [["Tatbiq etiladi", "Qonun aniq istisno nazarda tutadi."], ["Faqat yuridik shaxslarga tatbiq etiladi", "Bu bunday cheklov belgilanmagan."], ["Qisman tatbiq etiladi", "Qisman qo‘llash nazarda tutilmagan."]]], ["Ma’muriy ishni ko‘rib chiqish, hujjatni qabul qilish, shikoyat bo‘yicha qayta ko‘rish va ijro etish jarayoni – bu ...", "Ma’muriy ish yuritish", "Ta’rif ma’muriy ish yuritishga mos.", [["Ma’muriy protsess", "Bu kengroq tushuncha."], ["Ma’muriy tartib-taomil", "Bu faoliyatni tartibga soluvchi mexanizm."], ["Ma’muriy shikoyat bo‘yicha ish yuritish", "Bu faqat bir bosqich."]]], ["Protsessual hujjat xususiyatiga ko‘ra ...", "Ma’muriy ish yuritish davomida qabul qilinadigan, ishni mazmunan hal etmaydigan hujjat", "Bunday hujjat ishni hal etmaydi, masalan to‘xtatish haqidagi hujjat.", [["Ma’muriy ish yuritish yakunida qabul qilinadigan, ishni mazmunan hal etuvchi hujjat", "Bu ma’muriy hujjat."], ["Ma’muriy ish yuritish davomida qabul qilinadigan, normativ xususiyatga ega hujjat", "Protsessual hujjat normativ emas."], ["Ma’muriy ish yuritish davomida sud tomonidan chiqariladigan, ishni hal etmaydigan hujjat", "Bu ma’muriy organ hujjati."]]], ["Quyidagi xususiyatlardan qaysi biri davlat boshqaruvi faoliyati usullariga xos emas?", "Usul doimiy va cheklanmagan muddatga mo‘ljallanadi hamda huquqiy aktlarda mustahkamlanmaydi", "Usullar vaqtinchalik xususiyatga ega va huquqiy aktlarda belgilanadi.", [["Usul muayyan davrda qo‘llanib, huquqiy aktlarda mustahkamlanadi va ta’sir vositasi bo‘ladi", "Bu usulga xos belgi."], ["Usul boshqaruv obyektiga yo‘naltirilgan, maqsad va vazifalarga qarab tanlanadigan vositadir", "Bu usulga xos belgi."], ["Usul boshqaruv jarayonida ta’sir ko‘rsatish vositasi sifatida huquqiy aktda mustahkamlanadi", "Bu usulga xos belgi."]]], ["Ma’muriy ishontirish usuliga xos bo‘lmagan xususiyat aks etgan javobni toping?", "Majburlov choralarini qo‘llab, faqat maxsus vakolatli organlar orqali jazolashga asoslanadi", "Ishontirish majburlovsiz, ixtiyoriy bajarishga undaydi.", [["Barcha subyektlar tomonidan fuqarolarga nisbatan doimiy qo‘llanadi va ixtiyoriylikka asoslanadi", "Bu usulga xos belgi."], ["Tushuntirish va tarbiyalash orqali ongga ta’sir ko‘rsatib, ixtiyoriy bajarishga undaydi", "Bu usulga xos belgi."], ["Ixtiyoriy bajarishga olib keladi va rag‘batlantirishni ham o‘z ichiga oluvchi usul hisoblanadi", "Bu usulga xos belgi."]]], ["Ma’muriy majburlash usuliga xos bo‘lmagan xususiyat aks etgan javobni toping?", "Barcha subyektlar tomonidan qo‘llanib, ixtiyoriy bajarishga olib keladi", "Majburlashni faqat maxsus vakolatli organlar qo‘llaydi.", [["Faqat vakolatli organ va mansabdor shaxslar tomonidan qo‘llanadi", "Bu xos belgi."], ["Huquqbuzarlikni oldini olish va jazolash maqsadiga xizmat qiladi", "Bu xos belgi."], ["Qonunda belgilangan asos va tartibda amalga oshiriladi", "Bu xos belgi."]]], ["Ommaviy xizmatlar xususida keltirilgan fikrlarning qaysi biri noto‘g‘ri?", "Ommaviy xizmatlarni faqat davlat organlari ko‘rsatadi va ular bozor munosabatlaridan butunlay tashqarida", "Xususiy sektor ham xizmat ko‘rsatishi mumkin.", [["Ommaviy xizmatlar davlat xizmatlariga qaraganda kengroq tushuncha bo‘lib, xususiy sektorni ham qamraydi", "Bu to‘g‘ri fikr."], ["Ommaviy xizmat ko‘rsatish provayderning bevosita xarajatli faoliyati hisoblanadi va nazorat qilinadi", "Bu to‘g‘ri fikr."], ["Murojaat qilgan har bir shaxsga xizmat ko‘rsatish kafolatlanadi va shartlar teng bo‘ladi", "Bu to‘g‘ri fikr."]]], ["Quyidagilardan qaysi biri ommaviy xizmatlar ko‘rsatishning prinsipi hisoblanmaydi?", "Shaxsiy manfaat ustuvorligi va xizmat ko‘rsatishning yopiqligi", "Prinsiplar ommaviy manfaat va ochiqlikka tayanadi.", [["Ochiqlik, hisobdorlik va ommaviy manfaat ustuvorligi", "Bu prinsip."], ["Uzluksizlik, xolislik va murojaat qiluvchilar tengligi", "Bu prinsip."], ["Samaradorlik, sifat kafolati va xizmatdan teng foydalanish", "Bu prinsip."]]], ["Nomoddiy ommaviy xizmatlar keltirilgan qatorni toping?", "Ta’lim, madaniyat, sport, turizm, tibbiy xizmat va konsalting", "Bular nomoddiy xizmatlar.", [["Ta’lim, madaniyat, uy-joy kommunal xizmati va konsalting", "Kommunal xizmat amaliy xizmat."], ["Sport, turizm, jamoat transporti va tibbiy xizmat", "Jamoat transporti amaliy xizmat."], ["Madaniyat, konsalting, mol-mulkni saqlash va ta’lim", "Mol-mulkni saqlash amaliy xizmat."]]], ["Amaliy ommaviy xizmatlar keltirilgan javob qatorini toping?", "Jamoat transporti, uy-joy kommunal xizmati, birinchi tibbiy yordam va mol-mulkni saqlash", "Bular amaliy xizmatlar.", [["Jamoat transporti, litsenziyalash, birinchi tibbiy yordam va mol-mulkni saqlash", "Litsenziyalash huquqiy xizmat."], ["Uy-joy kommunal xizmati, apostil, jamoat transporti va birinchi tibbiy yordam", "Apostil huquqiy xizmat."], ["Jamoat tra const $=id=>document.getElementById(id);
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let cur,k,score,sec,set=0,tm;
let sz=40,mx=40;try{sz=+localStorage.getItem("sz")||40;mx=+localStorage.getItem("mx")||40}catch(e){}
const clamp=(v,d)=>Math.min(Math.max(1,+v||d),Q.length);
function secs(){const n=Math.max(1,sz),r=[];for(let i=0;i<Q.length;i+=n)r.push(Q.slice(i,i+n));return r}
function save(){sz=clamp($("sz").value,40);mx=clamp($("mx").value,40);try{localStorage.setItem("sz",sz);localStorage.setItem("mx",mx)}catch(e){}set=0;home()}
function home(){clearInterval(tm);
 $("app").innerHTML=`<div class=hd><h1>⚖️ Ma’muriy huquq testi</h1><button class=g onclick="set=!set;home()">⚙️ Sozlama</button></div><p class=m>Jami ${Q.length} ta savol</p>`+
 (set?`<div class=card><b>⚙️ Sozlama</b><div class=row><label class=m>Bo‘limdagi savollar (standart 40)<br><input id=sz type=number min=1 max=${Q.length} value=${sz}></label><label class=m>Mix imtihon savollari (standart 40)<br><input id=mx type=number min=1 max=${Q.length} value=${mx}></label><button onclick=save()>Saqlash</button></div></div>`:"")+
 `<div class=card><b>🎲 Mix imtihon</b><div class=m>Barcha bo‘limlardan ${Math.min(mx,Q.length)} ta tasodifiy savol</div><div class=row><button onclick="start(-1)">Boshlash</button></div></div>`+
 secs().map((s,i)=>`<div class=card><b>${i+1}-bo‘lim</b><div class=m>${i*sz+1}–${i*sz+s.length}-savollar · ${s.length} ta</div><div class=row><button onclick="start(${i})">Boshlash</button></div></div>`).join("")}
function start(i){
 if(i!=null)sec=i;const src=sec<0?sh(Q).slice(0,Math.min(mx,Q.length)):secs()[sec];
 cur=sh(src).map(([q,c,e,w])=>({q,s:null,o:sh([[c,e,1],...w.map(([t,r])=>[t,r,0])])}));
 k=0;show(0)}
function nav(){return `<div class=nv>`+cur.map((x,i)=>`<button class="${x.s!=null?"an ":""}${i==k?"cu":""}" onclick="show(${i})">${i+1}</button>`).join("")+`</div>`}
function ana(x){return `<div class=m style="margin-top:10px"><b>Variantlar tahlili:</b></div><ul class=m>`+x.o.map((e,i)=>`<li><b>${"ABCD"[i]}</b> – ${e[2]?"to‘g‘ri: ":"xato: "}${e[1]}</li>`).join("")+"</ul>"}
function show(i){clearInterval(tm);k=i;const x=cur[k],a=x.s!=null;
 $("app").innerHTML=`<div class=bar><i style="width:${cur.filter(y=>y.s!=null).length/cur.length*100}%"></i></div><div class=top><button class=g onclick=home()>← Menyu</button><span class=m>${k+1} / ${cur.length}</span><button class=g onclick=end()>Yakunlash</button></div>${nav()}<h2>${x.q}</h2>`+
 x.o.map((o,j)=>`<button class="opt${a?(o[2]?" ok":j==x.s?" no":""):""}" ${a?"disabled":""} onclick=pick(${j})><b>${"ABCD"[j]}</b><span>${o[0]}</span></button>`).join("")+
 `<div id=fb>${a?`<div class="fb ${x.o[x.s][2]?"okb":"nob"}"><b>${x.o[x.s][2]?"✅ To‘g‘ri tanlagansiz":"❌ Xato tanlagansiz"}</b>${ana(x)}</div>`:""}</div><div class=row><button class=g ${k?"":"disabled"} onclick="show(k-1)">← Oldingi</button><button class=g onclick="show(Math.min(k+1,cur.length-1))">Keyingi →</button></div>`}
function pick(j){const x=cur[k];if(x.s!=null)return;x.s=j;
 document.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;if(i==j)b.classList.add("sel")});
 document.querySelector(".nv").outerHTML=nav();let t=10;
 $("fb").innerHTML=`<div class="fb okb m" id=tt></div>`;
 const tick=()=>{$("tt").textContent=k+1<cur.length?`Javob qabul qilindi. ${t} soniyadan keyin keyingi savolga o‘tiladi.`:`Javob qabul qilindi. ${t} soniyadan keyin natija chiqadi.`};tick();
 tm=setInterval(()=>{t--;if(t<=0){clearInterval(tm);k+1<cur.length?show(k+1):end()}else tick()},1000)}
function end(){clearInterval(tm);
 const t=cur.length,sc=cur.filter(x=>x.s!=null&&x.o[x.s][2]).length,p=Math.round(sc/t*100),bad=cur.filter(x=>x.s==null||!x.o[x.s][2]);
 $("app").innerHTML=`<h1>${p>=80?"🏆":p>=50?"👍":"📚"} Natija: ${p}%</h1><p>${t} ta savoldan ${sc} tasi to‘g‘ri.</p>`+(bad.length?`<h3>Xatolar tahlili (${bad.length})</h3>`+bad.map(x=>{const c=x.o.find(e=>e[2]);return `<div class=card><b>${x.q}</b>${x.s==null?`<div class="fb nob">❌ Javob berilmagan</div>`:`<div class="fb nob">❌ Siz: ${x.o[x.s][0]}<br>${x.o[x.s][1]}</div>`}<div class="fb okb">✅ To‘g‘ri: ${c[0]}<br>${c[1]}</div>${ana(x)}</div>`}).join(""):"<p>🎉 Barcha savollarga to‘g‘ri javob berdingiz!</p>")+`<div class=row><button onclick="start()">Qayta urinish</button><button class=g onclick=home()>Menyu</button></div>`}
home();
</script></body></html>
