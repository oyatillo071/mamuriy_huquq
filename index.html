<style>

:root[data-theme="dark"]{--bg:#12151c;--c:#1b202b;--t:#e8ebf2;--m:#98a2b3;--b:#2d3445;--p:#7c9bff;--ok:#4cc38a;--okb:#16301f;--no:#ff7b7b;--nob:#3a1b1b;color-scheme:dark}

<script>
// [savol, to‘g‘ri javob, nega to‘g‘ri, [[xato variant, nega xato] x3]]
const Q=[["Boshqaruvning turlari qaysi qatorda to‘g‘ri keltirilgan?", "Mexanik (texnik), biologik va ijtimoiy boshqaruv", "Boshqaruv obyektining tabiatiga ko‘ra aynan shu uch tur ajratiladi.", [["Texnik, biologik, ijtimoiy va iqtisodiy boshqaruv", "To‘rtinchi tur yo‘q: iqtisodiy boshqaruv ijtimoiy boshqaruv ichida o‘rganiladi."], ["Mexanik, ijtimoiy va ma’muriy-siyosiy boshqaruv", "Biologik tur tushib qolgan, ma’muriy-siyosiy esa ijtimoiy boshqaruvning bir sohasi."], ["Biologik, ijtimoiy va davlat-huquqiy boshqaruv", "Davlat-huquqiy boshqaruv mustaqil tur emas; texnik tur o‘rni bo‘sh qolgan."]]], ["Davlat hokimiyati vakolatlariga ega organlar va mansabdor shaxslar tomonidan davlat ishlarini boshqarish – bu?", "Davlat boshqaruvi", "Ta’rifdagi belgilar (hokimiyat vakolati, organ va mansabdor) davlat boshqaruviga tegishli.", [["Ijro etuvchi hokimiyat", "Bu hokimiyat tarmog‘i; boshqaruv uning faoliyat mazmuni, ta’rifdagi tushuncha emas."], ["Ma’muriy-huquqiy tartibga solish", "Bu huquqiy ta’sir shakli bo‘lib, boshqaruvning o‘zi emas."], ["Ijtimoiy boshqaruv", "Kengroq tushuncha: nodavlat tuzilmalar boshqaruvini ham qamraydi."]]], ["Davlat boshqaruvini tashkil etish va amalga oshirishning ijtimoiy mexanizmi zanjiri qanday ketma-ketlikda bo‘ladi?", "Ehtiyoj – manfaat – maqsad – qaror – harakat – natija", "Ehtiyojdan manfaat, undan maqsad, so‘ng qaror, harakat va natija kelib chiqadi.", [["Ehtiyoj – manfaat – qaror – maqsad – harakat – natija", "Qaror maqsad belgilangandan keyin qabul qilinadi, oldin emas."], ["Ehtiyoj – maqsad – manfaat – qaror – harakat – natija", "Manfaat anglanmay turib maqsad qo‘yilmaydi: manfaat maqsaddan oldin keladi."], ["Ehtiyoj – manfaat – maqsad – harakat – qaror – natija", "Harakat qarorga asoslanadi; ularning o‘rni almashgan."]]], ["Davlat boshqaruviga quyidagi qaysi xususiyat xos emas?", "Shakli, uslubi va mazmuniga ko‘ra qonun chiqarish hamda odil sudlov bilan bir xil faoliyat turi hisoblanadi", "Boshqaruv bu ikki faoliyatdan shakli, uslubi va mazmuni bilan ajralib turadi.", [["Ijro etuvchi hokimiyatni amalga oshirishga yo‘naltirilgan tashkiliy faoliyat hisoblanadi", "Bu xos belgi: boshqaruv ijro hokimiyatining mazmuni."], ["Qonunga asoslangan ijro etish va farmoyish berish xususiyatiga ega bo‘ladi", "Bu ham xos: organ qaror chiqaradi va ijrosini ta’minlaydi."], ["Faqat davlat mulkidagi obyektlar bilan cheklanmay, nodavlat sohaga ham ta’sir ko‘rsatadi", "Bu ham xos: boshqaruv ta’siri davlat obyektlari bilan cheklanmaydi."]]], ["Davlat boshqaruviga xos bo‘lmagan xususiyat ko‘rsatilgan javobni toping?", "Faqat mavjud normalarni qo‘llash bilan cheklanadi va huquq ijodkorligini amalga oshirmaydi", "Boshqaruv normativ hujjat chiqarib huquq ijodkorligini ham bajaradi.", [["Ijro hokimiyati doirasida huquqni qo‘llash bilan birga normativ hujjatlar qabul qiladi", "Xos belgi: qo‘llash va ijodkorlik birga amalga oshadi."], ["Muntazam, rejali va tashkiliy xususiyatga ega bo‘lgan faoliyatdir", "Xos belgi: boshqaruv tasodifiy emas, doimiy va rejali."], ["Hokimiyat vakolatiga tayanib, majburlov choralarini qo‘llash imkoniga ega", "Xos belgi: yurisdiksion vakolat boshqaruvga tegishli."]]], ["Davlat boshqaruviga xos bo‘lmagan xususiyat ko‘rsatilgan javobni toping?", "Tasodifiy, rejasiz tarzda olib boriladi va majburlov vakolatiga ega emas", "Boshqaruv doimiy, rejali va majburlov choralarini qo‘llash vakolatiga ega.", [["Doimiy va rejali bo‘lib, ogohlantirish hamda cheklov choralarini ham nazarda tutadi", "Xos belgi: oldini olish va cheklash choralari boshqaruvga kiradi."], ["Davlat nomidan bajariladigan ijrochi-farmoyishchilik faoliyati hisoblanadi", "Xos belgi: farmoyish berish asosiy mazmunlardan biri."], ["Ijtimoiy munosabatlarni tashkil etish va tartibga solishga qaratilgan bo‘ladi", "Xos belgi: boshqaruvning bosh maqsadi shu."]]], ["Quyidagilardan qaysi biri davlat boshqaruvining asosiy funksiyalaridan biri hisoblanmaydi?", "Odil sudlov orqali huquqiy nizolarni hal etish", "Nizolarni sud orqali hal etish sud hokimiyati vazifasi, boshqaruv funksiyasi emas.", [["Rejalashtirish va istiqbolni belgilash", "Bu boshqaruvning asosiy funksiyalaridan biri."], ["Muvofiqlashtirish va kontrol qilish", "Bu ham boshqaruv funksiyalari qatorida."], ["Hisobga olish va axborot bilan ta’minlash", "Bu ham boshqaruv funksiyasi hisoblanadi."]]], ["Ma’muriy huquq predmetiga kiruvchi huquqiy munosabatlarning doimiy ishtirokchisi bu –?", "Davlat organi yoki uning nomidan harakat qiluvchi mansabdor shaxs", "Bunday munosabatda bir tomonda doimo vakolatli davlat organi bo‘ladi.", [["Yuridik shaxs maqomidagi xo‘jalik yurituvchi subyekt", "U ishtirok etishi mumkin, ammo doimiy ishtirokchi emas."], ["Fuqarolarning o‘zini o‘zi boshqarish organi", "Ayrim hollarda ishtirok etadi, doimiy emas."], ["Vakolatli jamoat birlashmasi", "Tashkiliy tuzilma sifatida ishtirok etsa-da, majburiy tomon emas."]]], ["Ma’muriy huquq sohasiga doir fikrlarning qaysi biri noto‘g‘ri?", "Ikki fuqaro o‘rtasidagi mulkiy shartnoma munosabatlari ham ma’muriy huquq predmetiga kiradi", "Bunday munosabatlar fuqarolik huquqi predmeti.", [["Davlat boshqaruvini amalga oshirish jarayonidagi ijtimoiy munosabatlar predmetga kiradi", "Bu to‘g‘ri fikr."], ["Munosabatning bir tomonida odatda davlat organi yoki mansabdor shaxs turadi", "Bu to‘g‘ri fikr."], ["Ma’muriy huquq ommaviy huquq sohalaridan biri hisoblanadi", "Bu to‘g‘ri fikr."]]], ["Ma’muriy huquqda ijtimoiy munosabatlarga huquqiy ta’sir etishning qaysi uslublaridan foydalaniladi?", "Yozma buyruq (ko‘rsatma), man etish va ruxsat berish", "Ma’muriy huquq uchun hokimiyat ko‘rsatmasi, taqiq va ruxsat uslublari xos.", [["Buyruq, kelishuv va rag‘batlantirish", "Kelishuv tomonlar tengligiga asoslanadi, bu fuqarolik huquqiga xos."], ["Ruxsat, tavsiya va hamkorlik", "Tavsiya va hamkorlik majburiy ta’sir emas."], ["Man etish, kelishuv va ixtiyoriy bajarish", "Ixtiyoriy bajarish hokimiyat uslubiga zid."]]], ["Davlat boshqaruvi jarayonida vujudga keladigan munosabatlarning ichki tuzilishi, normalarning izchil joylashuvi – bu?", "Ma’muriy huquq tizimi", "Normalar tuzilishi va joylashuvi huquq tizimining mazmuni.", [["Ma’muriy qonunchilik tizimi", "Bu normativ hujjatlar tizimi, normalar tuzilishi emas."], ["Ma’muriy huquq manbalari", "Bu normalarning ifoda shakli."], ["Ma’muriy huquq predmeti", "Bu tartibga solinadigan munosabatlar doirasi."]]], ["Quyidagilardan qaysi biri ma’muriy huquqning maxsus prinsiplari qatoriga kiradi?", "Yakkaboshchilik va kollegiallik, markazlashtirish va markazsizlashtirishning uyg‘unligi", "Bular boshqaruv organlari faoliyatiga xos maxsus prinsiplar.", [["Qonuniylik va qonun oldida tenglik", "Bular umumiy huquqiy prinsiplar."], ["Insonparvarlik va xalq manfaatlarining ustuvorligi", "Bular umumiy prinsiplar qatoriga kiradi."], ["Demokratizm va sud nazoratining mustaqilligi", "Bular ma’muriy huquqqa xos maxsus prinsip emas."]]], ["Ma’muriy huquq fanining umumiy qismi tarkibiga kiruvchi institutlarni ko‘rsating?", "Boshqaruv subyektlari, shakllari va uslublari, ma’muriy majburlov choralari", "Bular umumiy qism institutlari.", [["Iqtisodiyot va ijtimoiy-madaniy sohalarni boshqarish hamda boshqaruv shakllari", "Sohalarni boshqarish maxsus qismga tegishli."], ["Boshqaruv subyektlari, tarmoqlararo boshqaruv va ma’muriy-siyosiy soha boshqaruvi", "Tarmoqlararo va soha boshqaruvi maxsus qismda o‘rganiladi."], ["Ma’muriy tartib-taomillar, sohalarni boshqarish va hududiy boshqaruv", "Sohalarni boshqarish maxsus qismga kiradi."]]], ["Quyidagilardan qaysi biri ma’muriy huquq fanining umumiy qismi tarkibiga kiruvchi institut hisoblanmaydi?", "Iqtisodiyot, ijtimoiy-madaniy va ma’muriy-siyosiy sohalarni boshqarish", "Soha boshqaruvi maxsus qism institutlari.", [["Ma’muriy tartib-taomillar va ma’muriy jarayon", "Bular umumiy qism institutlari."], ["Ma’muriy-huquqiy majburlov choralari", "Umumiy qismga kiradi."], ["Qonuniylik va intizomni ta’minlash", "Umumiy qismga kiradi."]]], ["Quyida keltirilganlardan qaysi biri Ma’muriy huquq fani tizimining ichiga kiradi?", "Ma’muriy-huquqiy normalar, institutlar va fan bo‘limlari (guruhlari)", "Fan tizimi normalar, ularni birlashtiruvchi institutlar va bo‘limlardan tashkil topadi.", [["Normativ hujjatlar va sud amaliyoti to‘plami", "Bu manbalar majmuasi, fan tizimining ichki tarkibi emas."], ["Ma’muriy qonunchilik va idoraviy hujjatlar", "Bu qonunchilik tizimi, huquq fanining tarkibi emas."], ["Ma’muriy organlar tizimi va mansabdorlar reyestri", "Bu boshqaruv organlari tuzilmasi, huquq tizimi emas."]]], ["Jamiyatning alohida sohalarida amalga oshiriladigan davlat boshqaruvining xususiyatlarini belgilovchi normalar ma’muriy huquq fanining qaysi qismida o‘rganiladi?", "Maxsus qismda", "Alohida sohalardagi boshqaruv xususiyatlari maxsus qismda o‘rganiladi.", [["Umumiy qismda", "Umumiy qism barcha sohalarga xos institutlarni o‘rganadi."], ["Protsessual qismda", "Ma’muriy huquqda bunday mustaqil qism yo‘q."], ["Tarmoqlararo boshqaruv qismida", "Tarmoqlararo boshqaruv maxsus qism ichidagi mavzu, alohida qism emas."]]], ["Davlat boshqaruviga xos qaysi fikr to‘g‘ri?", "Ijro etuvchi hokimiyatni amalga oshiradi; huquqni qo‘llash bilan birga huquq ijodkorligini ham bajaradi", "Boshqaruv ijro hokimiyati faoliyati bo‘lib, normativ hujjat chiqarishni ham o‘z ichiga oladi.", [["Qonun chiqarish faoliyati bilan mazmunan bir xil", "Mazmunan ular farq qiladi: boshqaruv ijro, qonun chiqarish esa qonun yaratadi."], ["Odil sudlov bilan bir xil shakl va uslubda amalga oshiriladi", "Sudlov o‘ziga xos protsessual shaklga ega, boshqaruv esa ijro-farmoyish uslubida."], ["Huquq ijodkorligini umuman amalga oshirmaydi", "Organlar normativ-huquqiy hujjatlar chiqarishi orqali huquq ijod qiladi."]]], ["Kasbiy tajriba va ilmiy yutuqlarga tayanib, boshqaruvdagi o‘zgarishlar natijalarini oldindan ko‘ra bilish – qaysi funksiya mazmuni?", "Istiqbolni belgilash funksiyasi", "Natijalarni oldindan ko‘ra bilish – istiqbolni belgilashning mazmuni.", [["Rejalashtirish funksiyasi", "Rejalashtirish aniq maqsad va muddatlarni belgilaydi, oldindan ko‘ra bilishni emas."], ["Axborot bilan ta’minlash funksiyasi", "U ma’lumot to‘plash va yetkazishni anglatadi."], ["Muvofiqlashtirish funksiyasi", "U organlar faoliyatini uyg‘unlashtirishga qaratilgan."]]], ["Keltirilgan fikrlarning qaysi biri to‘g‘ri?", "Ma’muriy huquq boshqaruv munosabatlarini tartibga soladi; ularda davlat organi albatta ishtirok etadi, tomonlar teng emas", "Boshqaruv munosabatida hokimiyat vakolatli organ albatta ishtirok etadi va tomonlar yuridik teng emas.", [["Ma’muriy huquq fuqarolarning o‘zaro shartnoma munosabatlarini tartibga soladi", "Bu fuqarolik huquqining predmeti."], ["Ma’muriy-huquqiy munosabatda tomonlar yuridik jihatdan teng huquqli", "Aslida tomonlar teng emas: bir tomon hokimiyat vakolatiga ega."], ["Ma’muriy-huquqiy munosabatda davlat organi ishtirok etishi shart emas", "Davlat organi bunday munosabatning doimiy, majburiy ishtirokchisi."]]], ["Norma bilan belgilangan sharoitda muayyan harakatni bajarish uchun to‘g‘ridan-to‘g‘ri yuridik majburiyat yuklash – huquqiy ta’sirning qaysi uslubi?", "Yozma buyruq, ko‘rsatma", "Muayyan harakatni majburiy bajarishni yuklash – buyruq (ko‘rsatma) uslubi.", [["Man etish (taqiqlash)", "Taqiq harakatdan tiyilishni talab qiladi, muayyan harakat qilishni emas."], ["Ruxsat berish", "Ruxsat harakat qilish imkonini beradi, majburiyat yuklamaydi."], ["Rag‘batlantirish", "Bu ishontirishga yaqin uslub, majburiy yuklama emas."]]], ["“Norma” so‘zi lotin tilida qanday ma’noni bildiradi?", "“Me’yor”, “o‘lchov”, “qoida”, “qonun”", "Lotincha norma – yo‘naltiruvchi qoida, o‘lchov va me’yor ma’nosini beradi.", [["“Buyruq”, “farmon”, “farmoyish”", "Bular hokimiyat hujjatlari nomi, so‘zning lug‘aviy ma’nosi emas."], ["“Huquq”, “adolat”, “tenglik”", "Bular boshqa tushunchalar; norma me’yor ma’nosini bildiradi."], ["“Jazo”, “majburlov”, “taqiq”", "Bular norma oqibatiga oid; so‘zning asl ma’nosi emas."]]], ["Ma’muriy-huquqiy normalarga xos bo‘lmagan xususiyatni toping.", "Rioya qilish ixtiyoriy va majburlov choralari bilan ta’minlanmaydi", "Aslida ular davlat o‘rnatadi, rioya majburiy, buzganga majburlov qo‘llanadi.", [["Davlat tomonidan o‘rnatiladi", "Bu xos belgi: normani davlat vakolatli organlari chiqaradi."], ["Rioya etish majburiy hisoblanadi", "Bu xos belgi: norma barcha uchun yuridik kuchga ega."], ["Buzganlarga yuridik majburlov qo‘llanadi", "Bu xos belgi: majburlov normaning kafolatidir."]]], ["Ma’muriy-huquqiy normalar qanday funksiyalarni bajaradi?", "Tartibga solish (regulyativ), qo‘riqlash va himoya qilish funksiyalari", "Norma munosabatlarni tartibga soladi va ularni himoya qilib muhofaza etadi.", [["Tartibga solish va fuqarolik javobgarligi funksiyalari", "Fuqarolik javobgarligi alohida funksiya emas, u fuqarolik huquqiga xos."], ["Qo‘riqlash va sud hukmini chiqarish funksiyalari", "Hukm chiqarish sudning vazifasi, norma funksiyasi emas."], ["Rag‘batlantirish va jinoiy ta’qib funksiyalari", "Jinoiy ta’qib jinoyat protsessiga oid; bu funksiya ma’muriy normaga xos emas."]]], ["Moddiy ma’muriy-huquqiy normalari – bu?", "Boshqaruv organlarining huquq, majburiyat va vakolatlarini, ya’ni ma’muriy-huquqiy holatini belgilovchi normalar", "Moddiy normalar mazmunni – huquq va majburiyatlarni belgilaydi.", [["Huquqlarni amalga oshirish tartibi va shakllarini belgilovchi normalar", "Bu protsessual normalar: ular tartib va shaklni belgilaydi."], ["Moddiy jazo va jarima miqdorini belgilovchi normalar", "Bu sanksiyaga oid; moddiy normaning ta’rifi emas."], ["Davlat mulkini boshqarish tartibini belgilovchi normalar", "Bu mulk boshqaruviga oid soha normalari, moddiy norma ta’rifi emas."]]], ["Majburiyat yuklash shakliga ko‘ra ma’muriy-huquqiy normalarning qanday turlari mavjud?", "Imperativ va tavsiyaviy normalar", "Majburiyat yuklash shakliga ko‘ra norma imperativ yoki tavsiyaviy bo‘ladi.", [["Imperativ va dispozitiv normalar", "Dispozitiv normalar fuqarolik huquqiga xos, tomonlar kelishuviga tayanadi."], ["Tavsiyaviy va rag‘batlantiruvchi normalar", "Rag‘batlantiruvchi norma bunday bo‘linishda yo‘q."], ["Majburlovchi va ruxsat beruvchi normalar", "Bu ta’sir uslubiga oid bo‘linish, majburiyat shakliga ko‘ra tur emas."]]], ["Quyidagilardan qaysi biri ma’muriy-huquqiy normalar tartibga soladigan masalalarga kirmaydi?", "Ikki fuqaro o‘rtasidagi shartnoma munosabatlari yoki axloq normalari doirasidagi masalalar", "Bunday masalalar fuqarolik huquqi va axloq normalari doirasida hal etiladi.", [["Davlat organlarining vakolatlari va tuzilishi", "Bu ma’muriy huquq predmeti: boshqaruv organlari maqomi."], ["Davlat xizmati ko‘rsatish va litsenziyalash tartibi", "Bu ham ma’muriy-huquqiy tartibga solish ob’ekti."], ["Ma’muriy javobgarlik va majburlov choralari", "Bu ham ma’muriy huquq doirasidagi masala."]]], ["Ma’muriy-huquqiy normaning qaysi elementi uni qo‘llashning haqiqiy shartlarini belgilaydi?", "Gipoteza", "Gipoteza normaning amal qilish shartlarini ko‘rsatadi.", [["Dispozitsiya", "U shart emas, xulq-atvor qoidasini belgilaydi."], ["Sanksiya", "U norma buzilganda qo‘llanadigan oqibatni ko‘rsatadi."], ["Rekvizit", "Bu hujjat qismi, norma elementi emas."]]], ["Huquq normalarini ifoda etish, rasmiylashtirish va mustahkamlash shakli – bu?", "Huquq manbai", "Huquq manbai normalar ifodalangan va mustahkamlangan shakldir.", [["Huquq tizimi", "Tizim normalarning ichki tuzilishini bildiradi."], ["Huquq predmeti", "Predmet tartibga solinadigan munosabatlar doirasi."], ["Huquqiy munosabat", "Bu subyektlar o‘rtasidagi aloqa, norma shakli emas."]]], ["Ma’muriy-huquqiy munosabatlarning elementlarini belgilang.", "Subyekt, obyekt va yuridik faktlar", "Munosabat ishtirokchilari (subyekt), obyekt va yuridik faktlardan iborat.", [["Subyekt, obyekt va sanksiya", "Sanksiya norma elementi, munosabat elementi emas."], ["Gipoteza, dispozitsiya va yuridik faktlar", "Gipoteza va dispozitsiya normaning qismlari."], ["Subyekt, dispozitsiya va yuridik faktlar", "Dispozitsiya normaning qismi; munosabat elementi obyektdir."]]], ["Ma’muriy-huquqiy munosabatlarning yuzaga kelishi, o‘zgarishi yoki bekor bo‘lishiga nima asos bo‘ladi?", "Yuridik faktlar", "Munosabat yuridik fakt (harakat, harakatsizlik, voqea) bilan paydo bo‘ladi.", [["Huquq normasi", "Norma umumiy qoida; munosabat uni qo‘llovchi fakt bilan yuzaga keladi."], ["Subyektning niyati", "Niyat fakt emas, tashqi harakatga aylanmaguncha huquqiy oqibat bermaydi."], ["Huquqiy ong", "Bu ichki qarash, yuridik fakt emas."]]], ["Quyidagilardan qaysilari yuridik faktlarning turlariga xos emas?", "Huquq normasi, subyektning shaxsiy fikri yoki niyati", "Yuridik fakt turlari: harakat, harakatsizlik, voqea va hodisa.", [["Harakat va harakatsizlik", "Bular xos: iroda bilan bog‘liq yuridik faktlar."], ["Voqea", "Bu xos: insonning irodasiga bog‘liq bo‘lmagan fakt."], ["Hodisa", "Bu ham xos tur: tabiiy yoki ijtimoiy holatlar."]]], ["Davlat organlari o‘rtasidagi o‘zaro ma’muriy-huquqiy munosabatlarning turlari ko‘rsatilgan javobni toping.", "Vertikal (subordinatsion) va gorizontal (koordinatsion) munosabatlar", "Organlar o‘rtasida bo‘ysunuv (vertikal) va teng (gorizontal) munosabatlar bo‘ladi.", [["Vertikal va diagonal munosabatlar", "Diagonal munosabat turi nazarda tutilmagan."], ["Gorizontal va fuqarolik-huquqiy munosabatlar", "Fuqarolik-huquqiy munosabat organlar o‘rtasidagi ma’muriy tur emas."], ["Subordinatsion va intizomiy munosabatlar", "Intizomiy munosabat mehnat-intizom sohasiga oid, alohida tur emas."]]], ["Ma’muriy-yustitsion munosabatlarning mazmuni nimadan iborat?", "Ma’muriy nizolarni hal etish va buzilgan huquq va manfaatlarni tiklash", "Organ yoki sud noqonuniy qarorlar bo‘yicha nizoni hal etib, huquqni tiklaydi.", [["Huquqbuzarlik uchun ma’muriy jazo qo‘llash", "Bu yurisdiksion munosabat mazmuni."], ["Fuqaroga litsenziya yoki ruxsat berish", "Bu ma’muriy tartib-taomil munosabati."], ["Quyi organga majburiy ko‘rsatma berish", "Bu vertikal boshqarish-farmoyish munosabati."]]], ["Ma’muriy-yurisdiksion munosabatlarning mazmuni nimadan iborat?", "Huquqbuzarlik sodir etgan shaxsga ma’muriy jazo chorasini qo‘llash", "Yurisdiksion munosabat – huquqbuzarga vakolatli organ jazo qo‘llash jarayonidir.", [["Ma’muriy nizoni hal etib, buzilgan huquqni tiklash", "Bu yustitsion munosabat."], ["Murojaatga ko‘ra ruxsat yoki litsenziya berish", "Bu tartib-taomilga oid munosabat."], ["Yuqori organning quyi organga ko‘rsatma berishi", "Bu vertikal munosabat."]]], ["Ma’muriy-huquqiy normaning tarkibiy qismlarini ko‘rsating?", "Gipoteza, dispozitsiya va sanksiya", "Norma uch qismdan iborat: shart, qoida va oqibat.", [["Gipoteza, dispozitsiya va rekvizit", "Rekvizit hujjat tarkibiga oid, norma qismi emas."], ["Gipoteza, sanksiya va preambula", "Preambula kirish qismi; dispozitsiya tushib qolgan."], ["Dispozitsiya, sanksiya va prezumpsiya", "Gipoteza tushib qolgan; prezumpsiya norma elementi emas."]]], ["Quyidagilardan qaysi birida ma’muriy tartib-taomillarga asoslangan munosabatlar yuzaga kelmaydi?", "Huquqbuzarlik uchun jazo qo‘llash va nizoni hal etishda", "Jazo qo‘llash yurisdiksion, nizoni hal etish yustitsion munosabat; ular tartib-taomil emas.", [["Litsenziya yoki ruxsatnoma berishda", "Bu tartib-taomil munosabati: shaxs murojaati bo‘yicha organ qaror chiqaradi."], ["Ro‘yxatdan o‘tkazishda", "Bu ham tartib-taomil: ariza asosida huquqiy holat rasmiylashtiriladi."], ["Davlat xizmati ko‘rsatishda", "Bu ham tartib-taomil munosabatiga kiradi."]]], ["Quyidagilardan qaysi biri boshqaruv organlari va xususiy shaxslar o‘rtasidagi ma’muriy-huquqiy munosabat turlariga kirmaydi?", "Bir-biriga bo‘ysunmaydigan ikki davlat organi o‘rtasidagi munosabat", "Savol organ va xususiy shaxs munosabati haqida; organlararo munosabat bunga kirmaydi.", [["Ma’muriy tartib-taomil munosabati", "Bu kiradi: shaxs murojaati bo‘yicha organ ish yuritadi."], ["Yurisdiksion munosabat", "Bu kiradi: huquqbuzar shaxsga jazo qo‘llanadi."], ["Nazorat-tekshiruv munosabati", "Bu kiradi: organ xususiy shaxs faoliyatini tekshiradi."]]], ["Ma’muriy-huquqiy normalarning amal qilish hududi bo‘yicha turlarini ko‘rsating.", "Butun hududda (Qoraqalpog‘iston bilan birga) va ma’lum hududlarda amal qiluvchi normalar", "Hudud bo‘yicha norma butun mamlakatda yoki alohida hududda amal qiladi.", [["Doimiy va vaqtinchalik amal qiluvchi normalar", "Bu amal qilish muddati bo‘yicha tur."], ["Imperativ va tavsiyaviy normalar", "Bu majburiyat yuklash shakliga ko‘ra tur."], ["Moddiy va protsessual normalar", "Bu mazmuniga ko‘ra tur."]]], ["Keltirilgan fikrlarning qaysi biri to‘g‘ri?", "Munosabatning bir tomonida doimo davlat organi bo‘ladi va tomonlar yuridik teng emas", "Organ hokimiyat vakolatidan foydalanadi, shu sabab tomonlar teng emas.", [["Munosabatda tomonlar yuridik jihatdan teng huquqli", "Teng huquqlilik fuqarolik huquqiga xos."], ["Munosabatning ikkala tomoni ham xususiy shaxs bo‘lishi mumkin", "Doimiy ishtirokchi davlat organi, xususiy shaxslar o‘rtasida bu munosabat paydo bo‘lmaydi."], ["Davlat organi vakolatsiz ishtirok etadi", "Organ doimo o‘ziga berilgan vakolat doirasida harakat qiladi."]]], ["Vertikal (subordinatsion) munosabatlarning asosiy belgisi nima?", "Bir ishtirokchining boshqasiga tashkiliy bo‘ysunishi va yuqori organning majburiy ko‘rsatma berishi", "Vertikal munosabat bo‘ysunuvga va bir tomonlama majburiy ko‘rsatmaga asoslanadi.", [["Tomonlarning tengligi va o‘zaro kelishuvi", "Bu gorizontal (koordinatsion) munosabat belgisi."], ["Tomonlar o‘rtasida shartnoma tuzilishi", "Bu ma’muriy-shartnoma munosabatiga xos."], ["Nizoni sud orqali hal etilishi", "Bu yustitsion munosabat belgisi."]]], ["Ma’muriy huquq subyektlari – bu?", "Davlat boshqaruvi sohasida huquq va majburiyatlarga ega ma’muriy-huquqiy munosabatlar ishtirokchilari", "Subyekt – munosabatda ishtirok etuvchi, huquq va majburiyati bor shaxs yoki tashkilot.", [["Ma’muriy huquq normalarini chiqaruvchi organlar", "Bu norma ijodkori, subyektning ta’rifi emas."], ["Ma’muriy javobgarlikka tortilgan shaxslar", "Bu subyektlarning bir qismi, to‘liq ta’rif emas."], ["Davlat hokimiyati organlari tizimi", "Bu tor ta’rif: subyektlar xususiy shaxslarni ham qamraydi."]]], ["Ma’muriy huquq subyektlarining asosiy belgilaridan biri to‘g‘ri ko‘rsatilgan javobni toping?", "Ma’muriy huquq layoqati va faoliyat layoqatiga egalik", "Subyekt huquqqa ega bo‘lish va uni amalga oshirish layoqatiga ega bo‘lishi kerak.", [["Davlat tomonidan tayinlanish", "Subyektlarning ko‘pchiligi, masalan fuqarolar, tayinlanmaydi."], ["Mulkiy mustaqillikka egalik", "Bu fuqarolik huquqi subyektiga xos belgi."], ["Daromad olish maqsadida faoliyat yuritish", "Bu tadbirkorlik belgisi, ma’muriy subyektga xos emas."]]], ["Tashkiliy-huquqiy maqomiga ko‘ra ma’muriy huquq subyektlari orasida asosiy subyekt qaysi?", "Davlat organlari va ularning mansabdor shaxslari", "Ular munosabatning doimiy va hokimiyat vakolatli ishtirokchisi.", [["Jismoniy shaxslar", "Ular ishtirokchi, ammo asosiy subyekt emas."], ["Xo‘jalik yurituvchi subyektlar", "Ular tashkilot sifatida ishtirok etadi, asosiy emas."], ["Jamoat birlashmalari", "Ular qo‘shimcha subyektlar."]]], ["Xo‘jalik yurituvchi subyektlar – bu?", "Davlat yoki xususiy mulk shaklidagi korxona, muassasa va tashkilotlar", "Ular mulk shaklidan qat’i nazar xo‘jalik faoliyati bilan shug‘ullanadi.", [["Davlat hokimiyati vakolatiga ega organlar", "Bu davlat organlari ta’rifi."], ["Nodavlat notijorat tashkilotlari", "Ular foyda olishni maqsad qilmaydi."], ["Jismoniy shaxslarning birlashmasi", "Bu jamoat birlashmasi ta’rifiga yaqin."]]], ["Vakolat darajasiga ko‘ra ma’muriy huquq subyektlarining qanday turlari mavjud?", "Boshqaruvchi va bo‘ysunuvchi subyektlar", "Vakolat darajasiga ko‘ra subyekt boshqaradi yoki bo‘ysunadi.", [["Individual va kollektiv subyektlar", "Bu tuzilishiga ko‘ra bo‘linish."], ["Doimiy va vaqtinchalik subyektlar", "Bu amal qilish muddatiga ko‘ra bo‘linish."], ["Davlat va nodavlat subyektlar", "Bu tashkiliy-huquqiy maqomga ko‘ra bo‘linish."]]], ["Ijro etuvchi hokimiyat organlariga xos bo‘lmagan belgi keltirilgan javobni toping?", "Qonun qabul qilish va odil sudlov vakolatini amalga oshirish", "Bular qonun chiqaruvchi va sud hokimiyatining vakolati.", [["Davlat nomidan ish yuritish", "Bu xos belgi: ijroiya organlar davlat nomidan harakat qiladi."], ["Boshqaruv aktlarini qabul qilish vakolati", "Bu xos belgi: organ qarorlar chiqaradi."], ["Vazirlar Mahkamasi tizimiga kirishi", "Bu xos belgi: tizim ijro hokimiyatini tashkil etadi."]]], ["Ijro etuvchi hokimiyat organlari vakolatining xususiyatiga ko‘ra qanday organlarga bo‘linadi?", "Umumiy, maxsus, sohaviy va sohalararo vakolatli organlar", "Vakolat xususiyatiga ko‘ra bo‘linish shu to‘rt turni beradi.", [["Markaziy, hududiy va mahalliy organlar", "Bu hududiy ko‘lamiga ko‘ra bo‘linish."], ["Kollegial va yakkaboshchilik organlari", "Bu rahbarlik usuliga ko‘ra bo‘linish."], ["Umumiy, sohaviy va nazorat organlari", "Maxsus va sohalararo turlar tushib qolgan, nazorat alohida tur emas."]]], ["Soha ichidagi tarmoq faoliyatini muvofiqlashtirish va rahbariy faoliyatni kollegial tashkil etish qaysi organga xos?", "Qo‘mita", "Qo‘mita tarmoq faoliyatini muvofiqlashtiradi va kollegial rahbarlik qiladi.", [["Vazirlik", "Vazirlikda rahbarlik yakkaboshchilik asosida."], ["Agentlik", "Agentlik xizmat ko‘rsatadi va huquqni qo‘llaydi."], ["Inspeksiya", "Inspeksiya nazorat va tekshiruv bilan shug‘ullanadi."]]], ["Sohada davlat xizmatlarini ko‘rsatish va huquqni qo‘llash funksiyalarini amalga oshiradigan maxsus vakolatli organ qaysi?", "Agentlik", "Agentlik xizmat ko‘rsatish va huquqni qo‘llash funksiyalarini bajaradi.", [["Qo‘mita", "Qo‘mita muvofiqlashtirishga yo‘naltirilgan."], ["Inspeksiya", "Inspeksiya asosan nazorat-tekshiruv bilan shug‘ullanadi."], ["Vazirlik", "Vazirlik sohada umumiy boshqaruvni amalga oshiradi."]]], ["Sohada davlat nazorati va tekshiruvni amalga oshiradi, vazirlik tashkiliy bo‘ysunuvida faoliyat yuritadi – qaysi organ?", "Inspeksiya", "Inspeksiya nazorat-tekshiruv funksiyasini vazirlik bo‘ysunuvida bajaradi.", [["Agentlik", "Agentlik xizmat ko‘rsatish va huquqni qo‘llash funksiyasiga ega."], ["Qo‘mita", "Qo‘mita kollegial rahbarlik belgisiga ega."], ["Vazirlik", "Vazirlik boshqa organlarga rahbarlik qiluvchi, yuridik shaxs maqomidagi organ."]]], ["Respublika ijro etuvchi hokimiyat organlarining markaziy apparatlari qanday tarkibda tashkil etiladi?", "Rahbariyat, departament, boshqarma, bo‘lim va mutaxassislar", "Apparat shu bo‘g‘inlardan tashkil topadi.", [["Rahbariyat, kengash, boshqarma va bo‘limlar", "Kengash apparat tarkibiy bo‘linmasi emas."], ["Rahbariyat, departament, sektor va mutaxassislar", "Boshqarma va bo‘lim tushib qolgan."], ["Departament, boshqarma, filial va bo‘limlar", "Rahbariyat tushib qolgan, filial apparat bo‘g‘ini emas."]]], ["Markaziy apparatda shtat birliklari soni nechtadan ortganda departament tashkil etilishi mumkin?", "20 nafar va undan ortiq", "Departament 20 va undan ortiq, boshqarma 7, bo‘lim 2 va undan ortiq shtat birligida tashkil etiladi.", [["7 nafar va undan ortiq", "Bu boshqarma uchun belgilangan miqdor."], ["2 nafar va undan ortiq", "Bu bo‘lim uchun belgilangan miqdor."], ["30 nafar va undan ortiq", "Bunday miqdor belgilanmagan."]]], ["Ma’muriy huquq subyekti sifatida jismoniy shaxslar deganda kimlar tushuniladi?", "O‘zbekiston fuqarolari, chet el fuqarolari va fuqaroligi bo‘lmagan shaxslar", "Jismoniy shaxslar fuqarolikdan qat’i nazar shu uch toifani qamraydi.", [["O‘zbekiston fuqarolari va chet el fuqarolari", "Fuqaroligi bo‘lmagan shaxslar tushib qolgan."], ["O‘zbekiston fuqarolari va muqim yashovchilar", "Bu toifa to‘liq emas: chet elliklar tushib qolgan."], ["Voyaga yetgan fuqarolar va mansabdor shaxslar", "Mansabdorlik jismoniy shaxsning belgisi emas, bu toifa tor."]]], ["Vaqtinchalik ma’muriy subyektlarga qaysilar kiradi?", "Vaqtinchalik komissiyalar, maxsus ishchi guruhlar va saylov komissiyalari", "Ular muayyan vazifa uchun muddatli tashkil etiladi.", [["Vazirliklar, qo‘mitalar va agentliklar", "Bular doimiy faoliyat yuritadigan organlar."], ["Hokimliklar va ularning bo‘limlari", "Bular ham doimiy organlar."], ["Inspeksiya va davlat muassasalari", "Bular doimiy subyektlar."]]], ["Quyidagi davlat qo‘mitalaridan qaysilari mustaqil qo‘mita maqomiga ega?", "Soliq qo‘mitasi, Oila va xotin-qizlar qo‘mitasi, Din ishlari bo‘yicha qo‘mita", "Bular vazirlik huzurida emas, mustaqil maqomda faoliyat yuritadi.", [["Soliq qo‘mitasi, Bojxona qo‘mitasi, Statistika qo‘mitasi", "Bojxona va statistika qo‘mitalari mustaqil emas, boshqa organ huzurida."], ["Oila va xotin-qizlar qo‘mitasi, Mudofaa qo‘mitasi, Din ishlari qo‘mitasi", "Mudofaa qo‘mitasi mustaqil qo‘mitalar qatorida emas."], ["Soliq qo‘mitasi, Din ishlari qo‘mitasi, Favqulodda vaziyatlar qo‘mitasi", "Favqulodda vaziyatlar qo‘mitasi mustaqil qo‘mita sifatida sanalmagan."]]], ["Tashkiliy-huquqiy asoslariga ko‘ra qaysi organ Konstitutsiya asosida tashkil etiladigan davlat organlariga kirmaydi?", "Vazirliklar va qo‘mitalar (qonun hujjatlari asosida tashkil etiladi)", "Ular Konstitutsiyada emas, qonun hujjatlari bilan tashkil etiladi.", [["Vazirlar Mahkamasi", "U Konstitutsiya asosida tashkil etiladi."], ["Oliy Majlis Senati", "U Konstitutsiyada nazarda tutilgan, boshqaruv organi emas."], ["Prezident", "Davlat boshlig‘i Konstitutsiya bilan belgilangan."]]], ["Quyidagilardan qaysi biri respublika davlat boshqaruvi organlari sirasiga kirmaydi?", "Mahalliy ijro hokimiyati organlari (hokimliklar)", "Hokimliklar respublika emas, mahalliy darajadagi organlar.", [["Vazirlik", "U respublika boshqaruv organi."], ["Agentlik", "U ham respublika darajasidagi organ."], ["Inspeksiya", "U ham respublika boshqaruv organlari qatoriga kiradi."]]], ["Belgilangan sohada boshqaruvni amalga oshiradi, rahbarlik yakkaboshchilik asosida, yuridik shaxs – qaysi organ?", "Vazirlik", "Vazirlikda rahbarlik yakkaboshchilik asosida va u yuridik shaxs.", [["Qo‘mita", "Qo‘mitada rahbarlik kollegial."], ["Agentlik", "Agentlik xizmat va huquqni qo‘llash bilan shug‘ullanadi."], ["Inspeksiya", "Inspeksiya nazorat-tekshiruv organi."]]], ["Ma’muriy huquq subyektlari davlat boshqaruvi sohasida nimalarga ega bo‘lishi lozim?", "Ma’muriy huquq layoqati va faoliyat layoqatiga", "Subyekt huquqqa ega bo‘lishi va uni o‘z harakati bilan amalga oshirishi kerak.", [["Mulkiy mustaqillik va yuridik shaxs maqomiga", "Bu fuqarolik huquqi subyektiga xos talab."], ["Siyosiy huquq va saylov layoqatiga", "Bu konstitutsiyaviy huquq tushunchalari."], ["Intizomiy javobgarlik va mehnat layoqatiga", "Bu mehnat huquqi tushunchalari."]]], ["Davlat boshqaruvi faoliyatining shakli nimada aks etadi?", "Boshqaruv mazmunining tashqi ko‘rinishida, huquqiy yoki nohuquqiy harakatlar majmuasida", "Shakl – boshqaruv mazmunining tashqi ifodasi.", [["Boshqaruv organlarining ichki tuzilishida", "Bu tashkiliy tuzilma, faoliyat shakli emas."], ["Boshqaruv qarorlarining ijrosi natijasida", "Bu natija, shakl emas."], ["Boshqaruv subyektlarining vakolatlari ro‘yxatida", "Bu vakolat tushunchasi."]]], ["Keltirilgan fikrlarning qaysi biri to‘g‘ri?", "Boshqaruv shakllari normativ hujjat bilan o‘rnatiladi va faoliyat mazmuniga mos bo‘lishi kerak", "Shakl funksiyalarni amalga oshirish vositasi bo‘lib, mazmunga mos keladi.", [["Boshqaruv shakllari mazmundan mustaqil, o‘zboshimchalik bilan tanlanadi", "Shakl mazmunga mos bo‘lishi shart."], ["Boshqaruv shakllari bir xil bo‘lib, o‘zgarmaydi", "Shakllar xilma-xil va rivojlanib boradi."], ["Boshqaruv shakllari yuridik oqibat keltirmaydi", "Huquqiy shakllar yuridik oqibat keltiradi."]]], ["Ma’muriy-huquqiy shakllarning mazmuniga ko‘ra qanday turlari mavjud?", "Huquq normalarini o‘rnatish va huquq normalarini qo‘llash", "Boshqaruv akti norma o‘rnatadi yoki mavjud normani qo‘llaydi.", [["Huquq normalarini o‘rnatish va ularni talqin qilish", "Talqin alohida shakl sifatida ajratilmaydi."], ["Huquq normalarini qo‘llash va ularni bekor qilish", "Bekor qilish normani o‘rnatish ichida bo‘ladi."], ["Tashkiliy tadbirlar va moddiy-texnik harakatlar", "Bular nohuquqiy shakllar."]]], ["Ma’muriy-huquqiy shakllar qaysi mezonga ko‘ra huquqiy va nohuquqiy shakllarga bo‘linadi?", "Keltirib chiqaradigan oqibatiga ko‘ra", "Yuridik oqibat keltirsa huquqiy, aks holda nohuquqiy shakl.", [["Amalga oshiruvchi subyektiga ko‘ra", "Subyekt bo‘linish mezoni emas."], ["Qo‘llanish hududiga ko‘ra", "Hudud mezon emas."], ["Mazmuniga ko‘ra", "Mazmuniga ko‘ra norma o‘rnatish va qo‘llash shakllari ajratiladi."]]], ["Qaysi qatorda davlat boshqaruvining huquqiy shakllarining turlari keltirilgan?", "Huquqiy me’yorlarni o‘rnatish, qo‘llash va ma’muriy-huquqiy shartnomalar tuzish", "Bu uch shakl huquqiy shakllarni tashkil etadi.", [["Huquqiy me’yorlarni o‘rnatish, tashkiliy tadbirlar va shartnomalar tuzish", "Tashkiliy tadbirlar nohuquqiy shakl."], ["Huquqiy me’yorlarni qo‘llash, moddiy-texnik harakatlar va shartnomalar", "Moddiy-texnik harakatlar nohuquqiy shakl."], ["Normalarni o‘rnatish, qo‘llash va tashkiliy tadbirlar", "Tashkiliy tadbirlar nohuquqiy shakl."]]], ["Ma’muriy-huquqiy shartnomalarning maqsadi nimadan iborat?", "Ommaviy manfaatlarni qondirish uchun boshqaruv vazifa va vakolatlarini o‘z zimmasiga olishni kelishish", "Shartnoma ommaviy manfaat yo‘lida vakolat va vazifalarni kelishadi.", [["Tomonlarning mulkiy foydasini ko‘paytirish", "Bu fuqarolik shartnomasi maqsadi."], ["Huquqbuzarga jazo choralarini belgilash", "Bu yurisdiksiya, shartnoma maqsadi emas."], ["Quyi organga majburiy ko‘rsatma berish", "Bu bir tomonlama farmoyish, kelishuv emas."]]], ["Quyidagilardan qaysi biri davlat boshqaruvining nohuquqiy shakliga xos?", "Yuridik oqibat keltirmaydi va ma’muriy-huquqiy munosabatni vujudga keltirmaydi", "Nohuquqiy shakl yuridik oqibatsiz va munosabat yaratmaydi.", [["Majburiy yuridik kuchga ega bo‘lishi", "Bu huquqiy shaklga xos."], ["Vakolatli organ tomonidan akt chiqarilishi", "Akt chiqarish huquqiy shakl."], ["Ma’muriy-huquqiy munosabatni o‘zgartirishi", "Bu huquqiy shaklning natijasi."]]], ["Qaysi qatorda davlat boshqaruvining nohuquqiy shakllari turlari keltirilgan?", "Tashkiliy tadbirlar va moddiy-texnik harakatlar (operatsiyalar)", "Bular yuridik oqibat keltirmaydi.", [["Normativ aktlar qabul qilish va tashkiliy tadbirlar", "Normativ akt huquqiy shakl."], ["Moddiy-texnik harakatlar va ma’muriy shartnomalar", "Shartnoma huquqiy shakl."], ["Yakka hujjatlar chiqarish va operatsiyalar", "Yakka hujjat huquqiy shakl."]]], ["Boshqaruvning huquqiy hujjatlari o‘zida nimani ifodalaydi?", "Bir tomonlama hokimiyat ko‘rsatmasini va majburiy qarorlarning yuridik shaklini", "Akt majburiy bo‘lib, yuridik oqibat keltiradi.", [["Tomonlarning o‘zaro kelishuvini va ixtiyoriy tavsiyalarni", "Bu shartnoma yoki tavsiyaga xos."], ["Boshqaruv xodimlarining shaxsiy fikrini", "Fikr yuridik hujjat emas."], ["Tashkiliy tadbirlar rejasini", "Reja nohuquqiy shaklga oid."]]], ["Boshqaruvning huquqiy hujjatlari xususiyatiga zid bo‘lgan javobni toping?", "Akt bajarilishi ixtiyoriy yoki tavsiyaviy xususiyatga ega", "Akt imperativ, qaratilgan subyekt uchun majburiy.", [["Akt imperativ xususiyatga ega", "Bu xos belgi."], ["Akt yuridik oqibat keltirib chiqaradi", "Bu xos belgi."], ["Akt vakolatli organ tomonidan chiqariladi", "Bu ham xos belgi."]]], ["Qonunni qo‘llovchi va farmoyish beruvchi xususiyat huquqiy hujjatlarning qaysi turiga xos?", "Individual hujjatlar", "Individual hujjat qonunni muayyan holatga qo‘llaydi va farmoyish beradi.", [["Normativ hujjatlar", "Normativ hujjat umumiy qoida o‘rnatadi."], ["Tavsiyaviy hujjatlar", "Bu majburiy emas."], ["Axborot hujjatlari", "Bu yuridik oqibat keltirmaydi."]]], ["Hujjat matnida tasdiqlashga vakolatli shaxsning lavozimi, imzosi, ismining bosh harfi va familiyasi aks ettirilishi qaysi talablar sirasiga kiradi?", "Normativ-huquqiy hujjatlarning rekvizitlari", "Lavozim va imzo hujjat rekvizitlari hisoblanadi.", [["Hujjatning mazmuniy talablari", "Mazmuniy talab matn mohiyatiga tegishli."], ["Hujjatni qabul qilish tartibi talablari", "Bu protsedura talablari."], ["Hujjatning kuchga kirish talablari", "Bu amal qilish muddatiga oid."]]], ["Davlat boshqaruvi faoliyatining ma’muriy-huquqiy usullari kimga ta’sir ko‘rsatishga yo‘naltiriladi?", "Boshqariluvchi obyektlarga (fuqaro, yuridik shaxs, davlat xizmatchisi)", "Usullar boshqariluvchi obyekt va shaxslarga ta’sir etadi.", [["Boshqaruvchi organlarga", "Usul boshqaruvchidan boshqariluvchiga yo‘naladi."], ["Qonun chiqaruvchi organlarga", "Ular boshqaruv usullari obyekti emas."], ["Sud organlariga", "Sudlar mustaqil, ularga boshqaruv usuli qo‘llanmaydi."]]], ["Kasbiy tajriba va ilmiy yutuqlarga tayanib, boshqaruv faoliyati rivojidagi o‘zgarishlarni oldindan ko‘ra bilish davlat boshqaruvining qaysi funksiyasi mazmuni?", "Istiqbolni belgilash (prognozlash) funksiyasi", "Istiqbolni belgilash kelgusi o‘zgarishlar va jarayon natijalarini oldindan ko‘ra bilishga asoslanadi.", [["Rejalashtirish funksiyasi", "Reja aniq vazifa va muddatlarni belgilaydi; oldindan ko‘ra bilish undan avval keladi."], ["Muvofiqlashtirish funksiyasi", "U organlar harakatini uyg‘unlashtiradi, kelajakni bashorat qilish bilan bog‘liq emas."], ["Kontrol qilish funksiyasi", "U bajarilgan ishning natijasini tekshiradi, oldindan ko‘rishni anglatmaydi."]]], ["Normada nazarda tutilgan sharoitda aynan shunday harakat qilish uchun to‘g‘ridan-to‘g‘ri majburiyat yuklash huquqiy ta’sirning qaysi uslubi?", "Buyruq (ko‘rsatma) berish uslubi", "Buyruq muayyan harakatni bajarishni yuridik majburiyat sifatida yuklaydi.", [["Man etish (taqiqlash) uslubi", "Taqiq harakatdan o‘zini tiyishni talab qiladi, harakat qilishni emas."], ["Ruxsat berish uslubi", "Ruxsat harakat qilish imkonini beradi, majburiyat yuklamaydi."], ["Tavsiya berish uslubi", "Tavsiya majburiy kuchga ega emas, yuridik majburiyat yuzaga kelmaydi."]]], ["Tashkiliy-huquqiy maqomiga ko‘ra ma’muriy huquq subyektlari orasida asosiy subyekt qaysi?", "Davlat organlari va ularning mansabdor shaxslari", "Ma’muriy-huquqiy munosabatda davlat nomidan hokimiyat vakolatini amalga oshiruvchi organ asosiy subyekt.", [["Fuqarolarning o‘zini o‘zi boshqarish organlari", "Ular ma’muriy huquq subyekti, ammo davlat hokimiyati organi sifatida asosiy o‘rinda turmaydi."], ["Jamoat birlashmalari", "Ular tegishli munosabatlarda qatnashadi, ammo asosiy subyekt maqomiga ega emas."], ["Xo‘jalik yurituvchi subyektlar", "Ular ko‘pincha boshqaruv obyekti sifatida ishtirok etadi."]]], ["Sohada davlat xizmatlarini ko‘rsatish va huquqni qo‘llash funksiyasini amalga oshiruvchi maxsus vakolatli organ qaysi?", "Agentlik", "Agentlik xizmat ko‘rsatish va huquqni qo‘llash vazifasini bajaradi.", [["Vazirlik", "Vazirlik sohada davlat boshqaruvini yakkaboshchilik asosida amalga oshiradi."], ["Inspeksiya", "Inspeksiya nazorat va tekshiruv vazifasini bajaradi."], ["Davlat qo‘mitasi", "Qo‘mita tarmoqlararo muvofiqlashtirish va boshqaruvga yo‘naltirilgan organ."]]], ["Soha va tarmoqlarda davlat nazorati va tekshiruvni amalga oshiradi, vazirlik tashkiliy bo‘ysunuvida ishlaydi. Bu qaysi organga xos?", "Inspeksiya", "Inspeksiyaning asosiy vazifasi nazorat va tekshiruv hisoblanadi.", [["Agentlik", "Agentlik xizmat ko‘rsatish va huquqni qo‘llash bilan shug‘ullanadi."], ["Vazirlik", "Vazirlik boshqaruvni olib boradi, o‘zi boshqa organlarga bo‘ysunmaydi."], ["Davlat qo‘mitasi", "Qo‘mita nazoratdan ko‘ra boshqaruv va muvofiqlashtirishga yo‘naltirilgan."]]], ["Respublika ijro etuvchi organlarining markaziy apparatida shtat birliklari soni nechta va undan ortganda departament tashkil etilishi mumkin?", "20 nafar va undan ortiq", "Departament uchun shtat birliklari soni 20 nafar va undan ko‘p bo‘lishi kerak.", [["7 nafar va undan ortiq", "Bu ko‘rsatkich boshqarma tashkil etish uchun belgilangan."], ["15 nafar va undan ortiq", "Qonunchilikda bunday chegara belgilanmagan."], ["30 nafar va undan ortiq", "Bunday chegara belgilanmagan, departament uchun 20 nafar yetarli."]]], ["Belgilangan sohada davlat boshqaruvini amalga oshiradi, rahbarlik yakkaboshchilik asosida tashkil etiladi, yuridik shaxs hisoblanadi. Bu qaysi organga xos?", "Vazirlik", "Vazirlik sohadagi boshqaruvni yakkaboshchilik asosida olib boruvchi yuridik shaxs.", [["Agentlik", "Agentlik xizmat ko‘rsatish va huquqni qo‘llash bilan chegaralangan vakolatga ega."], ["Inspeksiya", "Inspeksiya nazorat vakolatiga ega, soha boshqaruvini to‘liq amalga oshirmaydi."], ["Davlat qo‘mitasi", "Qo‘mita faoliyatida jamoaviy muvofiqlashtirish elementlari ham mavjud."]]], ["Qonunni qo‘llovchi va farmoyish beruvchi xususiyat boshqaruv hujjatlarining yuridik xususiyatiga ko‘ra qaysi turiga xos?", "Individual hujjatlar", "Individual hujjat qonunni muayyan holatga qo‘llaydi va farmoyish beradi.", [["Normativ hujjatlar", "Normativ hujjat umumiy xulq-atvor qoidasini o‘rnatadi, muayyan holatga qo‘llanmaydi."], ["Umumiy hujjatlar", "Bunday tur yuridik xususiyat bo‘yicha tasniflashda ajratilmaydi."], ["Ichki-tashkiliy hujjatlar", "Ular organ ichki faoliyatini tartiblaydi, qonunni qo‘llash mazmuniga ega emas."]]], ["Davlat boshqaruvining ma’muriy usullari mazmuniga qaysi javob mos keladi?", "Boshqaruv subyektining obyektga bir tomonlama davlat-hokimiyat ta’sirini ko‘rsatishi va majburiy huquqiy aktlarni qo‘llashi", "Ma’muriy usul hokimiyat tartibidagi bir tomonlama majburiy ta’sirga asoslanadi.", [["Tomonlar kelishuviga asoslangan, tenglik tamoyilidagi ta’sir ko‘rsatish", "Bu shartnomaviy munosabatlarga xos, ma’muriy usulga zid."], ["Tushuntirish va tarbiyalash orqali ixtiyoriy bajarishga erishish", "Bu ishontirish usuli mazmuni."], ["Moddiy manfaatdorlikni oshirish orqali bajarishga undash", "Bu iqtisodiy usul mazmuni."]]], ["Ishontirish usuli shaxsning xulq-atvori va ongiga qanday choralar orqali ta’sir ko‘rsatadi?", "Tushuntirish, tarbiyalash, rag‘batlantirish va boshqa axloqiy choralar orqali", "Ishontirish ongga ta’sir etib, ixtiyoriy bajarishga olib keladi.", [["Jarima va ogohlantirish choralari orqali", "Bular majburlash va jazo choralari, ishontirishga kirmaydi."], ["Majburiy ijro va cheklov choralari orqali", "Bular majburlash usulining tarkibiy qismi."], ["Mulkni olib qo‘yish choralari orqali", "Bu majburlov ta’siri, ongga axloqiy ta’sir emas."]]], ["Ma’muriy majburlash choralarining turlarini ko‘rsating.", "Ma’muriy oldini olish, ma’muriy cheklash va ma’muriy jazo choralari", "Majburlash uch turga bo‘linadi: oldini olish, cheklash va jazo.", [["Ma’muriy oldini olish, ma’muriy tiklash va ma’muriy rag‘bat choralari", "Tiklash va rag‘bat majburlash turlariga kirmaydi."], ["Ma’muriy ogohlantirish, ma’muriy kechirish va ma’muriy shartnoma choralari", "Kechirish va shartnoma majburlash turlari emas."], ["Ma’muriy nazorat, ma’muriy hisob va ma’muriy jazo choralari", "Nazorat va hisob majburlash turi emas, jazo esa uning bir turi."]]], ["Muayyan moddiy yoki nomoddiy tovarlarni ishlab chiqarish orqali ehtiyojlarni qondirishga qaratilgan faoliyat – bu?", "Xizmat ko‘rsatish", "Xizmat ko‘rsatish tovar yaratish orqali ehtiyojni qondirishga yo‘naltirilgan faoliyat.", [["Davlat boshqaruvi", "Boshqaruv hokimiyat ta’sirini ko‘rsatadi, ehtiyojni tovar bilan qondirmaydi."], ["Tadbirkorlik faoliyati", "U foyda olishga qaratilgan, tushuncha mazmuni boshqacha."], ["Huquqni qo‘llash faoliyati", "U normani muayyan holatga tatbiq etishni anglatadi."]]], ["Qaysi davlat konsepsiyasida asosiy vazifa – insonning munosib hayoti va erkin rivojlanishi uchun sharoit yaratish, ijtimoiy ehtiyojlarni qondirish?", "Ijtimoiy davlat konsepsiyasi", "Ijtimoiy davlat insonning munosib hayoti uchun sharoit yaratishni o‘z vazifasi deb biladi.", [["Huquqiy davlat konsepsiyasi", "U qonun ustuvorligi va inson huquqlari kafolatiga urg‘u beradi."], ["Liberal davlat konsepsiyasi", "U davlatning iqtisodiy va ijtimoiy hayotga aralashuvini cheklashni nazarda tutadi."], ["Qo‘riqchi davlat konsepsiyasi", "U davlat vazifasini tartibni saqlash bilan chegaralaydi."]]], ["Ommaviy xizmatlar ko‘rsatishga xos bo‘lmagan belgini toping.", "Xizmat ko‘rsatuvchi murojaatni qabul qilishdan bosh tortishi mumkinligi", "Murojaat etgan shaxsga xizmat kafolatlanadi, rad etish belgisi unga xos emas.", [["Murojaat etgan shaxsga xizmat ko‘rsatilishi kafolatlanishi", "Bu ommaviy xizmatning xos belgisi."], ["Xizmatlar ommaviy manfaatlar bilan bog‘liq ehtiyojlarni qondirishi", "Bu xos belgi."], ["Xizmat ko‘rsatish xarajat talab qiluvchi faoliyat ekanligi", "Bu ham xos belgi."]]], ["Ommaviy xizmatlar ommaviy manfaatlar bilan bog‘liq qanday ehtiyojlarni qondirishga qaratilgan?", "Individual ehtiyojlarni", "Ommaviy xizmat ommaviy manfaat doirasida individual ehtiyojni qondiradi.", [["Davlat apparatining ichki ehtiyojlarini", "Ichki ehtiyoj ommaviy xizmat doirasiga kirmaydi."], ["Xo‘jalik yurituvchilarning tijorat ehtiyojlarini", "Tijorat manfaati ommaviy xizmatning maqsadi emas."], ["Xalqaro tashkilotlar ehtiyojlarini", "Bunday ehtiyojlar ommaviy xizmatning mazmuni emas."]]], ["Funksional yo‘nalishiga ko‘ra ommaviy xizmatlar turlarini ko‘rsating.", "Amaliy, huquqiy va moliyaviy ommaviy xizmatlar", "Funksional tasnifda amaliy, huquqiy va moliyaviy xizmatlar ajratiladi.", [["Amaliy, ijtimoiy va madaniy xizmatlar", "Ijtimoiy va madaniy xizmat funksional tur sifatida ajratilmaydi."], ["Huquqiy, moliyaviy va ma’muriy xizmatlar", "Ma’muriy xizmat alohida funksional tur emas."], ["Moddiy, nomoddiy va aralash xizmatlar", "Bu tasnif xizmatning moddiyligi bo‘yicha."]]], ["Tashkil etuvchi va bajaruvchilarning huquqiy maqomiga ko‘ra ommaviy xizmatlar turlarini ko‘rsating.", "Davlat, o‘zini o‘zi boshqarish organlari va nodavlat tashkilotlar tomonidan ko‘rsatiladigan xizmatlar", "Maqomga ko‘ra uch guruh bor: davlat, o‘zini o‘zi boshqarish organlari va nodavlat tashkilotlar.", [["Davlat, hududiy va tarmoq tomonidan ko‘rsatiladigan xizmatlar", "Hududiy va tarmoq bu tasnifda yo‘q."], ["Markaziy, mahalliy va xalqaro xizmatlar", "Bu bo‘linish maqom bo‘yicha emas."], ["Birlamchi, ikkilamchi va qo‘shimcha xizmatlar", "Bunday tasnif qo‘llanmaydi."]]], ["Qonunda ma’muriy tartib-taomillarning nechta asosiy prinsipi belgilangan?", "13 ta", "Qonunda 13 ta asosiy prinsip nazarda tutilgan.", [["9 ta", "Qonunda prinsiplar bundan ko‘p."], ["11 ta", "Bu son qonundagi ro‘yxatga mos kelmaydi."], ["15 ta", "Qonunda bundan kam prinsip bor."]]], ["Yuridik shaxslar vakillari ma’muriy ish yuritishda nimada belgilangan vakolatlari doirasida ishtirok etadi?", "Qonun hujjatlari, ta’sis hujjatlari yoki qonunga muvofiq rasmiylashtirilgan ishonchnomada", "Vakolat qonun, ta’sis hujjati yoki qonuniy ishonchnomaga tayanadi.", [["Ma’muriy organ rahbarining og‘zaki topshirig‘ida", "Og‘zaki topshiriq vakolat asosi bo‘la olmaydi."], ["Yuridik shaxsning ichki buyrug‘ida", "Ichki buyruq tashqi munosabatda yetarli emas."], ["Notarial tasdiqlanmagan oddiy xatda", "Rasmiylashtirilmagan xat vakolatni tasdiqlamaydi."]]], ["Ma’muriy organda ma’muriy ish yuritish qaysi tilda olib boriladi?", "O‘zbek, qoraqalpoq yoki joydagi ko‘pchilik aholi so‘zlashadigan tilda", "Ish yuritish til shu tillardan birida yuritiladi.", [["O‘zbek tilida va talab bo‘lsa rus tilida", "Rus tili alohida talabsiz belgilanmagan."], ["Davlat tilida, so‘ralsa ingliz tilida", "Qonunda bunday qoida yo‘q."], ["Manfaatdor shaxs tanlagan istalgan tilda", "Til tanlash bunday erkin emas."]]], ["Ma’muriy tartib-taomillarning qanday ko‘rinishlari mavjud?", "Ma’muriy ish yuritish, ma’muriy shikoyat bo‘yicha ish yuritish va ijro ishini yuritish", "Ko‘rinishlar: ish yuritish, shikoyat bo‘yicha ish yuritish va ijro ishi.", [["Ma’muriy ish yuritish, sud ishi va jazo ijrosi", "Sud ishi va jazo ijrosi bu tasnifda yo‘q."], ["Ma’muriy shikoyat, ma’muriy nazorat va taftish", "Nazorat va taftish alohida ko‘rinish emas."], ["Ma’muriy ish yuritish, kelishuv va arbitraj", "Kelishuv va arbitraj ko‘rinishlar sirasida emas."]]], ["Fuqarolarning iqtisodiy imkoniyati yoki ijtimoiy maqomi bilan bog‘liq bo‘ladigan ommaviy xizmatlar qaysilar?", "Ijtimoiy prestij xizmatlari, masalan, xususiy ta’lim va yuqori darajadagi tibbiy yordam", "Prestij xizmatlaridan foydalanish iste’molchining to‘lov qobiliyati va maqomiga bog‘liq.", [["Kafolatlangan ijtimoiy xizmatlar, masalan, bepul boshlang‘ich tibbiy yordam va majburiy ta’lim", "Bular davlat kafolatlagan xizmatlar bo‘lib, shaxsning daromadiga bog‘liq emas."], ["Universal kommunal xizmatlar, masalan, elektr, suv va gaz bilan ta’minlash va chiqindi tashish", "Bunday xizmatlar umumiy ehtiyojga mo‘ljallangan, maqomga qarab ajratilmaydi."], ["Majburiy huquqiy xizmatlar, masalan, ro‘yxatdan o‘tkazish, litsenziyalash va sertifikatlash", "Bular huquqiy oqibat keltiruvchi xizmatlar, iqtisodiy imkoniyatga bog‘liq tur emas."]]], ["Sanatoriy yoki dam olish uyi xizmatlari moddiy va nomoddiy xususiyati bo‘yicha ommaviy xizmatlarning qaysi turiga kiradi?", "Aralash xizmatlar: moddiy-maishiy va ijtimoiy-madaniy ehtiyojni birgalikda qondiradi", "Joylashtirish va ovqatlanish moddiy, sog‘lomlashtirish va dam olish nomoddiy jihat; ikkalasi birlashgan.", [["Moddiy xizmatlar: ehtiyoj joylashtirish va ovqatlantirish orqali jismoniy qondiriladi", "Moddiy jihat bor, ammo xizmat mazmuni uning bilan tugamaydi, madaniy-sog‘lomlashtirish ham bor."], ["Nomoddiy xizmatlar: ehtiyoj dam olish va sog‘lomlashtirish orqali ma’naviy qondiriladi", "Nomoddiy jihat mavjud, ammo turar joy va ovqat kabi moddiy qism ham bor."], ["Amaliy xizmatlar: ehtiyoj kundalik maishiy ta’minot orqali bevosita qondiriladi", "Amaliy xizmat funksional tasnif turi, moddiylik bo‘yicha tasnifga kirmaydi."]]], ["Hududda fuqarolar hisobini yuritish va aholini ijtimoiy qo‘llab-quvvatlash xizmatlarini qaysi subyektlar amalga oshiradi?", "Fuqarolarning o‘zini o‘zi boshqarish organlari (mahalla fuqarolar yig‘inlari)", "Mahalla hududda aholi bilan bevosita ishlovchi o‘zini o‘zi boshqarish organi.", [["Hokimlik huzuridagi hududiy ijro etuvchi organlar va ularning tarkibiy bo‘linmalari", "Hokimlik ijro vakolatiga ega, ammo bu xizmat o‘zini o‘zi boshqarish organlari zimmasida."], ["Davlat xizmatlari markazlari va ularning tuman hamda shahar filiallari", "Markazlar ariza qabul qilish va rasmiylashtirishga ixtisoslashgan, hisob yuritishga emas."], ["Hududiy ijtimoiy himoya bo‘limlari va nodavlat notijorat tashkilotlari", "Ular ko‘mak beradi, ammo hudud aholisi hisobini yuritish ularning vazifasi emas."]]], ["Aholining keng qatlamlari uchun mo‘ljallangan, ijtimoiy ahamiyatga ega xizmatlar xarajatlari kim hisobidan qoplanadi?", "Davlat yoki mahalliy byudjet mablag‘lari hisobidan", "Ijtimoiy ahamiyatli xizmatlar jamiyat manfaati uchun byudjetdan moliyalashtiriladi.", [["Xizmatdan foydalanuvchilarning to‘lovlari va ixtiyoriy badallari hisobidan", "To‘lov bunday xizmatlarning ommaviyligini cheklaydi, ular byudjetdan qoplanadi."], ["Xizmat ko‘rsatuvchi tashkilotning tadbirkorlik daromadlari hisobidan", "Daromad tijorat xizmatlariga xos, ijtimoiy xizmatlar uchun asosiy manba emas."], ["Davlat maqsadli jamg‘armalari va homiylik mablag‘lari hisobidan", "Bular qo‘shimcha manba bo‘lishi mumkin, ammo asosiy manba byudjetdir."]]], ["Ommaviy xizmatlarni ko‘rsatish kimning bevosita xarajatli faoliyati hisoblanadi?", "Xizmat ko‘rsatuvchining (provayderning) faoliyati", "Xizmatni bevosita amalga oshirgan provayder resurs va xarajatlarni sarflaydi.", [["Xizmatdan foydalanuvchi shaxsning faoliyati", "Foydalanuvchi xizmatni oladi, uni ko‘rsatish xarajatini u ko‘tarmaydi."], ["Nazorat qiluvchi davlat organining faoliyati", "Nazoratchi sifatni tekshiradi, xizmatni ko‘rsatmaydi."], ["Xizmatni tashkil etuvchi organning faoliyati", "Tashkil etuvchi tizimni yaratadi, bevosita bajarish va xarajat provayderda."]]], ["Muayyan huquqiy oqibat keltirib chiqaradigan harakatlarda namoyon bo‘ladigan ommaviy xizmatlar qaysilar?", "Huquqiy xizmatlar, masalan, litsenziyalash, ro‘yxatdan o‘tkazish, sertifikatlash va apostil", "Bu xizmatlar huquq yaratadi, o‘zgartiradi yoki tasdiqlaydi.", [["Moliyaviy xizmatlar, masalan, subsidiya, imtiyozli kredit va soliq imtiyozlari berish", "Ular mablag‘ bilan bog‘liq, huquqiy holat o‘zgartirish asosiy mazmuni emas."], ["Amaliy xizmatlar, masalan, jamoat transporti, kommunal va birinchi tibbiy yordam", "Ular kundalik ehtiyojni bevosita qondiradi, huquqiy oqibat yaratmaydi."], ["Axborot xizmatlari, masalan, ma’lumotnoma, yo‘riqnoma va maslahat berish", "Axborot berish huquqiy holatni o‘zgartirmaydi."]]], ["2025-yil 14-iyuldagi PF-111-son farmon bilan Davlat xizmatini rivojlantirish agentligi negizida qaysi agentlik tashkil etildi?", "Boshqaruv samaradorligi agentligi", "Farmon bilan agentlik shu nom bilan qayta tashkil etilgan.", [["Davlat boshqaruvi samaradorligi agentligi", "Nomi o‘xshash, ammo farmondagi rasmiy nom bunday emas."], ["Boshqaruv islohotlari va samaradorlik agentligi", "Bunday nomdagi agentlik tashkil etilmagan."], ["Davlat xizmati samaradorligi agentligi", "Farmonda agentlik nomi boshqaruv samaradorligiga ishora qiladi."]]], ["Davlat fuqarolik xizmatini 2030-yilgacha rivojlantirish strategiyasi qaysi hujjat bilan tasdiqlangan?", "Prezidentning 2025-yil 19-iyundagi PF-95-son farmoni", "Strategiya Prezident farmoni bilan shu sanada tasdiqlangan.", [["Prezidentning 2025-yil 14-iyuldagi PF-111-son farmoni", "Bu farmon agentlikni qayta tashkil etish haqida, strategiya haqida emas."], ["Prezidentning 2025-yil 19-iyundagi PQ-95-son qarori", "Hujjat turi noto‘g‘ri: strategiya farmon bilan tasdiqlangan."], ["Vazirlar Mahkamasining 2025-yil 19-iyundagi 95-son qarori", "Strategiyani Vazirlar Mahkamasi emas, Prezident tasdiqlagan."]]], ["Davlat xizmatchilari davlat organi vakolatlari va mansab majburiyatlarini nimaning evaziga bajaradi?", "Belgilangan pul mukofoti (ish haqi) evaziga", "Xizmat haq to‘lanadigan faoliyat; ish haqi uning evazi.", [["Davlat kafolatlagan ijtimoiy imtiyozlar va nafaqalar evaziga", "Imtiyoz va nafaqa qo‘shimcha kafolat, xizmat evazi emas."], ["Lavozim bo‘yicha beriladigan malaka darajasi va unvon evaziga", "Daraja va unvon maqomni bildiradi, to‘lov evazi emas."], ["Xizmat natijasiga qarab to‘lanadigan rag‘bat va mukofotlar evaziga", "Rag‘bat qo‘shimcha, asosiy evaz belgilangan ish haqi."]]], ["Qaysi faoliyat davlat fuqarolik xizmatini o‘tash bilan bog‘liq cheklovlar sirasiga kirmaydi?", "Pedagogik, ilmiy va ijodiy faoliyat bilan shug‘ullanish", "Bu faoliyat taqiqlanmagan va cheklov emas.", [["Boshqa haq to‘lanadigan lavozim yoki faoliyat bilan shug‘ullanish", "Bu cheklov hisoblanadi."], ["Yaqin qarindoshlar bilan to‘g‘ridan-to‘g‘ri bo‘ysunish asosida xizmat qilish", "Bu ham cheklov sanaladi."], ["Xizmat vazifasi munosabati bilan sovg‘a olish va mablag‘ qabul qilish", "Bu ham cheklovlar qatoriga kiradi."]]], ["Davlat xizmatini o‘tish jarayonining fakultativ (majburiy bo‘lmagan) bosqichi qaysi?", "Xizmatchini rag‘batlantirish choralarini qo‘llash", "Rag‘batlantirish qo‘llanishi shart bo‘lmagan bosqich.", [["Xizmatchi faoliyatini attestatsiyadan o‘tkazish", "Attestatsiya majburiy bosqichlardan biri."], ["Xizmatchining malakasini muntazam oshirish", "Malaka oshirish majburiy bosqich."], ["Xizmatchini boshqa lavozimga o‘tkazish", "Lavozimga o‘tkazish jarayonning majburiy bosqichlariga kiradi."]]], ["Qaysi davlat fuqarolik xizmatchilari rotatsiya qilinmaydi?", "Malaka oshirish kurslarida o‘qiyotgan xizmatchilar", "Qayta tayyorlash yoki malaka oshirishdagilar rotatsiyadan ozod.", [["Intizomiy jazo muddati tugamagan xizmatchilar", "Bunday xizmatchilar rotatsiyadan ozod qilinmagan."], ["Yaqin qarindoshi bilan bir organda ishlovchi xizmatchilar", "Rotatsiya aksincha shunday holatni bartaraf etishga xizmat qilishi mumkin."], ["Attestatsiyadan o‘tmagan xizmatchilar", "Attestatsiyadan o‘tmaganlik rotatsiyani istisno etmaydi."]]], ["Quyidagilardan qaysi biri davlat xizmatchisiga qo‘llanadigan rag‘batlantirish choralariga kirmaydi?", "Hayfsan berish", "Hayfsan intizomiy jazo turi, rag‘batlantirish emas.", [["Pul mukofoti berish", "Bu rag‘batlantirish chorasi."], ["Minnatdorchilik e’lon qilish", "Bu ham rag‘batlantirish chorasi."], ["Navbatdan tashqari malaka darajasi berish", "Bu ham rag‘batlantirish chorasi."]]], ["Davlat fuqarolik xizmati lavozimini pasaytirish davlat fuqarolik xizmatchisiga nisbatan qo‘llanadigan qaysi chora?", "Intizomiy jazo choralaridan biri", "Lavozimni pasaytirish intizomiy javobgarlik turi.", [["Rag‘batlantirish choralaridan biri", "Pasaytirish jazo, rag‘bat emas."], ["Moddiy javobgarlik choralaridan biri", "Moddiy javobgarlik zararni qoplashga qaratilgan."], ["Mehnat shartnomasini bekor qilish asoslaridan biri", "Lavozim pasayishi shartnomani bekor qilish emas."]]], ["my.gov.uz qanday portal?", "Yagona interaktiv davlat xizmatlari portali", "Portal elektron davlat xizmatlaridan foydalanishning yagona nuqtasi.", [["Yagona ochiq ma’lumotlar va hisobotlar portali", "Ochiq ma’lumotlar portali boshqa maqsadga ega, xizmat ko‘rsatmaydi."], ["Murojaatlar va jamoatchilik muhokamasi yagona portali", "Murojaat va muhokama alohida platformalar vazifasi."], ["Davlat xaridlari va elektron auksion yagona portali", "Xaridlar boshqa tizimda yuritiladi."]]], ["Davlat xizmatchilari xizmatni davlat organidagi nima asosida olib borishi lozim?", "Davlat organida nazarda tutilgan shtat jadvali asosida", "Lavozimlar tarkibi shtat jadvalida belgilanadi.", [["Organ rahbari tasdiqlagan ichki mehnat tartibi qoidalari asosida", "Qoidalar tartib-intizomni belgilaydi, lavozimlar tarkibini emas."], ["Lavozim yo‘riqnomasi va vazifalar ro‘yxati asosida", "Yo‘riqnoma vazifani aniqlaydi, shtat birligini emas."], ["Mehnat shartnomasida belgilangan topshiriqlar asosida", "Shartnoma shaxsiy shartlarni belgilaydi, shtat tuzilmasini emas."]]], ["Davlat fuqarolik xizmatiga kirish qanday asosda amalga oshiriladi?", "Lavozimga tayinlash yoki tanlov asosida", "Kirish tayinlash yoki tanlov orqali bo‘ladi.", [["Saylov yoki lavozimga tayinlash asosida", "Saylov siyosiy lavozimlarga xos."], ["Tanlov yoki attestatsiya natijalari asosida", "Attestatsiya xizmat jarayonidagi baholash bosqichi, kirish asosi emas."], ["Lavozimga tayinlash yoki malaka imtihoni asosida", "Imtihon alohida asos sifatida belgilanmagan."]]], ["Ruxsat berish va litsenziyalash bilan bog‘liq jarayon ma’muriy protsessning qaysi turiga kiradi?", "Tartib-taomillar bilan bog‘liq ma’muriy protsess", "Ruxsat va litsenziya berish ma’muriy tartib-taomil hisoblanadi.", [["Boshqaruv bilan bog‘liq ma’muriy protsess", "U kundalik boshqaruv qarorlari jarayoniga tegishli."], ["Nazorat-taftish sohasidagi ma’muriy protsess", "U tekshiruv faoliyatiga xos."], ["Yurisdiksiyaviy ma’muriy protsess", "U huquqbuzarlik ishlarini ko‘rishga xos."]]], ["Yustitsiyaviy ma’muriy protsessning mazmuni nimadan iborat?", "Shikoyat asosida organ faoliyatida qonuniylikni tiklash va ma’muriy hujjat qabul qilish jarayoni", "Yustitsiyaviy protsess shikoyatni ko‘rib, qonuniylikni ta’minlaydi.", [["Ma’muriy huquqbuzarlik ishlarini ko‘rib, javobgarlik choralarini qo‘llash jarayoni", "Bu yurisdiksiyaviy protsess mazmuni."], ["Ruxsat va litsenziya berish orqali shaxs huquqini amalga oshirishga ko‘maklashish jarayoni", "Bu tartib-taomillar bilan bog‘liq protsess."], ["Organ faoliyati ustidan rejali tekshiruv o‘tkazib, kamchiliklarni aniqlash jarayoni", "Bu nazorat-taftish protsessi."]]], ["Yurisdiksiyaviy ma’muriy protsessning mazmuni nimadan iborat?", "Ma’muriy huquqbuzarlik ishlarini ko‘rib, huquq-tartibot va jamoat tartibini ta’minlash", "Yurisdiksiyaviy protsess huquqbuzarlik ishlarini hal etadi.", [["Shikoyat bo‘yicha organ qarorining qonuniyligini tekshirish va adolatni tiklash", "Bu yustitsiyaviy protsess."], ["Davlat xizmati ko‘rsatish tartib-taomillarini amalga oshirish", "Bu tartib-taomillar bilan bog‘liq protsess."], ["Nazorat ostidagi obyektlarda tekshiruv o‘tkazib qoidabuzarlikni aniqlash", "Bu nazorat-taftish protsessi."]]], ["Ma’muriy protsessning eng so‘nggi bosqichi qaysi?", "Huquqiy aktni (qarorni) ijro etish", "Ijro qaror qabul qilingandan keyingi yakuniy bosqich.", [["Huquqiy aktni (qarorni) qabul qilish", "Qabul qilish ijrodan oldin keladi."], ["Qaror loyihasini tayyorlash va kelishish", "Bu tayyorlov bosqichi."], ["Ish holatlarini tekshirish va baholash", "Bu qarordan avvalgi bosqich."]]], ["Ma’muriy-protsessual faoliyatni qaysi ikki qismga ajratish mumkin?", "Ma’muriy ish yuritish va ma’muriy yurisdiksiyaviy faoliyat", "Faoliyat ish yuritish va yurisdiksiyaviy qismlarga bo‘linadi.", [["Ma’muriy ish yuritish va ma’muriy nazorat faoliyati", "Nazorat bu bo‘linishning ikkinchi qismi emas."], ["Ma’muriy yustitsiya va ma’muriy yurisdiksiya faoliyati", "Yustitsiya alohida tur, bu bo‘linishda ish yuritishga kiradi."], ["Ma’muriy tartib-taomil va ma’muriy majburlov faoliyati", "Atamalar aralashtirilgan, bo‘linish bunday emas."]]], ["Ma’muriy majburlov choralarini qo‘llash ma’muriy protsessning qaysi turiga xos?", "Yurisdiksiyaviy ma’muriy protsessga", "Majburlov choralari huquqbuzarlik bo‘yicha qo‘llanadi.", [["Yustitsiyaviy ma’muriy protsessga", "U shikoyatni ko‘rishga qaratilgan."], ["Nazorat-taftish sohasidagi protsessga", "U tekshiruvga qaratilgan."], ["Tartib-taomillar bilan bog‘liq protsessga", "U ruxsat va xizmat ko‘rsatishga qaratilgan."]]], ["Quyidagilardan qaysi biri ma’muriy protsess turlariga kirmaydi?", "Xo‘jalik (iqtisodiy) protsess", "Xo‘jalik protsessi odil sudlov turi.", [["Yustitsiyaviy ma’muriy protsess", "Bu ma’muriy protsess turi."], ["Yurisdiksiyaviy ma’muriy protsess", "Bu ham turi."], ["Nazorat-taftish sohasidagi ma’muriy protsess", "Bu ham turi."]]], ["Quyidagilardan qaysi biri ma’muriy organlarga kirmaydi?", "Qonun chiqaruvchi hokimiyat organlari", "Ular ma’muriy boshqaruv vakolatiga ega emas.", [["Davlat boshqaruvi organlari", "Ular ma’muriy organ."], ["Mahalliy ijro etuvchi hokimiyat organlari", "Ular ham ma’muriy organ."], ["Fuqarolarning o‘zini o‘zi boshqarish organlari", "Ular ham ma’muriy organ hisoblanadi."]]], ["Ta’sir choralari ko‘zlangan qonuniy maqsadga erishish uchun mos va yetarli bo‘lishi qaysi prinsip mazmuni?", "Mutanosiblik prinsipi", "Mutanosiblik chora va maqsad nisbatini talab qiladi.", [["Qonuniylik prinsipi", "U harakat qonun asosida bo‘lishini talab qiladi."], ["Teng huquqlilik prinsipi", "U shaxslar o‘rtasida farq qo‘ymaslikni anglatadi."], ["Ishonchning himoya qilinishi prinsipi", "U oldingi qarorga tayanishni himoya qiladi."]]], ["Manfaatdor shaxslar taqdim etgan haqiqiy holatlar to‘g‘risidagi hujjatlar va ma’lumotlar qachongacha ishonchli hisoblanadi?", "Aksi isbotlanmaguniga qadar", "Ishonchlilik prinsipiga ko‘ra, aksi isbotlanmaguncha ishonchli.", [["Ma’muriy organ tekshiruv o‘tkazib tasdiqlaguniga qadar", "Dastlabki tasdiq talab qilinmaydi."], ["Ma’muriy hujjat qabul qilinguniga qadar", "Ishonch qaror bilan tugamaydi."], ["Hujjatlar notarial tasdiqlanguniga qadar", "Notarial tasdiq umumiy talab emas."]]], ["Qonunchilikning bartaraf etib bo‘lmaydigan qarama-qarshiliklari va noaniqliklari kimning foydasiga talqin etiladi?", "Manfaatdor shaxslar foydasiga", "Bu manfaatdor shaxslar huquqlarining ustunligi prinsipi.", [["Ma’muriy organ foydasiga", "Organ foydasiga talqin qilish prinsipga zid."], ["Davlat manfaatlari foydasiga", "Bunday ustuvorlik belgilanmagan."], ["Yuqori turuvchi organ foydasiga", "Yuqori organning foydasi mezon emas."]]], ["Ma’muriy tartib-taomil uchun boshqa organlardan hujjat va ma’lumot olish talab etilsa, ish qaysi prinsip bo‘yicha amalga oshiriladi?", "“Bir darcha” prinsipi", "Organ hujjatlarni idoralararo hamkorlik orqali o‘zi oladi.", [["Byurokratik rasmiyatchilikka yo‘l qo‘yilmasligi prinsipi", "U ortiqcha talablarni cheklaydi, aynan shu mexanizm emas."], ["Ochiqlik, shaffoflik va tushunarlilik prinsipi", "U axborot ochiqligini ta’minlaydi."], ["Tekshirish prinsipi", "U holatlarni tekshirishga tegishli."]]], ["Diskretsion vakolat nima?", "Qonunda yo‘l qo‘yilgan choralardan birini o‘z ixtiyoriga ko‘ra qo‘llash yoki qo‘llamaslik huquqi", "Ixtiyor qonun doirasidagi tanlov imkoniyati.", [["Qonunda nazarda tutilmagan chorani vaziyatga qarab qo‘llash huquqi", "Qonundan tashqari chora qo‘llash mumkin emas."], ["Yuqori organ ko‘rsatmasiga ko‘ra chorani tanlash majburiyati", "Bu ixtiyor emas, ko‘rsatmaga rioya."], ["Manfaatdor shaxs roziligi bilan chorani o‘zgartirish huquqi", "Rozilik vakolat mohiyatini belgilamaydi."]]], ["Idoralararo hamkorlik hisoblanmaydigan munosabatlar qaysilar?", "Bo‘ysunuv munosabatidagi organlar o‘rtasidagi munosabatlar", "Hamkorlik bir-biriga bo‘ysunmaydigan organlar o‘rtasida.", [["Bir tizimga kirmaydigan, bo‘ysunmaydigan organlar o‘rtasidagi munosabatlar", "Bu hamkorlik hisoblanadi."], ["Turli sohada vakolatli, teng maqomli organlar o‘rtasidagi munosabatlar", "Bu ham hamkorlik."], ["Hujjat va ma’lumot almashadigan mustaqil organlar o‘rtasidagi munosabatlar", "Bu ham hamkorlik."]]], ["Qabul qilinayotgan ma’muriy hujjat yoki amalga oshirilayotgan ma’muriy harakat qaratilgan shaxs – bu ...", "Adresat (manfaatdor shaxs)", "Hujjat yoki harakat adresatiga qaratiladi.", [["Arizachi", "Arizachi ish qo‘zg‘atishi mumkin, har doim adresat emas."], ["Manfaatdor uchinchi shaxs", "Uning manfaatiga ta’sir etishi mumkin, ammo hujjat unga qaratilmagan."], ["Vakolatli vakil", "Vakil adresat nomidan ishtirok etadi."]]], ["Prezidentning 2022-yil 21-dekabrdagi PF-269-son farmoniga ko‘ra, 26 ta davlat organida 40 ta rahbar o‘rinbosari lavozimi qanday choralar natijasida qisqartirildi?", "Sohaga oid bo‘lmagan vazifalarni qisqartirish va raqamli texnologiyalarni joriy etish orqali tuzilma o‘rtacha 15 foizga maqbullashtirildi", "Farmonda aynan vazifalarni qisqartirish va raqamlashtirish orqali tuzilmani maqbullashtirish ko‘rsatilgan.", [["Sohaga oid vazifalarni kengaytirish va raqamli texnologiyalarni joriy etish orqali tuzilma o‘rtacha 15 foizga maqbullashtirildi", "Vazifalar kengaytirilmagan, sohaga oid bo‘lmaganlari qisqartirilgan."], ["Sohaga oid bo‘lmagan vazifalarni qisqartirish va raqamli texnologiyalarni joriy etish orqali tuzilma o‘rtacha 25 foizga maqbullashtirildi", "Mexanizm to‘g‘ri, lekin ko‘rsatkich noto‘g‘ri: o‘rtacha 15 foiz."], ["Markaziy apparatlarni birlashtirish va hududiy boshqarmalarni ko‘paytirish orqali tuzilma o‘rtacha 15 foizga maqbullashtirildi", "Farmonda birlashtirish emas, vazifalarni qisqartirish nazarda tutilgan."]]], ["Majburiy tartibda davolash chorasi kimlarga nisbatan qo‘llanadi?", "Jamoat tartibini buzayotgan yoki aholi salomatligiga xavf tug‘dirayotgan surunkali alkogolizm, giyohvandlik yoki zaharvandlikka mubtalo bemorlarga", "Bu chora sud qaroriga ko‘ra aynan shunday xavf tug‘diruvchi bemorlarga qo‘llanadi.", [["Ma’muriy huquqbuzarlik sodir etgan har qanday shaxsga, uning salomatligidan qat’i nazar", "Davolash huquqbuzarlik fakti bilan emas, kasallik va xavf bilan bog‘liq."], ["Ruhiy kasalligi sababli faqat o‘z manfaatiga zarar yetkazayotgan shaxslarga", "Chora jamoat tartibi va boshqalar huquqi buzilishi mezoniga tayanadi."], ["Jinoyat uchun jazoni o‘tayotgan, sog‘lig‘i yomonlashgan mahkumlarga", "Mahkumlar sog‘lig‘i boshqa tartibda ta’minlanadi, bu chora ularga tegishli emas."]]], ["Axborot va aloqa sohasidagi ommaviy xizmatlar keltirilgan qatorni ko‘rsating.", "Nashriyot xizmatlari, teleradioeshittirish, telekommunikatsiya, dasturiy ta’minot ishlab chiqish va IT-konsalting", "Barcha xizmatlar axborot va aloqa sohasiga oid.", [["Nashriyot xizmatlari, teleradioeshittirish, sug‘urta, dasturiy ta’minot ishlab chiqish va IT-konsalting", "Sug‘urta moliyaviy xizmat, axborot-aloqaga kirmaydi."], ["Teleradioeshittirish, telekommunikatsiya, kitob savdosi va dasturiy ta’minot ishlab chiqish", "Kitob savdosi savdo sohasiga oid."], ["Nashriyot xizmatlari, pochta tashish, telekommunikatsiya va transport logistikasi", "Transport logistikasi transport sohasi xizmati."]]], ["Xususiy sektor orqali amalga oshiriladigan ommaviy xizmatlarda davlat qanday rolni bajaradi?", "Faqat nazorat funksiyasini saqlab qoladi", "Xizmatni xususiy sektor ko‘rsatadi, davlatda nazorat qoladi.", [["Xizmat ko‘rsatish va nazorat funksiyalarini bir vaqtda o‘zida saqlaydi", "Xizmatni xususiy sektor ko‘rsatsa, davlat uni ko‘rsatmaydi."], ["Faqat xizmat narxini belgilaydi, nazoratni jamoat tashkilotlariga topshiradi", "Nazorat davlatda qoladi, jamoatga o‘tmaydi."], ["Xizmat xarajatlarini qoplaydi, nazoratdan butunlay chetlashadi", "Nazoratdan chetlashmaydi."]]], ["Davlat fuqarolik xizmati faoliyati qaysi lavozimlardagi xizmatchilarga aloqador?", "Davlat fuqarolik xizmati lavozimlarining davlat reyestriga kiritilgan lavozimlardagi xizmatchilarga", "Faoliyat reyestrga kiritilgan lavozimlarga nisbatan amal qiladi.", [["Davlat organlaridagi barcha lavozimlardagi xodimlarga, texnik xodimlarni ham qo‘shgan holda", "Texnik va xizmat ko‘rsatish xodimlari fuqarolik xizmatchisi emas."], ["Vazirlar Mahkamasi tasdiqlagan lavozimlar ro‘yxatidagi xizmatchilarga", "Mezon Vazirlar Mahkamasi ro‘yxati emas, davlat reyestri."], ["Mahalliy hokimliklar va sud organlaridagi xizmatchilarga", "Sudyalar fuqarolik xizmatchisi hisoblanmaydi."]]], ["Davlat xizmatini o‘tash – xizmat o‘tashning asosiy mazmuni, bosqichlari, tartib va jarayonlarini belgilab beruvchi ...", "Huquqiy, tashkiliy va ijtimoiy chora-tadbirlar tizimi", "Ta’rif aynan shu uch yo‘nalishni qamraydi.", [["Huquqiy, tashkiliy va iqtisodiy chora-tadbirlar tizimi", "Uchinchi yo‘nalish ijtimoiy, iqtisodiy emas."], ["Intizomiy, tashkiliy va ijtimoiy chora-tadbirlar tizimi", "Intizomiy emas, huquqiy yo‘nalish nazarda tutiladi."], ["Huquqiy, moliyaviy va ijtimoiy chora-tadbirlar tizimi", "Moliyaviy chora-tadbirlar ta’rifga kirmaydi."]]], ["Davlat fuqarolik xizmatini o‘tash bo‘yicha mehnat shartnomasida quyidagilardan qaysi biri belgilanadi?", "Ish vaqti, lavozim yo‘riqnomasi, faoliyat samaradorligini baholash va rotatsiya tartibi", "Bular mehnat shartnomasida belgilanadi.", [["Ish vaqti, lavozim yo‘riqnomasi, sudlanganlik holati va rotatsiya tartibi", "Sudlanganlik holati shartnoma sharti emas, qabul talabi."], ["Ish vaqti, shaxsiy mulk tarkibi, baholash va rotatsiya tartibi", "Mulk tarkibi shartnomada belgilanmaydi."], ["Ish vaqti, tadbirkorlik faoliyati ruxsati, baholash va rotatsiya tartibi", "Tadbirkorlik cheklov, ruxsat shartnoma mazmuni emas."]]], ["Qonunga xilof qilmishiga nisbatan qonunchilikda nazarda tutilgan u yoki bu turdagi jazo choralarini qo‘llash – bu ...", "Yuridik javobgarlik", "Qonunbuzarlik uchun jazo choralari qo‘llanishi yuridik javobgarlikdir.", [["Intizomiy javobgarlik", "Bu yuridik javobgarlikning faqat bir turi."], ["Ma’muriy majburlov", "Bu majburlov choralari, javobgarlikning umumiy ta’rifi emas."], ["Ma’naviy javobgarlik", "Bu axloqiy tushuncha, qonunchilikda belgilanmagan."]]], ["Ma’muriy protsess deganda nima tushuniladi?", "Ma’muriy-protsessual shaklda ma’muriy-huquqiy aktlarni qabul qilish va ijro etish orqali ishni hal etishga qaratilgan ijro organlarining hokimiyat faoliyati", "Ta’rif protsessual shakl va akt qabul qilish-ijro etishni o‘z ichiga oladi.", [["Sud tomonidan ma’muriy ishlarni ko‘rib, hukm chiqarish orqali hal etishga qaratilgan odil sudlov faoliyati", "Bu sud protsessi, ijro organlari faoliyati emas."], ["Ijro organlarining ichki tartibini belgilovchi normativ hujjatlarni qabul qilish faoliyati", "Bu norma ijodkorligi, aniq ishni hal etish emas."], ["Ma’muriy organlar o‘rtasidagi nizolarni kelishuv orqali hal etishga qaratilgan faoliyat", "Protsess hokimiyat faoliyati, kelishuv emas."]]], ["Ma’muriy protsessda doim qanday subyekt ishtirok etadi?", "Davlat organi yoki uning mansabdor shaxsi", "Hokimiyat vakolatiga ega tomon har doim bo‘ladi.", [["Manfaatdor jismoniy shaxs", "Murojaatchi bo‘lishi mumkin, lekin majburiy emas."], ["Prokuror yoki sud organi", "Ular ma’muriy protsessda doim ishtirok etmaydi."], ["Vakolatli vakil", "Vakil faqat adresat nomidan ishtirok etadi."]]], ["Ma’muriy protsess natijasi sifatida nima qabul qilinadi?", "Ma’muriy-huquqiy akt", "Protsess ma’muriy-huquqiy akt bilan yakunlanadi.", [["Sud hukmi", "Hukm sud protsessi natijasi."], ["Protsessual hujjat", "Bu protsess davomida chiqadi, ishni mazmunan hal etmaydi."], ["Normativ-huquqiy hujjat", "Bu aniq ishni hal etmaydi, umumiy qoida belgilaydi."]]], ["Boshqaruv bilan bog‘liq ma’muriy protsessning asosini qanday jarayonlar tashkil etadi?", " const $=id=>document.getElementById(id);
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let cur,k,score,miss,done,mode,sec,set=0;
let sz=40,mx=40;try{sz=+localStorage.getItem("sz")||40;mx=+localStorage.getItem("mx")||40}catch(e){}
const clamp=(v,d)=>Math.min(Math.max(1,+v||d),Q.length);
function secs(){const n=Math.max(1,sz),r=[];for(let i=0;i<Q.length;i+=n)r.push(Q.slice(i,i+n));return r}
function save(){sz=clamp($("sz").value,40);mx=clamp($("mx").value,40);try{localStorage.setItem("sz",sz);localStorage.setItem("mx",mx)}catch(e){}set=0;home()}
function home(){
 $("app").innerHTML=`<div class=hd><h1>⚖️ Ma’muriy huquq testi</h1><button class=g onclick="set=!set;home()">⚙️ Sozlama</button></div><p class=m>Jami ${Q.length} ta savol</p>`+
 (set?`<div class=card><b>⚙️ Sozlama</b><div class=row><label class=m>Bo‘limdagi savollar (standart 40)<br><input id=sz type=number min=1 max=${Q.length} value=${sz}></label><label class=m>Mix imtihon savollari (standart 40)<br><input id=mx type=number min=1 max=${Q.length} value=${mx}></label><button onclick=save()>Saqlash</button></div></div>`:"")+
 `<div class=card><b>🎲 Mix imtihon</b><div class=m>Barcha bo‘limlardan ${Math.min(mx,Q.length)} ta tasodifiy savol</div><div class=row><button onclick="start(-1)">Boshlash</button></div></div>`+
 secs().map((s,i)=>`<div class=card><b>${i+1}-bo‘lim</b><div class=m>${i*sz+1}–${i*sz+s.length}-savollar · ${s.length} ta</div><div class=row><button onclick="start(${i})">Boshlash</button></div></div>`).join("")}
function start(i){
 if(i!=null)sec=i;const src=sec<0?sh(Q).slice(0,Math.min(mx,Q.length)):secs()[sec];
 cur=sh(src).map(([q,c,e,w])=>({q,o:sh([[c,e,1],...w.map(([t,r])=>[t,r,0])])}));
 k=0;score=0;miss=[];show()}
function show(){
 done=0;const x=cur[k];
 $("app").innerHTML=`<div class=bar><i style="width:${k/cur.length*100}%"></i></div><div class=top><button class=g onclick=home()>← Menyu</button><span class=m>${k+1} / ${cur.length}</span></div><h2>${x.q}</h2>`+x.o.map((o,j)=>`<button class=opt onclick=pick(${j})><b>${"ABCD"[j]}</b><span>${o[0]}</span></button>`).join("")+"<div id=fb></div>"}
function pick(j){
 if(done)return;done=1;const x=cur[k],o=x.o[j],bs=document.querySelectorAll(".opt"),c=x.o.find(e=>e[2]);
 x.o.forEach((e,i)=>{bs[i].disabled=true;if(e[2])bs[i].classList.add("ok")});let h;
 const all=`<div class=m style="margin-top:8px"><b>Variantlar tahlili:</b></div><ul class=m>`+x.o.map((e,i)=>`<li><b>${"ABCD"[i]}</b> – ${e[2]?"to‘g‘ri: ":"xato: "}${e[1]}</li>`).join("")+"</ul>";
 if(o[2]){score++;h=`<div class="fb okb"><b>✅ To‘g‘ri!</b> ${o[1]}${all}</div>`}
 else{bs[j].classList.add("no");miss.push({q:x.q,p:o[0],r:o[1],c:c[0],e:c[1]});
  h=`<div class="fb nob"><b>❌ Tanlagan javobingiz xato:</b> ${o[0]}<br>${o[1]}</div><div class="fb okb"><b>✅ To‘g‘ri javob:</b> ${c[0]}<br>${c[1]}${all}</div>`}
 $("fb").innerHTML=h+`<button class=nx onclick=next()>${k+1<cur.length?"Keyingi savol →":"Natijani ko‘rish"}</button>`}
function next(){k++;k<cur.length?show():end()}
function end(){
 const t=cur.length,p=Math.round(score/t*100);
 $("app").innerHTML=`<h1>${p>=80?"🏆":p>=50?"👍":"📚"} Natija: ${p}%</h1><p>${t} ta savoldan ${score} tasi to‘g‘ri.</p>`+(miss.length?`<h3>Xatolar tahlili (${miss.length})</h3>`+miss.map(m=>`<div class=card><b>${m.q}</b><div class="fb nob">❌ Siz: ${m.p}<br>${m.r}</div><div class="fb okb">✅ To‘g‘ri: ${m.c}<br>${m.e}</div></div>`).join(""):"<p>🎉 Barcha savollarga to‘g‘ri javob berdingiz!</p>")+`<div class=row><button onclick="start()">Qayta urinish</button><button class=g onclick=home()>Menyu</button></div>`}
home();
</script></body></html>
