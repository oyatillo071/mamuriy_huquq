<style>
:root{--bg:#f6f7fb;--c:#fff;--t:#1e2433;--m:#667085;--b:#dfe3ec;--p:#3b5bdb;--ok:#1f9d55;--okb:#e6f6ec;--no:#d64545;--nob:#fdecec;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--c:#1b202b;--t:#e8ebf2;--m:#98a2b3;--b:#2d3445;--p:#7c9bff;--ok:#4cc38a;--okb:#16301f;--no:#ff7b7b;--nob:#3a1b1b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--c:#1b202b;--t:#e8ebf2;--m:#98a2b3;--b:#2d3445;--p:#7c9bff;--ok:#4cc38a;--okb:#16301f;--no:#ff7b7b;--nob:#3a1b1b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:720px;margin:auto;padding:16px}
h1{font-size:23px;margin:0}h2{font-size:19px;line-height:1.4;margin:16px 0}h3{margin:20px 0 8px}
.m{color:var(--m);font-size:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:10px}
input{width:70px;padding:8px;border-radius:8px;border:1px solid var(--b);background:var(--bg);color:var(--t);font-size:16px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--p);color:#fff;font-weight:600}
button.g{background:transparent;color:var(--m);border:1px solid var(--b)}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--c);color:var(--t);border:2px solid var(--b);margin:8px 0;font-weight:500}
.opt b{min-width:24px;color:var(--p)}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.no{border-color:var(--no);background:var(--nob)}
.bar{height:6px;background:var(--b);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}
.top{display:flex;justify-content:space-between;align-items:center;margin:10px 0}

.fb.okb{background:var(--okb);border-left:4px solid var(--ok)}.fb.nob{background:var(--nob);border-left:4px solid var(--no)}
.fb ul{margin:6px 0 0;padding-left:18px}
.nx{width:100%;margin-top:6px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nv{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.nv button{padding:5px 0;width:34px;font-size:13px;background:var(--c);color:var(--t);border:1px solid var(--b)}.nv .an{background:var(--p);color:#fff}.nv .cu{outline:2px solid var(--t)}.opt.sel{border-color:var(--p)}</style></head><body><div id="app"></div>
<script>
// [savol, to‘g‘ri javob, nega to‘g‘ri, [[xato variant, nega xato] x3]]
const Q=[["Boshqaruvning turlari qaysi qatorda to‘g‘ri keltirilgan?", "Texnik, biologik va ijtimoiy boshqaruv", "Boshqaruv obyektining tabiatiga ko‘ra aynan shu uch tur ajratiladi.", [["Texnik, biologik, ijtimoiy va iqtisodiy boshqaruv", "To‘rtinchi tur yo‘q: iqtisodiy boshqaruv ijtimoiy boshqaruv ichida o‘rganiladi."], ["Mexanik, ijtimoiy va ma’muriy-siyosiy boshqaruv", "Biologik tur tushib qolgan, ma’muriy-siyosiy esa ijtimoiy boshqaruvning bir sohasi."], ["Biologik, ijtimoiy va davlat-huquqiy boshqaruv", "Davlat-huquqiy boshqaruv mustaqil tur emas; texnik tur o‘rni bo‘sh qolgan."]]], ["Davlat hokimiyati vakolatlariga ega organlar va mansabdor shaxslar tomonidan davlat ishlarini boshqarish – bu?", "Davlat boshqaruvi", "Ta’rifdagi belgilar (hokimiyat vakolati, organ va mansabdor) davlat boshqaruviga tegishli.", [["Ijro etuvchi hokimiyat", "Bu hokimiyat tarmog‘i; boshqaruv uning faoliyat mazmuni, ta’rifdagi tushuncha emas."], ["Ma’muriy-huquqiy tartibga solish", "Bu huquqiy ta’sir shakli bo‘lib, boshqaruvning o‘zi emas."], ["Ijtimoiy boshqaruv", "Kengroq tushuncha: nodavlat tuzilmalar boshqaruvini ham qamraydi."]]], ["Davlat boshqaruvini tashkil etish va amalga oshirishning ijtimoiy mexanizmi zanjiri qanday ketma-ketlikda bo‘ladi?", "Ehtiyoj – manfaat – maqsad – qaror – harakat – natija", "Ehtiyojdan manfaat, undan maqsad, so‘ng qaror, harakat va natija kelib chiqadi.", [["Ehtiyoj – manfaat – qaror – maqsad – harakat – natija", "Qaror maqsad belgilangandan keyin qabul qilinadi, oldin emas."], ["Ehtiyoj – maqsad – manfaat – qaror – harakat – natija", "Manfaat anglanmay turib maqsad qo‘yilmaydi: manfaat maqsaddan oldin keladi."], ["Ehtiyoj – manfaat – maqsad – harakat – qaror – natija", "Harakat qarorga asoslanadi; ularning o‘rni almashgan."]]], ["Davlat boshqaruviga quyidagi qaysi xususiyat xos emas?", "Shakli, uslubi va mazmuniga ko‘ra qonun chiqarish hamda odil sudlov bilan bir xil faoliyat turi hisoblanadi", "Boshqaruv bu ikki faoliyatdan shakli, uslubi va mazmuni bilan ajralib turadi.", [["Ijro etuvchi hokimiyatni amalga oshirishga yo‘naltirilgan va qonunga asoslangan tashkiliy faoliyat hisoblanadi", "Bu xos belgi."], ["Qonunga asoslangan va uni ijro etishga qaratilgan, farmoyish berish xususiyatiga ega faoliyat hisoblanadi", "Bu xos belgi."], ["Faqat davlat mulkidagi obyektlar bilan cheklanmay, nodavlat sohalarga ham ta’sir ko‘rsatuvchi faoliyat hisoblanadi", "Bu xos belgi."]]], ["Davlat boshqaruviga xos bo‘lmagan xususiyat ko‘rsatilgan javobni toping?", "Faqat mavjud normalarni qo‘llash bilan cheklanadi va huquq ijodkorligini amalga oshirmaydi", "Boshqaruv normativ hujjat chiqarib huquq ijodkorligini ham bajaradi.", [["Ijro hokimiyati doirasida huquqni qo‘llash bilan birga normativ hujjatlar qabul qiladi", "Xos belgi: qo‘llash va ijodkorlik birga amalga oshadi."], ["Muntazam, rejali va tashkiliy xususiyatga ega bo‘lgan faoliyatdir", "Xos belgi: boshqaruv tasodifiy emas, doimiy va rejali."], ["Hokimiyat vakolatiga tayanib, majburlov choralarini qo‘llash imkoniga ega", "Xos belgi: yurisdiksion vakolat boshqaruvga tegishli."]]], ["Davlat boshqaruviga xos bo‘lmagan xususiyat ko‘rsatilgan javobni toping?", "Tasodifiy, rejasiz tarzda olib boriladi va majburlov vakolatiga ega emas", "Boshqaruv doimiy, rejali va majburlov choralarini qo‘llash vakolatiga ega.", [["Doimiy va rejali bo‘lib, ogohlantirish hamda cheklov choralarini ham nazarda tutadi", "Xos belgi: oldini olish va cheklash choralari boshqaruvga kiradi."], ["Davlat nomidan bajariladigan ijrochi-farmoyishchilik faoliyati hisoblanadi", "Xos belgi: farmoyish berish asosiy mazmunlardan biri."], ["Ijtimoiy munosabatlarni tashkil etish va tartibga solishga qaratilgan bo‘ladi", "Xos belgi: boshqaruvning bosh maqsadi shu."]]], ["Quyidagilardan qaysi biri davlat boshqaruvining asosiy funksiyalaridan biri hisoblanmaydi?", "Odil sudlov orqali huquqiy nizolarni hal etish", "Nizolarni sud orqali hal etish sud hokimiyati vazifasi, boshqaruv funksiyasi emas.", [["Rejalashtirish va istiqbolni belgilash", "Bu boshqaruvning asosiy funksiyalaridan biri."], ["Muvofiqlashtirish va kontrol qilish", "Bu ham boshqaruv funksiyalari qatorida."], ["Hisobga olish va axborot bilan ta’minlash", "Bu ham boshqaruv funksiyasi hisoblanadi."]]], ["Ma’muriy huquq predmetiga kiruvchi huquqiy munosabatlarning doimiy ishtirokchisi bu –?", "Davlat organi yoki uning nomidan harakat qiluvchi mansabdor shaxs", "Bunday munosabatda bir tomonda doimo vakolatli davlat organi bo‘ladi.", [["Yuridik shaxs maqomidagi xo‘jalik yurituvchi subyekt yoki uning vakili", "Xo‘jalik subyekti ishtirok etishi mumkin, doimiy emas."], ["Fuqarolarning o‘zini o‘zi boshqarish organi yoki uning mansabdor shaxsi", "Ayrim hollarda ishtirok etadi, doimiy emas."], ["Vakolatli jamoat birlashmasi yoki uning nomidan harakat qiluvchi vakil", "Tashkiliy tuzilma sifatida ishtirok etsa-da, majburiy tomon emas."]]], ["Ma’muriy huquq sohasiga doir fikrlarning qaysi biri noto‘g‘ri?", "Ikki fuqaro o‘rtasidagi mulkiy shartnoma munosabatlari ham ma’muriy huquq predmetiga kiradi", "Bunday munosabatlar fuqarolik huquqi predmeti.", [["Davlat boshqaruvini amalga oshirish jarayonidagi ijtimoiy munosabatlar predmetga kiradi", "Bu to‘g‘ri fikr."], ["Munosabatning bir tomonida odatda davlat organi yoki mansabdor shaxs turadi", "Bu to‘g‘ri fikr."], ["Ma’muriy huquq ommaviy huquq sohalaridan biri hisoblanadi", "Bu to‘g‘ri fikr."]]], ["Ma’muriy huquqda ijtimoiy munosabatlarga huquqiy ta’sir etishning qaysi uslublaridan foydalaniladi?", "Yozma buyruq (ko‘rsatma), man etish va ruxsat berish", "Ma’muriy huquq uchun hokimiyat ko‘rsatmasi, taqiq va ruxsat uslublari xos.", [["Buyruq, kelishuv, rag‘batlantirish va ixtiyoriy bajarish", "Kelishuv tomonlar tengligiga asoslanadi, fuqarolik huquqiga xos."], ["Ruxsat berish, tavsiya qilish va hamkorlik qilish", "Tavsiya va hamkorlik majburiy ta’sir emas."], ["Man etish, kelishuv va ixtiyoriy bajarishga undash", "Ixtiyoriy bajarish hokimiyat uslubiga zid."]]], ["Davlat boshqaruvi jarayonida vujudga keladigan munosabatlarning ichki tuzilishi, normalarning izchil joylashuvi – bu?", "Ma’muriy huquq tizimi", "Normalar tuzilishi va joylashuvi huquq tizimining mazmuni.", [["Ma’muriy qonunchilik tizimi", "Bu normativ hujjatlar tizimi, normalar tuzilishi emas."], ["Ma’muriy huquq manbalari", "Bu normalarning ifoda shakli."], ["Ma’muriy huquq predmeti", "Bu tartibga solinadigan munosabatlar doirasi."]]], ["Quyidagilardan qaysi biri ma’muriy huquqning maxsus prinsiplari qatoriga kiradi?", "Yakkaboshchilik va kollegiallik, markazlashtirish va markazsizlashtirishning uyg‘unligi", "Bular boshqaruv organlari faoliyatiga xos maxsus prinsiplar.", [["Qonuniylik va qonun oldida tenglik, insonparvarlik va xalq manfaatlarining ustuvorligi", "Bular umumiy huquqiy prinsiplar."], ["Demokratizm va sud nazoratining mustaqilligi, ochiqlik va hisobdorlikning uyg‘unligi", "Bular maxsus prinsip emas."], ["Yakkaboshchilik va kollegiallik, qonuniylik va insonparvarlikning uyg‘unligi", "Ikkinchi juftlik umumiy prinsiplarga oid."]]], ["Ma’muriy huquq fanining umumiy qismi tarkibiga kiruvchi institutlarni ko‘rsating?", "Boshqaruv subyektlari, shakllari va uslublari, ma’muriy majburlov choralari", "Bular umumiy qism institutlari.", [["Iqtisodiyot va ijtimoiy-madaniy sohalarni boshqarish hamda boshqaruv shakllari", "Sohalarni boshqarish maxsus qismga tegishli."], ["Boshqaruv subyektlari, tarmoqlararo boshqaruv va ma’muriy-siyosiy soha boshqaruvi", "Tarmoqlararo va soha boshqaruvi maxsus qismda o‘rganiladi."], ["Ma’muriy tartib-taomillar, sohalarni boshqarish va hududiy boshqaruv", "Sohalarni boshqarish maxsus qismga kiradi."]]], ["Quyidagilardan qaysi biri ma’muriy huquq fanining umumiy qismi tarkibiga kiruvchi institut hisoblanmaydi?", "Iqtisodiyot, ijtimoiy-madaniy va ma’muriy-siyosiy sohalarni boshqarish", "Soha boshqaruvi maxsus qism institutlari.", [["Ma’muriy tartib-taomillar, ma’muriy jarayon va uning asosiy prinsiplari", "Bu umumiy qism instituti."], ["Ma’muriy-huquqiy majburlov choralari va ma’muriy javobgarlik asoslari", "Bu umumiy qism instituti."], ["Qonuniylik va intizomni ta’minlash hamda ma’muriy nazorat usullari", "Bu umumiy qism instituti."]]], ["Quyida keltirilganlardan qaysi biri Ma’muriy huquq fani tizimining ichiga kiradi?", "Ma’muriy-huquqiy normalar, institutlar va fan bo‘limlari (guruhlari)", "Fan tizimi normalar, ularni birlashtiruvchi institutlar va bo‘limlardan tashkil topadi.", [["Ma’muriy-huquqiy normalar, institutlar va huquq sohalari (tarmoqlari)", "Huquq sohalari umumiy huquq tizimining tarkibi, fan tizimiga kirmaydi."], ["Ma’muriy-huquqiy munosabatlar, institutlar va fan bo‘limlari (guruhlari)", "Munosabatlar tartibga solinadigan predmet, tizim elementi emas."], ["Ma’muriy qonunchilik hujjatlari, institutlar va fan bo‘limlari (guruhlari)", "Qonunchilik hujjatlari huquq manbasi, fan tizimining elementi emas."]]], ["Jamiyatning alohida sohalarida amalga oshiriladigan davlat boshqaruvining xususiyatlarini belgilovchi normalar ma’muriy huquq fanining qaysi qismida o‘rganiladi?", "Maxsus qismda", "Alohida sohalardagi boshqaruv xususiyatlari maxsus qismda o‘rganiladi.", [["Umumiy qismda", "Umumiy qism barcha sohalarga xos umumiy normalarni o‘rganadi."], ["Umumiy qism asoslarida", "Soha xususiyatlari umumiy qism asoslarida emas, maxsus qismda ochiladi."], ["Muqaddima qismda", "Fanda bunday mustaqil qism yo‘q."]]], ["Davlat boshqaruviga xos qaysi fikr to‘g‘ri?", "Ijro etuvchi hokimiyatni amalga oshiradi; huquqni qo‘llash bilan birga huquq ijodkorligini ham bajaradi", "Boshqaruv ijro hokimiyati faoliyati bo‘lib, normativ hujjat chiqarishni ham o‘z ichiga oladi.", [["Ijro etuvchi hokimiyatni amalga oshiradi; huquqni qo‘llash bilan cheklanib, huquq ijodkorligini bajarmaydi", "Boshqaruv normativ hujjat qabul qilib, huquq ijodkorligini ham bajaradi."], ["Sud hokimiyatini amalga oshiradi; huquqni qo‘llash bilan birga huquq ijodkorligini ham bajaradi", "Boshqaruv ijro hokimiyatiga tegishli, sud hokimiyatiga emas."], ["Ijro etuvchi hokimiyatni amalga oshiradi; huquq ijodkorligini bajaradi, ammo huquqni qo‘llamaydi", "Boshqaruv huquqni qo‘llaydi ham."]]], ["Kasbiy tajriba va ilmiy yutuqlarga tayanib, boshqaruvdagi o‘zgarishlar natijalarini oldindan ko‘ra bilish – qaysi funksiya mazmuni?", "Istiqbolni belgilash funksiyasi", "Natijalarni oldindan ko‘ra bilish – istiqbolni belgilashning mazmuni.", [["Rejalashtirish funksiyasi", "Rejalashtirish vazifa va muddatlarni belgilaydi, natijani oldindan ko‘rishni emas."], ["Muvofiqlashtirish funksiyasi", "Bu funksiya harakatlarni uyg‘unlashtiradi."], ["Tahlil qilish funksiyasi", "Bu funksiya o‘tgan natijalarni baholaydi."]]], ["Keltirilgan fikrlarning qaysi biri to‘g‘ri?", "Ma’muriy huquq boshqaruv munosabatlarini tartibga soladi; ularda davlat organi albatta ishtirok etadi, tomonlar teng emas", "Boshqaruv munosabatida hokimiyat vakolatli organ albatta ishtirok etadi va tomonlar yuridik teng emas.", [["Ma’muriy huquq boshqaruv munosabatlarini tartibga soladi; ularda davlat organi albatta ishtirok etadi, tomonlar o‘zaro teng", "Munosabat hokimiyat va bo‘ysunish asosida, tomonlar teng emas."], ["Ma’muriy huquq boshqaruv munosabatlarini tartibga soladi; ularda davlat organi ishtiroki shart emas, tomonlar teng emas", "Bir tomonda albatta davlat organi bo‘ladi."], ["Ma’muriy huquq mulkiy munosabatlarni tartibga soladi; ularda davlat organi albatta ishtirok etadi, tomonlar teng emas", "Mulkiy munosabatlar fuqarolik huquqi predmeti."]]], ["Norma bilan belgilangan sharoitda muayyan harakatni bajarish uchun to‘g‘ridan-to‘g‘ri yuridik majburiyat yuklash – huquqiy ta’sirning qaysi uslubi?", "Yozma buyruq, ko‘rsatma", "Muayyan harakatni majburiy bajarishni yuklash – buyruq (ko‘rsatma) uslubi.", [["Yozma ruxsat, ko‘rsatma", "Ruxsat huquq beradi, majburiyat yuklamaydi."], ["Yozma taqiq, ogohlantirish", "Taqiq harakatdan tiyilishni talab qiladi."], ["Yozma tavsiya, ko‘rsatma", "Tavsiya majburiy kuchga ega emas."]]], ["“Norma” so‘zi lotin tilida qanday ma’noni bildiradi?", "“Me’yor”, “o‘lchov”, “qoida”, “qonun”", "Lotincha norma – yo‘naltiruvchi qoida, o‘lchov va me’yor ma’nosini beradi.", [["“Me’yor”, “o‘lchov”, “qoida”, “tartib”", "Lotincha norma “tartib” ma’nosini bildirmaydi."], ["“Mezon”, “o‘lchov”, “qoida”, “qonun”", "“Mezon” ma’nolar qatoriga kirmaydi."], ["“Me’yor”, “shakl”, “qoida”, “qonun”", "“Shakl” ma’nolar qatoriga kirmaydi."]]], ["Ma’muriy-huquqiy normalarga xos bo‘lmagan xususiyatni toping.", "Rioya qilish ixtiyoriy va majburlov choralari bilan ta’minlanmaydi", "Aslida ular davlat o‘rnatadi, rioya majburiy, buzganga majburlov qo‘llanadi.", [["Rioya qilish majburiy va davlat majburlovi bilan ta’minlanadi", "Bu xos belgi."], ["Norma davlat nomidan chiqariladigan umummajburiy qoida bo‘ladi", "Bu xos belgi."], ["Norma shaxslarning noaniq doirasi uchun qayta-qayta qo‘llanadi", "Bu xos belgi."]]], ["Ma’muriy-huquqiy normalar qanday funksiyalarni bajaradi?", "Tartibga solish (regulyativ), qo‘riqlash va himoya qilish funksiyalari", "Norma munosabatlarni tartibga soladi va ularni himoya qilib muhofaza etadi.", [["Tartibga solish (regulyativ), qo‘riqlash va jazolash funksiyalari", "Jazolash normalarning funksiyasi emas."], ["Tartibga solish (regulyativ), tarbiyalash va himoya qilish funksiyalari", "Tarbiyalash normaning funksiyasi emas."], ["Nazorat qilish, qo‘riqlash va himoya qilish funksiyalari", "Nazorat qilish normaning funksiyasi emas."]]], ["Moddiy ma’muriy-huquqiy normalari – bu?", "Boshqaruv organlarining huquq, majburiyat va vakolatlarini, ya’ni ma’muriy-huquqiy holatini belgilovchi normalar", "Moddiy normalar mazmunni – huquq va majburiyatlarni belgilaydi.", [["Boshqaruv organlarining huquq va majburiyatlarini bajarish tartibi hamda usullarini belgilovchi normalar", "Bu protsessual normalar."], ["Boshqaruv organlarining vakolatlarini, ya’ni ma’muriy-protsessual holatini belgilovchi normalar", "Bu protsessual normalar tavsifi."], ["Boshqaruv organlarining huquq, majburiyat va vakolatlarini amalga oshirish shakllarini belgilovchi normalar", "Shakllar protsessual normalarga oid."]]], ["Majburiyat yuklash shakliga ko‘ra ma’muriy-huquqiy normalarning qanday turlari mavjud?", "Imperativ va tavsiyaviy normalar", "Majburiyat yuklash shakliga ko‘ra norma imperativ yoki tavsiyaviy bo‘ladi.", [["Imperativ va dispozitiv normalar", "Dispozitiv normalar tomonlar kelishuviga tayanadi, fuqarolik huquqiga xos."], ["Majburlovchi va taqiqlovchi normalar", "Bu mazmuniga ko‘ra tasnif, majburiyat yuklash shakliga ko‘ra emas."], ["Tavsiyaviy va rag‘batlantiruvchi normalar", "Rag‘batlantiruvchi tur majburiyat yuklash shakli emas."]]], ["Quyidagilardan qaysi biri ma’muriy-huquqiy normalar tartibga soladigan masalalarga kirmaydi?", "Ikki fuqaro o‘rtasidagi shartnoma munosabatlari yoki axloq normalari doirasidagi masalalar", "Bunday masalalar fuqarolik huquqi va axloq normalari doirasida hal etiladi.", [["Davlat organi va fuqaro o‘rtasidagi ruxsat berish munosabatlari doirasidagi masalalar", "Bu ma’muriy-huquqiy normalar tartibga soladigan masala."], ["Davlat organlari o‘rtasidagi bo‘ysunuv va vakolat taqsimoti bo‘yicha masalalar", "Bu ma’muriy-huquqiy normalar tartibga soladigan masala."], ["Ma’muriy javobgarlik va majburlov choralarini qo‘llash doirasidagi masalalar", "Bu ma’muriy-huquqiy normalar tartibga soladigan masala."]]], ["Ma’muriy-huquqiy normaning qaysi elementi uni qo‘llashning haqiqiy shartlarini belgilaydi?", "Gipoteza", "Gipoteza normaning amal qilish shartlarini ko‘rsatadi.", [["Dispozitsiya", "Dispozitsiya xulq-atvor qoidasini belgilaydi."], ["Sanksiya", "Sanksiya qoidani buzish oqibatini belgilaydi."], ["Prezumpsiya", "Prezumpsiya norma elementi emas."]]], ["Huquq normalarini ifoda etish, rasmiylashtirish va mustahkamlash shakli – bu?", "Huquq manbai", "Huquq manbai normalar ifodalangan va mustahkamlangan shakldir.", [["Huquq normasi", "Normaning o‘zi, uni ifodalash shakli emas."], ["Huquq tizimi", "Tizim normalarning ichki tuzilishi."], ["Huquq predmeti", "Predmet tartibga solinadigan munosabatlar doirasi."]]], ["Ma’muriy-huquqiy munosabatlarning elementlarini belgilang.", "Subyekt, obyekt va yuridik faktlar", "Munosabat ishtirokchilari (subyekt), obyekt va yuridik faktlardan iborat.", [["Subyekt, obyekt va huquq normalari", "Normalar munosabat elementi emas, uning huquqiy asosi."], ["Subyekt, predmet va yuridik faktlar", "Predmet huquq sohasi tushunchasi, munosabat elementi emas."], ["Subyekt, obyekt va huquqiy tartib", "Huquqiy tartib munosabat elementi emas."]]], ["Ma’muriy-huquqiy munosabatlarning yuzaga kelishi, o‘zgarishi yoki bekor bo‘lishiga nima asos bo‘ladi?", "Yuridik faktlar", "Munosabat yuridik fakt (harakat, harakatsizlik, voqea) bilan paydo bo‘ladi.", [["Huquq normalari", "Norma umumiy asos, aniq munosabat uchun yuridik fakt kerak."], ["Huquqiy javobgarlik", "Bu oqibat, asos emas."], ["Huquqiy layoqat", "Bu imkoniyat, munosabatning yuzaga kelish asosi emas."]]], ["Quyidagilardan qaysilari yuridik faktlarning turlariga xos emas?", "Huquq normasi, subyektning shaxsiy fikri yoki niyati", "Yuridik fakt turlari: harakat, harakatsizlik, voqea va hodisa.", [["Hodisa va harakat (qonuniy va g‘ayriqonuniy xatti-harakatlar)", "Bular yuridik fakt turlari."], ["Muddatning o‘tishi va mansabdor shaxsning vafoti", "Bular yuridik fakt turlari."], ["Ma’muriy akt qabul qilinishi va huquqbuzarlik sodir etilishi", "Bular yuridik fakt turlari."]]], ["Davlat organlari o‘rtasidagi o‘zaro ma’muriy-huquqiy munosabatlarning turlari ko‘rsatilgan javobni toping.", "Vertikal (subordinatsion) va gorizontal (koordinatsion) munosabatlar", "Organlar o‘rtasida bo‘ysunuv (vertikal) va teng (gorizontal) munosabatlar bo‘ladi.", [["Vertikal (koordinatsion) va gorizontal (subordinatsion) munosabatlar", "Atamalar almashtirilgan: vertikal subordinatsion, gorizontal koordinatsion."], ["Vertikal (subordinatsion) va diagonal (koordinatsion) munosabatlar", "Diagonal tur ajratilmaydi."], ["Vertikal (subordinatsion) va gorizontal (konkurent) munosabatlar", "Konkurent tur ajratilmaydi."]]], ["Ma’muriy-yustitsion munosabatlarning mazmuni nimadan iborat?", "Ma’muriy nizolarni hal etish va buzilgan huquq va manfaatlarni tiklash", "Organ yoki sud noqonuniy qarorlar bo‘yicha nizoni hal etib, huquqni tiklaydi.", [["Ma’muriy nizolarni hal etish va huquqbuzarga jazo choralarini qo‘llash", "Jazo qo‘llash yurisdiksion munosabat mazmuni."], ["Ma’muriy nizolarni oldini olish va buzilgan huquq va manfaatlarni tiklash", "Mazmun nizoni hal etishni nazarda tutadi, oldini olishni emas."], ["Ma’muriy nizolarni hal etish va huquq hamda majburiyatlarni qayta taqsimlash", "Qayta taqsimlash mazmunga kirmaydi."]]], ["Ma’muriy-yurisdiksion munosabatlarning mazmuni nimadan iborat?", "Huquqbuzarlik sodir etgan shaxsga ma’muriy jazo chorasini qo‘llash", "Yurisdiksion munosabat – huquqbuzarga vakolatli organ jazo qo‘llash jarayonidir.", [["Huquqbuzarlik sodir etgan shaxsga nisbatan ma’muriy nizoni hal etish", "Nizoni hal etish yustitsion munosabat mazmuni."], ["Huquqbuzarlik sodir etgan shaxsning buzilgan huquqini tiklash", "Huquqni tiklash yustitsion munosabat mazmuni."], ["Huquqbuzarlik sodir etgan shaxsga tarbiyaviy ta’sir chorasini qo‘llash", "Tarbiyaviy ta’sir jazo choralari qatoriga kirmaydi."]]], ["Ma’muriy-huquqiy normaning tarkibiy qismlarini ko‘rsating?", "Gipoteza, dispozitsiya va sanksiya", "Norma uch qismdan iborat: shart, qoida va oqibat.", [["Gipoteza, dispozitsiya va diskretsiya", "Diskretsiya norma tarkibiy qismi emas."], ["Gipoteza, dispozitsiya va prezumpsiya", "Prezumpsiya norma tarkibiy qismi emas."], ["Dispozitsiya, sanksiya va kvalifikatsiya", "Gipoteza tushib qolgan, kvalifikatsiya element emas."]]], ["Quyidagilardan qaysi birida ma’muriy tartib-taomillarga asoslangan munosabatlar yuzaga kelmaydi?", "Huquqbuzarlik uchun jazo qo‘llash va nizoni hal etishda", "Jazo qo‘llash yurisdiksion, nizoni hal etish yustitsion munosabat; ular tartib-taomil emas.", [["Litsenziya va ruxsatnoma berish hamda ro‘yxatdan o‘tkazishda", "Bu tartib-taomillar sohasi."], ["Murojaatni ko‘rib chiqish va ariza bo‘yicha qaror qabul qilishda", "Bu tartib-taomillar sohasi."], ["Davlat xizmatlarini ko‘rsatish va ma’muriy hujjat qabul qilishda", "Bu tartib-taomillar sohasi."]]], ["Quyidagilardan qaysi biri boshqaruv organlari va xususiy shaxslar o‘rtasidagi ma’muriy-huquqiy munosabat turlariga kirmaydi?", "Bir-biriga bo‘ysunmaydigan ikki davlat organi o‘rtasidagi munosabat", "Savol organ va xususiy shaxs munosabati haqida; organlararo munosabat bunga kirmaydi.", [["Boshqaruv organi va fuqaro o‘rtasidagi ruxsat berish munosabati", "Bu boshqaruv organi va xususiy shaxs o‘rtasidagi munosabat turi."], ["Boshqaruv organi va tadbirkorlik subyekti o‘rtasidagi nazorat munosabati", "Bu boshqaruv organi va xususiy shaxs o‘rtasidagi munosabat turi."], ["Boshqaruv organi va jamoat birlashmasi o‘rtasidagi ro‘yxatga olish munosabati", "Bu boshqaruv organi va xususiy shaxs o‘rtasidagi munosabat turi."]]], ["Ma’muriy-huquqiy normalarning amal qilish hududi bo‘yicha turlarini ko‘rsating.", "Butun hududda (Qoraqalpog‘iston bilan birga) va ma’lum hududlarda amal qiluvchi normalar", "Hudud bo‘yicha norma butun mamlakatda yoki alohida hududda amal qiladi.", [["Butun hududda (Qoraqalpog‘istonsiz) va ma’lum hududlarda amal qiluvchi normalar", "Umumhududiy normalar Qoraqalpog‘istonni ham qamraydi."], ["Butun hududda (Qoraqalpog‘iston bilan birga) va faqat poytaxtda amal qiluvchi normalar", "Hududiy tur poytaxt bilan cheklanmaydi."], ["Respublika darajasida va mahalliy (viloyat) darajada amal qiluvchi normalar", "Bu vakolat darajasi bo‘yicha tasnif, hudud bo‘yicha emas."]]], ["Keltirilgan fikrlarning qaysi biri to‘g‘ri?", "Munosabatning bir tomonida doimo davlat organi bo‘ladi va tomonlar yuridik teng emas", "Organ hokimiyat vakolatidan foydalanadi, shu sabab tomonlar teng emas.", [["Munosabatning bir tomonida doimo davlat organi bo‘ladi va tomonlar yuridik teng", "Hokimiyat-bo‘ysunish munosabatida tomonlar teng emas."], ["Munosabatning bir tomonida doimo fuqaro bo‘ladi va tomonlar yuridik teng emas", "Doimiy tomon fuqaro emas, davlat organi."], ["Munosabatning ikki tomonida ham davlat organi bo‘lishi shart va tomonlar yuridik teng emas", "Ikkinchi tomon fuqaro yoki tashkilot bo‘lishi mumkin."]]], ["Vertikal (subordinatsion) munosabatlarning asosiy belgisi nima?", "Bir ishtirokchining boshqasiga tashkiliy bo‘ysunishi va yuqori organning majburiy ko‘rsatma berishi", "Vertikal munosabat bo‘ysunuvga va bir tomonlama majburiy ko‘rsatmaga asoslanadi.", [["Ishtirokchilarning bir-biriga tashkiliy bo‘ysunmasligi va o‘zaro kelishilgan ko‘rsatma berishi", "Bu gorizontal (koordinatsion) munosabat belgisi."], ["Bir ishtirokchining boshqasiga tashkiliy bo‘ysunishi va yuqori organning tavsiyaviy ko‘rsatma berishi", "Vertikal munosabatda ko‘rsatma majburiy bo‘ladi."], ["Bir ishtirokchining boshqasiga moliyaviy bog‘liqligi va yuqori organning majburiy ko‘rsatma berishi", "Asosiy belgi moliyaviy emas, tashkiliy bo‘ysunuvdir."]]], ["Ma’muriy huquq subyektlari – bu?", "Davlat boshqaruvi sohasida huquq va majburiyatlarga ega ma’muriy-huquqiy munosabatlar ishtirokchilari", "Subyekt – munosabatda ishtirok etuvchi, huquq va majburiyati bor shaxs yoki tashkilot.", [["Davlat boshqaruvi sohasida huquq va majburiyatlarga ega fuqarolik-huquqiy munosabatlar ishtirokchilari", "Fuqarolik-huquqiy munosabat ishtirokchilari ma’muriy huquq subyekti emas."], ["Davlat boshqaruvi sohasida faqat huquqlarga ega ma’muriy-huquqiy munosabatlar ishtirokchilari", "Subyekt huquq bilan birga majburiyatga ham ega."], ["Davlat boshqaruvi sohasida huquq va majburiyatlarga ega ma’muriy-huquqiy munosabatlar tashkilotchilari", "Ta’rif ishtirokchilar haqida, tashkilotchilar haqida emas."]]], ["Ma’muriy huquq subyektlarining asosiy belgilaridan biri to‘g‘ri ko‘rsatilgan javobni toping?", "Ma’muriy huquq layoqati va faoliyat layoqatiga egalik", "Subyekt huquqqa ega bo‘lish va uni amalga oshirish layoqatiga ega bo‘lishi kerak.", [["Fuqarolik huquq layoqati va faoliyat layoqatiga egalik", "Belgi ma’muriy huquq layoqatiga tegishli."], ["Ma’muriy huquq layoqatiga egalik, faoliyat layoqatisiz", "Subyektda ikkala layoqat bo‘lishi shart."], ["Ma’muriy huquq layoqati va delikt layoqatiga egalik", "Delikt layoqati asosiy belgi sifatida ajratilmaydi."]]], ["Tashkiliy-huquqiy maqomiga ko‘ra ma’muriy huquq subyektlari orasida asosiy subyekt qaysi?", "Davlat organlari va ularning mansabdor shaxslari", "Ular munosabatning doimiy va hokimiyat vakolatli ishtirokchisi.", [["Davlat organlari va ularning xodimlari", "Oddiy xodimlar hokimiyat vakolatiga ega emas."], ["Davlat organlari va ularning tuzilmaviy bo‘linmalari", "Bo‘linmalar asosiy mustaqil subyekt emas."], ["Davlat organlari va fuqarolarning o‘zini o‘zi boshqarish organlari", "O‘zini o‘zi boshqarish organlari asosiy subyekt emas."]]], ["Xo‘jalik yurituvchi subyektlar – bu?", "Davlat yoki xususiy mulk shaklidagi korxona, muassasa va tashkilotlar", "Ular mulk shaklidan qat’i nazar xo‘jalik faoliyati bilan shug‘ullanadi.", [["Faqat davlat mulki shaklidagi korxona, muassasa va tashkilotlar", "Xususiy mulkdagilar ham xo‘jalik yurituvchi subyekt."], ["Davlat yoki jamoat mulki shaklidagi korxona, muassasa va birlashmalar", "Jamoat birlashmalari xo‘jalik yurituvchi subyekt hisoblanmaydi."], ["Davlat yoki xususiy mulk shaklidagi byudjet muassasalari va tashkilotlar", "Byudjet muassasalari xo‘jalik yurituvchi subyekt emas."]]], ["Vakolat darajasiga ko‘ra ma’muriy huquq subyektlarining qanday turlari mavjud?", "Boshqaruvchi va bo‘ysunuvchi subyektlar", "Vakolat darajasiga ko‘ra subyekt boshqaradi yoki bo‘ysunadi.", [["Boshqaruvchi va nazorat qiluvchi subyektlar", "Nazorat qiluvchi vakolat darajasi turi emas."], ["Yuqori va quyi subyektlar", "Bunday tasnif vakolat darajasiga ko‘ra qabul qilinmagan."], ["Boshqaruvchi va bo‘ysunmaydigan subyektlar", "Bo‘ysunmaydigan subyektlar tasnifga kirmaydi."]]], ["Ijro etuvchi hokimiyat organlariga xos bo‘lmagan belgi keltirilgan javobni toping?", "Qonun qabul qilish va odil sudlov vakolatini amalga oshirish", "Bular qonun chiqaruvchi va sud hokimiyatining vakolati.", [["Qonun asosida va qonunni ijro etish maqsadida faoliyat yuritish", "Bu ijro hokimiyatiga xos belgi."], ["Ijro-farmoyishchilik faoliyatini amalga oshirish", "Bu ijro hokimiyatiga xos belgi."], ["Davlat hokimiyati nomidan boshqaruv qarorlari chiqarish", "Bu ijro hokimiyatiga xos belgi."]]], ["Ijro etuvchi hokimiyat organlari vakolatining xususiyatiga ko‘ra qanday organlarga bo‘linadi?", "Umumiy, maxsus, sohaviy va sohalararo vakolatli organlar", "Vakolat xususiyatiga ko‘ra bo‘linish shu to‘rt turni beradi.", [["Umumiy, maxsus, sohaviy va hududlararo vakolatli organlar", "Tasnifda hududlararo emas, sohalararo tur bor."], ["Umumiy, maxsus, tarmoqli va sohalararo vakolatli organlar", "Tasnifda tarmoqli emas, sohaviy tur bor."], ["Umumiy, maxsus, sohaviy va tarmoqlararo vakolatli organlar", "Tasnifda tarmoqlararo emas, sohalararo tur bor."]]], ["Soha ichidagi tarmoq faoliyatini muvofiqlashtirish va rahbariy faoliyatni kollegial tashkil etish qaysi organga xos?", "Qo‘mita", "Qo‘mita tarmoq faoliyatini muvofiqlashtiradi va kollegial rahbarlik qiladi.", [["Vazirlik", "Vazirlik sohani yakkaboshchilikda boshqaradi."], ["Agentlik", "Agentlik xizmat ko‘rsatish va huquqni qo‘llash vazifalarini bajaradi."], ["Inspeksiya", "Inspeksiya nazorat vazifasini bajaradi."]]], ["Sohada davlat xizmatlarini ko‘rsatish va huquqni qo‘llash funksiyalarini amalga oshiradigan maxsus vakolatli organ qaysi?", "Agentlik", "Agentlik xizmat ko‘rsatish va huquqni qo‘llash funksiyalarini bajaradi.", [["Vazirlik", "Vazirlik sohani boshqaradi, xizmat va huquqni qo‘llash vazifasi agentlikniki."], ["Qo‘mita", "Qo‘mita soha ichidagi faoliyatni muvofiqlashtiradi."], ["Inspeksiya", "Inspeksiya davlat nazoratini amalga oshiradi."]]], ["Sohada davlat nazorati va tekshiruvni amalga oshiradi, vazirlik tashkiliy bo‘ysunuvida faoliyat yuritadi – qaysi organ?", "Inspeksiya", "Inspeksiya nazorat-tekshiruv funksiyasini vazirlik bo‘ysunuvida bajaradi.", [["Agentlik", "Agentlik xizmat ko‘rsatish va huquqni qo‘llash vazifasini bajaradi."], ["Qo‘mita", "Qo‘mita kollegial tashkil etilib, faoliyatni muvofiqlashtiradi."], ["Vazirlik", "Vazirlik tashkiliy bo‘ysunuvda emas, sohani boshqaradi."]]], ["Respublika ijro etuvchi hokimiyat organlarining markaziy apparatlari qanday tarkibda tashkil etiladi?", "Rahbariyat, departament, boshqarma, bo‘lim va mutaxassislar", "Apparat shu bo‘g‘inlardan tashkil topadi.", [["Rahbariyat, departament, bo‘lim, sektor va mutaxassislar", "Tarkibda sektor emas, boshqarma bor."], ["Rahbariyat, boshqarma, bo‘lim, guruh va mutaxassislar", "Tarkibda departament bor, guruh yo‘q."], ["Rahbariyat, departament, boshqarma, bo‘lim va maslahatchilar", "Oxirgi bo‘g‘in mutaxassislardir."]]], ["Markaziy apparatda shtat birliklari soni nechtadan ortganda departament tashkil etilishi mumkin?", "20 nafar va undan ortiq", "Departament 20 va undan ortiq, boshqarma 7, bo‘lim 2 va undan ortiq shtat birligida tashkil etiladi.", [["30 nafar va undan ortiq", "Chegara 20 nafar."], ["15 nafar va undan ortiq", "Chegara 20 nafar."], ["25 nafar va undan ortiq", "Chegara 20 nafar."]]], ["Ma’muriy huquq subyekti sifatida jismoniy shaxslar deganda kimlar tushuniladi?", "O‘zbekiston fuqarolari, chet el fuqarolari va fuqaroligi bo‘lmagan shaxslar", "Jismoniy shaxslar fuqarolikdan qat’i nazar shu uch toifani qamraydi.", [["O‘zbekiston fuqarolari, chet el fuqarolari va ikki fuqaroligi bo‘lgan shaxslar", "Bu uchlikda fuqaroligi bo‘lmagan shaxslar kiradi."], ["O‘zbekiston fuqarolari, chet el fuqarolari va vaqtincha turuvchi shaxslar", "Vaqtincha turish fuqarolik maqomi emas."], ["O‘zbekiston fuqarolari, doimiy yashovchi chet elliklar va fuqaroligi bo‘lmagan shaxslar", "Chet el fuqarolari doimiy yashovchilar bilan cheklanmaydi."]]], ["Vaqtinchalik ma’muriy subyektlarga qaysilar kiradi?", "Vaqtinchalik komissiyalar, maxsus ishchi guruhlar va saylov komissiyalari", "Ular muayyan vazifa uchun muddatli tashkil etiladi.", [["Doimiy komissiyalar, maxsus ishchi guruhlar va saylov komissiyalari", "Doimiy komissiyalar vaqtinchalik subyekt emas."], ["Vaqtinchalik komissiyalar, doimiy ishchi guruhlar va saylov komissiyalari", "Ishchi guruhlar vaqtinchalik xususiyatga ega."], ["Vaqtinchalik komissiyalar, maxsus ishchi guruhlar va nazorat inspeksiyalari", "Inspeksiya doimiy organ."]]], ["Quyidagi davlat qo‘mitalaridan qaysilari mustaqil qo‘mita maqomiga ega?", "Soliq qo‘mitasi, Oila va xotin-qizlar qo‘mitasi, Din ishlari bo‘yicha qo‘mita", "Bular vazirlik huzurida emas, mustaqil maqomda faoliyat yuritadi.", [["Soliq qo‘mitasi, Oila va xotin-qizlar qo‘mitasi, Statistika agentligi", "Statistika agentlik maqomida, qo‘mita emas."], ["Soliq qo‘mitasi, Yoshlar ishlari agentligi, Din ishlari bo‘yicha qo‘mita", "Yoshlar ishlari agentlik maqomida."], ["Soliq qo‘mitasi, Oila va xotin-qizlar qo‘mitasi, Ekologiya vazirligi", "Ekologiya organi vazirlik maqomida."]]], ["Tashkiliy-huquqiy asoslariga ko‘ra qaysi organ Konstitutsiya asosida tashkil etiladigan davlat organlariga kirmaydi?", "Vazirliklar va qo‘mitalar (qonun hujjatlari asosida tashkil etiladi)", "Ular Konstitutsiyada emas, qonun hujjatlari bilan tashkil etiladi.", [["Vazirlar Mahkamasi (Konstitutsiya asosida tashkil etiladi)", "Bu Konstitutsiya asosida tashkil etiladigan organ."], ["Konstitutsiyaviy sud (Konstitutsiya asosida tashkil etiladi)", "Bu Konstitutsiya asosida tashkil etiladigan organ."], ["Oliy Majlis Qonunchilik palatasi (Konstitutsiya asosida tashkil etiladi)", "Bu Konstitutsiya asosida tashkil etiladigan organ."]]], ["Quyidagilardan qaysi biri respublika davlat boshqaruvi organlari sirasiga kirmaydi?", "Mahalliy ijro hokimiyati organlari (hokimliklar)", "Hokimliklar respublika emas, mahalliy darajadagi organlar.", [["Vazirliklar va davlat qo‘mitalari (respublika organlari)", "Bu respublika davlat boshqaruvi organlariga kiradi."], ["Agentliklar va inspeksiyalar (respublika organlari)", "Bu respublika davlat boshqaruvi organlariga kiradi."], ["Vazirlar Mahkamasi va uning apparati (respublika)", "Bu respublika davlat boshqaruvi organlariga kiradi."]]], ["Belgilangan sohada boshqaruvni amalga oshiradi, rahbarlik yakkaboshchilik asosida, yuridik shaxs – qaysi organ?", "Vazirlik", "Vazirlikda rahbarlik yakkaboshchilik asosida va u yuridik shaxs.", [["Agentlik", "Agentlik xizmat va huquqni qo‘llash vazifalarini bajaradi."], ["Qo‘mita", "Qo‘mitada rahbarlik kollegial asosda."], ["Inspeksiya", "Inspeksiya vazirlikka bo‘ysunib, nazorat qiladi."]]], ["Ma’muriy huquq subyektlari davlat boshqaruvi sohasida nimalarga ega bo‘lishi lozim?", "Ma’muriy huquq layoqati va faoliyat layoqatiga", "Subyekt huquqqa ega bo‘lishi va uni o‘z harakati bilan amalga oshirishi kerak.", [["Faqat ma’muriy huquq layoqatiga", "Faoliyat layoqati ham zarur."], ["Ma’muriy huquq layoqati va fuqarolik layoqatiga", "Fuqarolik layoqati ma’muriy huquq subyekti belgisi emas."], ["Ma’muriy faoliyat layoqati va delikt layoqatiga", "Huquq layoqatisiz subyekt bo‘lmaydi."]]], ["Davlat boshqaruvi faoliyatining shakli nimada aks etadi?", "Boshqaruv mazmunining tashqi ko‘rinishida, huquqiy yoki nohuquqiy harakatlar majmuasida", "Shakl – boshqaruv mazmunining tashqi ifodasi.", [["Boshqaruv mazmunining ichki tuzilishida, faqat huquqiy harakatlar majmuasida", "Shakl mazmunning ichki tuzilishi emas, tashqi ko‘rinishi."], ["Boshqaruv mazmunining tashqi ko‘rinishida, faqat huquqiy harakatlar majmuasida", "Shakl nohuquqiy harakatlarni ham qamraydi."], ["Boshqaruv maqsadining tashqi ko‘rinishida, huquqiy yoki nohuquqiy harakatlar majmuasida", "Shakl maqsadni emas, mazmunni ifodalaydi."]]], ["Keltirilgan fikrlarning qaysi biri to‘g‘ri?", "Boshqaruv shakllari normativ hujjat bilan o‘rnatiladi va faoliyat mazmuniga mos bo‘lishi kerak", "Shakl funksiyalarni amalga oshirish vositasi bo‘lib, mazmunga mos keladi.", [["Boshqaruv shakllari ixtiyoriy tanlanadi va faoliyat mazmuniga mos bo‘lishi shart emas", "Shakl mazmunga mos bo‘lishi lozim."], ["Boshqaruv shakllari normativ hujjat bilan o‘rnatiladi va faoliyat mazmunidan mustaqil bo‘ladi", "Shakl mazmundan mustaqil emas."], ["Boshqaruv shakllari odat bilan o‘rnatiladi va faoliyat mazmuniga mos bo‘lishi kerak", "Shakllar normativ hujjat bilan o‘rnatiladi, odat bilan emas."]]], ["Ma’muriy-huquqiy shakllarning mazmuniga ko‘ra qanday turlari mavjud?", "Huquq normalarini o‘rnatish va huquq normalarini qo‘llash", "Boshqaruv akti norma o‘rnatadi yoki mavjud normani qo‘llaydi.", [["Huquq normalarini o‘rnatish va huquq normalarini sharhlash", "Sharhlash alohida shakl turi emas."], ["Huquq normalarini qo‘llash va huquq normalarini ijro etish", "Ijro etish alohida shakl turi sifatida ajratilmaydi."], ["Huquq normalarini o‘rnatish va huquq normalarini nazorat qilish", "Nazorat qilish shakl turi emas."]]], ["Ma’muriy-huquqiy shakllar qaysi mezonga ko‘ra huquqiy va nohuquqiy shakllarga bo‘linadi?", "Keltirib chiqaradigan oqibatiga ko‘ra", "Yuridik oqibat keltirsa huquqiy, aks holda nohuquqiy shakl.", [["Qabul qilish tartibiga ko‘ra", "Qabul tartibi bu bo‘linishning mezoni emas."], ["Amal qilish muddatiga ko‘ra", "Muddat bu bo‘linishning mezoni emas."], ["Subyektlar doirasiga ko‘ra", "Subyektlar doirasi bu bo‘linishning mezoni emas."]]], ["Qaysi qatorda davlat boshqaruvining huquqiy shakllarining turlari keltirilgan?", "Huquqiy me’yorlarni o‘rnatish, qo‘llash va ma’muriy-huquqiy shartnomalar tuzish", "Bu uch shakl huquqiy shakllarni tashkil etadi.", [["Huquqiy me’yorlarni o‘rnatish, qo‘llash va tashkiliy tadbirlar o‘tkazish", "Tashkiliy tadbirlar nohuquqiy shakl turi."], ["Huquqiy me’yorlarni o‘rnatish, sharhlash va ma’muriy-huquqiy shartnomalar tuzish", "Sharhlash huquqiy shakl turi emas."], ["Moddiy-texnik harakatlar, qo‘llash va ma’muriy-huquqiy shartnomalar tuzish", "Moddiy-texnik harakatlar nohuquqiy shakl."]]], ["Ma’muriy-huquqiy shartnomalarning maqsadi nimadan iborat?", "Ommaviy manfaatlarni qondirish uchun boshqaruv vazifa va vakolatlarini o‘z zimmasiga olishni kelishish", "Shartnoma ommaviy manfaat yo‘lida vakolat va vazifalarni kelishadi.", [["Xususiy manfaatlarni qondirish uchun boshqaruv vazifa va vakolatlarini o‘z zimmasiga olishni kelishish", "Shartnoma ommaviy manfaatga xizmat qiladi."], ["Ommaviy manfaatlarni qondirish uchun boshqaruv vazifa va vakolatlarini bir tomonlama belgilash", "Shartnoma kelishuvga asoslanadi, bir tomonlama belgilashga emas."], ["Ommaviy manfaatlarni qondirish uchun tomonlarning mulkiy majburiyatlarini o‘z zimmasiga olishni kelishish", "Bu fuqarolik shartnomasi maqsadi."]]], ["Quyidagilardan qaysi biri davlat boshqaruvining nohuquqiy shakliga xos?", "Yuridik oqibat keltirmaydi va ma’muriy-huquqiy munosabatni vujudga keltirmaydi", "Nohuquqiy shakl yuridik oqibatsiz va munosabat yaratmaydi.", [["Yuridik oqibat keltirmaydi, ammo ma’muriy-huquqiy munosabatni vujudga keltiradi", "Oqibatsiz harakat munosabat ham yaratmaydi."], ["Yuridik oqibat keltiradi, ammo ma’muriy-huquqiy munosabatni vujudga keltirmaydi", "Bu huquqiy shakl belgisi."], ["Yuridik oqibat keltirmaydi va ma’muriy-huquqiy munosabatni o‘zgartiradi", "Nohuquqiy shakl munosabatni o‘zgartirmaydi."]]], ["Qaysi qatorda davlat boshqaruvining nohuquqiy shakllari turlari keltirilgan?", "Tashkiliy tadbirlar va moddiy-texnik harakatlar (operatsiyalar)", "Bular yuridik oqibat keltirmaydi.", [["Tashkiliy tadbirlar va ma’muriy-huquqiy shartnomalar tuzish", "Shartnoma tuzish huquqiy shakl."], ["Normativ hujjat qabul qilish va moddiy-texnik harakatlar (operatsiyalar)", "Normativ hujjat qabul qilish huquqiy shakl."], ["Huquqni qo‘llash va moddiy-texnik harakatlar (operatsiyalar)", "Huquqni qo‘llash huquqiy shakl."]]], ["Boshqaruvning huquqiy hujjatlari o‘zida nimani ifodalaydi?", "Bir tomonlama hokimiyat ko‘rsatmasini va majburiy qarorlarning yuridik shaklini", "Akt majburiy bo‘lib, yuridik oqibat keltiradi.", [["Ikki tomonlama kelishuvni va tavsiyaviy qarorlarning yuridik shaklini", "Hujjat bir tomonlama va majburiy bo‘ladi."], ["Bir tomonlama hokimiyat ko‘rsatmasini va tavsiyaviy qarorlarning yuridik shaklini", "Qarorlar majburiy xususiyatga ega."], ["Bir tomonlama hokimiyat ko‘rsatmasini va majburiy qarorlarning moddiy shaklini", "Hujjat yuridik shaklni ifodalaydi."]]], ["Boshqaruvning huquqiy hujjatlari xususiyatiga zid bo‘lgan javobni toping?", "Akt bajarilishi ixtiyoriy yoki tavsiyaviy xususiyatga ega", "Akt imperativ, qaratilgan subyekt uchun majburiy.", [["Akt davlat nomidan chiqariladi va bajarilishi majburiy xususiyatga ega", "Bu huquqiy hujjat xususiyatiga mos."], ["Akt yuridik oqibat keltirib chiqaradi va belgilangan shaklga ega bo‘ladi", "Bu huquqiy hujjat xususiyatiga mos."], ["Akt vakolatli organ tomonidan tegishli tartibda qabul qilinadi", "Bu huquqiy hujjat xususiyatiga mos."]]], ["Qonunni qo‘llovchi va farmoyish beruvchi xususiyat huquqiy hujjatlarning qaysi turiga xos?", "Individual hujjatlar", "Individual hujjat qonunni muayyan holatga qo‘llaydi va farmoyish beradi.", [["Normativ hujjatlar", "Normativ hujjat umumiy qoida belgilaydi."], ["Ichki tashkiliy hujjatlar", "Ichki hujjatlar organ ichki faoliyatini tartibga soladi."], ["Rejalashtiruvchi hujjatlar", "Rejalashtiruvchi hujjatlar farmoyish bermaydi."]]], ["Hujjat matnida tasdiqlashga vakolatli shaxsning lavozimi, imzosi, ismining bosh harfi va familiyasi aks ettirilishi qaysi talablar sirasiga kiradi?", "Normativ-huquqiy hujjatlarning rekvizitlari", "Lavozim va imzo hujjat rekvizitlari hisoblanadi.", [["Normativ-huquqiy hujjatlarning shakllari", "Shakl hujjat turini bildiradi, imzo va lavozim rekvizit."], ["Normativ-huquqiy hujjatlarning mazmuniy talablari", "Imzo va lavozim mazmunga emas, rasmiylashtirishga oid."], ["Normativ-huquqiy hujjatlarning yuridik kuchi", "Yuridik kuch hujjat tartibi bilan belgilanadi."]]], ["Davlat boshqaruvi faoliyatining ma’muriy-huquqiy usullari kimga ta’sir ko‘rsatishga yo‘naltiriladi?", "Boshqariluvchi obyektlarga (fuqaro, yuridik shaxs, davlat xizmatchisi)", "Usullar boshqariluvchi obyekt va shaxslarga ta’sir etadi.", [["Boshqaruvchi subyektlarga (fuqaro, yuridik shaxs, davlat xizmatchisi)", "Usullar boshqariluvchi obyektga yo‘naltiriladi."], ["Boshqariluvchi obyektlarga (fuqaro, yuridik shaxs, davlat organi)", "Davlat organi boshqaruvchi subyekt, boshqariluvchi obyekt emas."], ["Boshqariluvchi obyektlarga (fuqaro, jamoat birlashmasi, davlat xizmatchisi)", "Sanab o‘tilgan uchlik yuridik shaxs va davlat xizmatchisini qamraydi."]]], ["Kasbiy tajriba va ilmiy yutuqlarga tayanib, boshqaruv faoliyati rivojidagi o‘zgarishlarni oldindan ko‘ra bilish davlat boshqaruvining qaysi funksiyasi mazmuni?", "Istiqbolni belgilash (prognozlash) funksiyasi", "Istiqbolni belgilash kelgusi o‘zgarishlar va jarayon natijalarini oldindan ko‘ra bilishga asoslanadi.", [["Rejalashtirish (dasturlash) funksiyasi", "Rejalashtirish vazifa va muddatlarni belgilaydi."], ["Muvofiqlashtirish (koordinatsiya) funksiyasi", "Bu funksiya harakatlarni uyg‘unlashtiradi."], ["Tahlil qilish (monitoring) funksiyasi", "Bu funksiya o‘tgan natijalarni baholaydi."]]], ["Normada nazarda tutilgan sharoitda aynan shunday harakat qilish uchun to‘g‘ridan-to‘g‘ri majburiyat yuklash huquqiy ta’sirning qaysi uslubi?", "Buyruq (ko‘rsatma) berish uslubi", "Buyruq muayyan harakatni bajarishni yuridik majburiyat sifatida yuklaydi.", [["Ruxsat berish uslubi", "Ruxsat huquq beradi, majburiyat yuklamaydi."], ["Taqiq qo‘yish uslubi", "Taqiq harakatdan tiyilishni talab qiladi."], ["Tavsiya berish uslubi", "Tavsiya majburiy kuchga ega emas."]]], ["Tashkiliy-huquqiy maqomiga ko‘ra ma’muriy huquq subyektlari orasida asosiy subyekt qaysi?", "Davlat organlari va ularning mansabdor shaxslari", "Ma’muriy-huquqiy munosabatda davlat nomidan hokimiyat vakolatini amalga oshiruvchi organ asosiy subyekt.", [["Davlat organlari va ularning xodimlari", "Oddiy xodimlar hokimiyat vakolatiga ega emas."], ["Davlat organlari va ularning tuzilmaviy bo‘linmalari", "Bo‘linmalar asosiy mustaqil subyekt emas."], ["Davlat organlari va fuqarolarning o‘zini o‘zi boshqarish organlari", "O‘zini o‘zi boshqarish organlari asosiy subyekt emas."]]], ["Sohada davlat xizmatlarini ko‘rsatish va huquqni qo‘llash funksiyasini amalga oshiruvchi maxsus vakolatli organ qaysi?", "Agentlik", "Agentlik xizmat ko‘rsatish va huquqni qo‘llash vazifasini bajaradi.", [["Vazirlik", "Vazirlik sohani boshqaradi, xizmat va huquqni qo‘llash vazifasi agentlikniki."], ["Qo‘mita", "Qo‘mita soha ichidagi faoliyatni muvofiqlashtiradi."], ["Inspeksiya", "Inspeksiya davlat nazoratini amalga oshiradi."]]], ["Soha va tarmoqlarda davlat nazorati va tekshiruvni amalga oshiradi, vazirlik tashkiliy bo‘ysunuvida ishlaydi. Bu qaysi organga xos?", "Inspeksiya", "Inspeksiyaning asosiy vazifasi nazorat va tekshiruv hisoblanadi.", [["Agentlik", "Agentlik xizmat ko‘rsatish va huquqni qo‘llash vazifasini bajaradi."], ["Qo‘mita", "Qo‘mita kollegial tashkil etilib, faoliyatni muvofiqlashtiradi."], ["Vazirlik", "Vazirlik tashkiliy bo‘ysunuvda emas, sohani boshqaradi."]]], ["Respublika ijro etuvchi organlarining markaziy apparatida shtat birliklari soni nechta va undan ortganda departament tashkil etilishi mumkin?", "20 nafar va undan ortiq", "Departament uchun shtat birliklari soni 20 nafar va undan ko‘p bo‘lishi kerak.", [["30 nafar va undan ortiq", "Chegara 20 nafar."], ["15 nafar va undan ortiq", "Chegara 20 nafar."], ["25 nafar va undan ortiq", "Chegara 20 nafar."]]], ["Belgilangan sohada davlat boshqaruvini amalga oshiradi, rahbarlik yakkaboshchilik asosida tashkil etiladi, yuridik shaxs hisoblanadi. Bu qaysi organga xos?", "Vazirlik", "Vazirlik sohadagi boshqaruvni yakkaboshchilik asosida olib boruvchi yuridik shaxs.", [["Agentlik", "Agentlik xizmat va huquqni qo‘llash vazifalarini bajaradi."], ["Qo‘mita", "Qo‘mitada rahbarlik kollegial asosda."], ["Inspeksiya", "Inspeksiya vazirlikka bo‘ysunib, nazorat qiladi."]]], ["Qonunni qo‘llovchi va farmoyish beruvchi xususiyat boshqaruv hujjatlarining yuridik xususiyatiga ko‘ra qaysi turiga xos?", "Individual hujjatlar", "Individual hujjat qonunni muayyan holatga qo‘llaydi va farmoyish beradi.", [["Normativ hujjatlar", "Normativ hujjat umumiy qoida belgilaydi."], ["Ichki tashkiliy hujjatlar", "Ichki hujjatlar organ ichki faoliyatini tartibga soladi."], ["Rejalashtiruvchi hujjatlar", "Rejalashtiruvchi hujjatlar farmoyish bermaydi."]]], ["Davlat boshqaruvining ma’muriy usullari mazmuniga qaysi javob mos keladi?", "Boshqaruv subyektining obyektga bir tomonlama davlat-hokimiyat ta’sirini ko‘rsatishi va majburiy huquqiy aktlarni qo‘llashi", "Ma’muriy usul hokimiyat tartibidagi bir tomonlama majburiy ta’sirga asoslanadi.", [["Boshqaruv subyektining obyektga ikki tomonlama kelishuv asosida ta’sir ko‘rsatishi va majburiy huquqiy aktlarni qo‘llashi", "Ma’muriy usul kelishuvga emas, hokimiyat ta’siriga asoslanadi."], ["Boshqaruv subyektining obyektga bir tomonlama davlat-hokimiyat ta’sirini ko‘rsatishi va tavsiyaviy aktlarni qo‘llashi", "Ma’muriy usulda aktlar majburiy bo‘ladi."], ["Boshqaruv obyektining subyektga bir tomonlama davlat-hokimiyat ta’sirini ko‘rsatishi va majburiy huquqiy aktlarni qo‘llashi", "Ta’sir subyektdan obyektga yo‘naladi, teskarisi emas."]]], ["Ishontirish usuli shaxsning xulq-atvori va ongiga qanday choralar orqali ta’sir ko‘rsatadi?", "Tushuntirish, tarbiyalash, rag‘batlantirish va boshqa axloqiy choralar orqali", "Ishontirish ongga ta’sir etib, ixtiyoriy bajarishga olib keladi.", [["Tushuntirish, tarbiyalash, jazolash va boshqa axloqiy choralar orqali", "Jazolash majburlov usuli, ishontirishga kirmaydi."], ["Tushuntirish, ogohlantirish, rag‘batlantirish va boshqa majburlov choralari orqali", "Ishontirish majburlov choralariga tayanmaydi."], ["Tushuntirish, tarbiyalash, rag‘batlantirish va boshqa moliyaviy choralar orqali", "Ishontirish axloqiy choralarga tayanadi, moliyaviylarga emas."]]], ["Ma’muriy majburlash choralarining turlarini ko‘rsating.", "Ma’muriy oldini olish, ma’muriy cheklash va ma’muriy jazo choralari", "Majburlash uch turga bo‘linadi: oldini olish, cheklash va jazo.", [["Ma’muriy oldini olish, ma’muriy tiklash va ma’muriy jazo choralari", "Tiklash majburlash choralarining turi emas."], ["Ma’muriy ogohlantirish, ma’muriy cheklash va ma’muriy jazo choralari", "Ogohlantirish oldini olish choralari ichiga kiradi, mustaqil tur emas."], ["Ma’muriy oldini olish, ma’muriy cheklash va ma’muriy tarbiya choralari", "Tarbiya majburlash turi emas, ishontirish vositasi."]]], ["Muayyan moddiy yoki nomoddiy tovarlarni ishlab chiqarish orqali ehtiyojlarni qondirishga qaratilgan faoliyat – bu?", "Xizmat ko‘rsatish", "Xizmat ko‘rsatish tovar yaratish orqali ehtiyojni qondirishga yo‘naltirilgan faoliyat.", [["Mahsulot ishlab chiqarish", "Ishlab chiqarish moddiy mahsulot yaratishga qaratiladi."], ["Savdo qilish", "Savdo tovarni qayta sotishga qaratilgan."], ["Ishlarni bajarish (pudrat)", "Pudrat aniq ish natijasini topshirishga qaratilgan."]]], ["Qaysi davlat konsepsiyasida asosiy vazifa – insonning munosib hayoti va erkin rivojlanishi uchun sharoit yaratish, ijtimoiy ehtiyojlarni qondirish?", "Ijtimoiy davlat konsepsiyasi", "Ijtimoiy davlat insonning munosib hayoti uchun sharoit yaratishni o‘z vazifasi deb biladi.", [["Huquqiy davlat konsepsiyasi", "Asosiy vazifa huquq ustuvorligini ta’minlash."], ["Xizmat ko‘rsatuvchi davlat konsepsiyasi", "Davlat xizmat ko‘rsatuvchi sifatida talqin qilinadi, inson munosib hayoti shart-sharoitini yaratish ijtimoiy davlat vazifasi."], ["Demokratik davlat konsepsiyasi", "Asosiy vazifa xalq hokimiyatini ta’minlash."]]], ["Ommaviy xizmatlar ko‘rsatishga xos bo‘lmagan belgini toping.", "Xizmat ko‘rsatuvchi murojaatni qabul qilishdan bosh tortishi mumkinligi", "Murojaat etgan shaxsga xizmat kafolatlanadi, rad etish belgisi unga xos emas.", [["Xizmat murojaat qilgan har bir shaxsga teng shartlarda ko‘rsatilishi", "Bu ommaviy xizmatga xos belgi."], ["Xizmat ko‘rsatuvchi murojaatni qabul qilishdan asossiz bosh tortishi mumkin emasligi", "Bu ommaviy xizmatga xos belgi."], ["Xizmat sifati va muddati bo‘yicha davlat nazorati amalga oshirilishi", "Bu ommaviy xizmatga xos belgi."]]], ["Ommaviy xizmatlar ommaviy manfaatlar bilan bog‘liq qanday ehtiyojlarni qondirishga qaratilgan?", "Individual ehtiyojlarni", "Ommaviy xizmat ommaviy manfaat doirasida individual ehtiyojni qondiradi.", [["Faqat jamoaviy ehtiyojlarni", "Ommaviy xizmat individual ehtiyojga qaratiladi."], ["Davlatning ichki ehtiyojlarini", "Davlat organi ichki ehtiyoji xizmat obyekti emas."], ["Korporativ ehtiyojlarni", "Korporativ ehtiyoj ommaviy xizmat doirasidan tashqarida."]]], ["Funksional yo‘nalishiga ko‘ra ommaviy xizmatlar turlarini ko‘rsating.", "Amaliy, huquqiy va moliyaviy ommaviy xizmatlar", "Funksional tasnifda amaliy, huquqiy va moliyaviy xizmatlar ajratiladi.", [["Amaliy, huquqiy va ijtimoiy ommaviy xizmatlar", "Tasnifda uchinchi tur moliyaviy xizmatlardir."], ["Amaliy, ma’muriy va moliyaviy ommaviy xizmatlar", "Tasnifda ikkinchi tur huquqiy xizmatlardir."], ["Texnik, huquqiy va moliyaviy ommaviy xizmatlar", "Tasnifda birinchi tur amaliy xizmatlardir."]]], ["Tashkil etuvchi va bajaruvchilarning huquqiy maqomiga ko‘ra ommaviy xizmatlar turlarini ko‘rsating.", "Davlat, o‘zini o‘zi boshqarish organlari va nodavlat tashkilotlar tomonidan ko‘rsatiladigan xizmatlar", "Maqomga ko‘ra uch guruh bor: davlat, o‘zini o‘zi boshqarish organlari va nodavlat tashkilotlar.", [["Davlat, o‘zini o‘zi boshqarish organlari va xususiy shaxslar tomonidan ko‘rsatiladigan xizmatlar", "Tasnifda xususiy shaxslar emas, nodavlat tashkilotlar bor."], ["Davlat, o‘zini o‘zi boshqarish organlari va xalqaro tashkilotlar tomonidan ko‘rsatiladigan xizmatlar", "Xalqaro tashkilotlar tasnifga kirmaydi."], ["Davlat, mahalliy hokimiyat organlari va nodavlat tashkilotlar tomonidan ko‘rsatiladigan xizmatlar", "Tasnifda o‘zini o‘zi boshqarish organlari alohida tur."]]], ["Qonunda ma’muriy tartib-taomillarning nechta asosiy prinsipi belgilangan?", "13 ta", "Qonunda 13 ta asosiy prinsip nazarda tutilgan.", [["12 ta", "Qonunda 13 ta prinsip belgilangan."], ["11 ta", "Qonunda 13 ta prinsip belgilangan."], ["14 ta", "Qonunda 13 ta prinsip belgilangan."]]], ["Yuridik shaxslar vakillari ma’muriy ish yuritishda nimada belgilangan vakolatlari doirasida ishtirok etadi?", "Qonun hujjatlari, ta’sis hujjatlari yoki qonunga muvofiq rasmiylashtirilgan ishonchnomada", "Vakolat qonun, ta’sis hujjati yoki qonuniy ishonchnomaga tayanadi.", [["Qonun hujjatlari, ta’sis hujjatlari yoki og‘zaki topshiriqda", "Og‘zaki topshiriq vakolat asosi emas."], ["Qonun hujjatlari, shartnoma yoki qonunga muvofiq rasmiylashtirilgan ishonchnomada", "Shartnoma vakolat belgilovchi hujjat sifatida ko‘rsatilmagan."], ["Qonun hujjatlari, ta’sis hujjatlari yoki rasmiylashtirilmagan ishonchnomada", "Ishonchnoma qonunga muvofiq rasmiylashtirilgan bo‘lishi kerak."]]], ["Ma’muriy organda ma’muriy ish yuritish qaysi tilda olib boriladi?", "O‘zbek, qoraqalpoq yoki joydagi ko‘pchilik aholi so‘zlashadigan tilda", "Ish yuritish til shu tillardan birida yuritiladi.", [["O‘zbek, rus yoki joydagi ko‘pchilik aholi so‘zlashadigan tilda", "Rus tili alohida ko‘rsatilmagan."], ["O‘zbek, qoraqalpoq yoki xalqaro muloqot tilida", "Xalqaro muloqot tili ko‘rsatilmagan."], ["Faqat o‘zbek yoki joydagi ko‘pchilik aholi so‘zlashadigan tilda", "Qoraqalpoq tili ham ko‘rsatilgan."]]], ["Ma’muriy tartib-taomillarning qanday ko‘rinishlari mavjud?", "Ma’muriy ish yuritish, ma’muriy shikoyat bo‘yicha ish yuritish va ijro ishini yuritish", "Ko‘rinishlar: ish yuritish, shikoyat bo‘yicha ish yuritish va ijro ishi.", [["Ma’muriy ish yuritish, ma’muriy shikoyat bo‘yicha ish yuritish va nazorat ishini yuritish", "Uchinchi ko‘rinish ijro ishini yuritishdir."], ["Ma’muriy ish yuritish, ma’muriy taqdimnoma bo‘yicha ish yuritish va ijro ishini yuritish", "Ikkinchi ko‘rinish shikoyat bo‘yicha ish yuritishdir."], ["Ma’muriy ish yuritish, sud shikoyati bo‘yicha ish yuritish va ijro ishini yuritish", "Sud shikoyati ma’muriy tartib-taomil ko‘rinishi emas."]]], ["Fuqarolarning iqtisodiy imkoniyati yoki ijtimoiy maqomi bilan bog‘liq bo‘ladigan ommaviy xizmatlar qaysilar?", "Ijtimoiy prestij xizmatlari, masalan, xususiy ta’lim va yuqori darajadagi tibbiy yordam", "Prestij xizmatlaridan foydalanish iste’molchining to‘lov qobiliyati va maqomiga bog‘liq.", [["Ijtimoiy kafolat xizmatlari, masalan, majburiy ta’lim va birlamchi tibbiy yordam", "Bular iqtisodiy imkoniyatga bog‘liq bo‘lmagan xizmatlar."], ["Ijtimoiy prestij xizmatlari, masalan, majburiy ta’lim va birlamchi tibbiy yordam", "Majburiy ta’lim hamma uchun, prestij xizmati emas."], ["Ijtimoiy kafolat xizmatlari, masalan, xususiy ta’lim va yuqori darajadagi tibbiy yordam", "Xususiy ta’lim kafolat xizmati emas, prestij xizmati."]]], ["Sanatoriy yoki dam olish uyi xizmatlari moddiy va nomoddiy xususiyati bo‘yicha ommaviy xizmatlarning qaysi turiga kiradi?", "Aralash xizmatlar: moddiy-maishiy va ijtimoiy-madaniy ehtiyojni birgalikda qondiradi", "Joylashtirish va ovqatlanish moddiy, sog‘lomlashtirish va dam olish nomoddiy jihat; ikkalasi birlashgan.", [["Moddiy xizmatlar: faqat moddiy-maishiy ehtiyojni qondiradi", "Ijtimoiy-madaniy ehtiyoj ham qondiriladi."], ["Nomoddiy xizmatlar: faqat ijtimoiy-madaniy ehtiyojni qondiradi", "Moddiy-maishiy ehtiyoj ham qondiriladi."], ["Aralash xizmatlar: moddiy-maishiy va huquqiy ehtiyojni birgalikda qondiradi", "Sanatoriy huquqiy emas, ijtimoiy-madaniy ehtiyojni qondiradi."]]], ["Hududda fuqarolar hisobini yuritish va aholini ijtimoiy qo‘llab-quvvatlash xizmatlarini qaysi subyektlar amalga oshiradi?", "Fuqarolarning o‘zini o‘zi boshqarish organlari (mahalla fuqarolar yig‘inlari)", "Mahalla hududda aholi bilan bevosita ishlovchi o‘zini o‘zi boshqarish organi.", [["Hokimliklarning hududiy bo‘linmalari (mahalla markazlari)", "Bu xizmatlar o‘zini o‘zi boshqarish organlari tomonidan amalga oshiriladi."], ["Fuqarolarning o‘zini o‘zi boshqarish organlari (hududiy jamoat kengashlari)", "Bunday xizmat mahalla fuqarolar yig‘inlari tomonidan amalga oshiriladi."], ["Ichki ishlar organlarining hududiy bo‘linmalari (profilaktika inspektorlari)", "Fuqarolar hisobi ularning vazifasi emas."]]], ["Aholining keng qatlamlari uchun mo‘ljallangan, ijtimoiy ahamiyatga ega xizmatlar xarajatlari kim hisobidan qoplanadi?", "Davlat yoki mahalliy byudjet mablag‘lari hisobidan", "Ijtimoiy ahamiyatli xizmatlar jamiyat manfaati uchun byudjetdan moliyalashtiriladi.", [["Davlat yoki xususiy sektor mablag‘lari hisobidan", "Ijtimoiy xizmatlar xususiy sektor mablag‘iga tayanmaydi."], ["Faqat xizmat oluvchi shaxsning mablag‘lari hisobidan", "Ijtimoiy ahamiyatli xizmatlar byudjetdan qoplanadi."], ["Davlat byudjeti va xalqaro tashkilotlar mablag‘lari hisobidan", "Xalqaro mablag‘lar asosiy manba emas."]]], ["Ommaviy xizmatlarni ko‘rsatish kimning bevosita xarajatli faoliyati hisoblanadi?", "Xizmat ko‘rsatuvchining (provayderning) faoliyati", "Xizmatni bevosita amalga oshirgan provayder resurs va xarajatlarni sarflaydi.", [["Xizmat oluvchining (iste’molchining) faoliyati", "Xarajatni xizmat ko‘rsatuvchi qiladi."], ["Xizmatni nazorat qiluvchi organning faoliyati", "Nazorat xizmat ko‘rsatish emas."], ["Xizmat narxini belgilovchi organning faoliyati", "Narx belgilash xizmat ko‘rsatish emas."]]], ["Muayyan huquqiy oqibat keltirib chiqaradigan harakatlarda namoyon bo‘ladigan ommaviy xizmatlar qaysilar?", "Huquqiy xizmatlar, masalan, litsenziyalash, ro‘yxatdan o‘tkazish, sertifikatlash va apostil", "Bu xizmatlar huquq yaratadi, o‘zgartiradi yoki tasdiqlaydi.", [["Amaliy xizmatlar, masalan, litsenziyalash, ro‘yxatdan o‘tkazish, sertifikatlash va apostil", "Bular huquqiy oqibat keltiradigan huquqiy xizmatlar."], ["Moliyaviy xizmatlar, masalan, kreditlash, ro‘yxatdan o‘tkazish, sertifikatlash va apostil", "Kreditlash moliyaviy, boshqalari huquqiy xizmat."], ["Huquqiy xizmatlar, masalan, jamoat transporti, ro‘yxatdan o‘tkazish, sertifikatlash va apostil", "Jamoat transporti amaliy xizmat."]]], ["2025-yil 14-iyuldagi PF-111-son farmon bilan Davlat xizmatini rivojlantirish agentligi negizida qaysi agentlik tashkil etildi?", "Boshqaruv samaradorligi agentligi", "Farmon bilan agentlik shu nom bilan qayta tashkil etilgan.", [["Boshqaruv sifati agentligi", "Farmon bilan boshqa nomdagi agentlik tashkil etilgan."], ["Kadrlar samaradorligi agentligi", "Farmon bilan boshqa nomdagi agentlik tashkil etilgan."], ["Davlat boshqaruvi akademiyasi agentligi", "Akademiya mustaqil ta’lim muassasasi, agentlik emas."]]], ["Davlat fuqarolik xizmatini 2030-yilgacha rivojlantirish strategiyasi qaysi hujjat bilan tasdiqlangan?", "Prezidentning 2025-yil 19-iyundagi PF-95-son farmoni", "Strategiya Prezident farmoni bilan shu sanada tasdiqlangan.", [["Prezidentning 2025-yil 19-iyundagi PF-59-son farmoni", "Farmon raqami PF-95."], ["Prezidentning 2025-yil 14-iyundagi PF-95-son farmoni", "Farmon sanasi 19-iyun."], ["Prezidentning 2025-yil 19-iyundagi PQ-95-son qarori", "Hujjat turi farmon, qaror emas."]]], ["Davlat xizmatchilari davlat organi vakolatlari va mansab majburiyatlarini nimaning evaziga bajaradi?", "Belgilangan pul mukofoti (ish haqi) evaziga", "Xizmat haq to‘lanadigan faoliyat; ish haqi uning evazi.", [["Belgilangan pul mukofoti (ish haqi) va tadbirkorlik daromadi evaziga", "Tadbirkorlik daromadi evaziga ishlash cheklangan."], ["Ijtimoiy ta’minot to‘lovlari evaziga", "Evaz ish haqi, ijtimoiy to‘lov emas."], ["Tijorat shartnomasi bo‘yicha haq evaziga", "Xizmatchi mehnat shartnomasi bo‘yicha ish haqi oladi."]]], ["Qaysi faoliyat davlat fuqarolik xizmatini o‘tash bilan bog‘liq cheklovlar sirasiga kirmaydi?", "Pedagogik, ilmiy va ijodiy faoliyat bilan shug‘ullanish", "Bu faoliyat taqiqlanmagan va cheklov emas.", [["Tadbirkorlik faoliyati bilan shug‘ullanish", "Bu davlat fuqarolik xizmati cheklovlariga kiradi."], ["Boshqa haq to‘lanadigan lavozimni birga olib borish", "Bu davlat fuqarolik xizmati cheklovlariga kiradi."], ["Tijorat tashkiloti boshqaruvida ishtirok etish", "Bu davlat fuqarolik xizmati cheklovlariga kiradi."]]], ["Davlat xizmatini o‘tish jarayonining fakultativ (majburiy bo‘lmagan) bosqichi qaysi?", "Xizmatchini rag‘batlantirish choralarini qo‘llash", "Rag‘batlantirish qo‘llanishi shart bo‘lmagan bosqich.", [["Xizmatchini lavozimga tayinlash", "Bu davlat xizmatini o‘tishning majburiy bosqichi."], ["Xizmatchini lavozim yo‘riqnomasi bilan tanishtirish", "Bu davlat xizmatini o‘tishning majburiy bosqichi."], ["Xizmatchi faoliyatini baholash", "Bu davlat xizmatini o‘tishning majburiy bosqichi."]]], ["Qaysi davlat fuqarolik xizmatchilari rotatsiya qilinmaydi?", "Malaka oshirish kurslarida o‘qiyotgan xizmatchilar", "Qayta tayyorlash yoki malaka oshirishdagilar rotatsiyadan ozod.", [["Intizomiy jazo muddati tugamagan xizmatchilar", "Bunday xizmatchilar rotatsiyadan ozod qilinmagan."], ["Yaqin qarindoshi bilan bir organda ishlovchi xizmatchilar", "Rotatsiya aksincha shunday holatni bartaraf etishga xizmat qilishi mumkin."], ["Attestatsiyadan o‘tmagan xizmatchilar", "Attestatsiyadan o‘tmaganlik rotatsiyani istisno etmaydi."]]], ["Quyidagilardan qaysi biri davlat xizmatchisiga qo‘llanadigan rag‘batlantirish choralariga kirmaydi?", "Hayfsan berish", "Hayfsan intizomiy jazo turi, rag‘batlantirish emas.", [["Rahmat e’lon qilish", "Rag‘batlantirish chorasi."], ["Pul mukofoti berish", "Rag‘batlantirish chorasi."], ["Faxriy yorliq berish", "Rag‘batlantirish chorasi."]]], ["Davlat fuqarolik xizmati lavozimini pasaytirish davlat fuqarolik xizmatchisiga nisbatan qo‘llanadigan qaysi chora?", "Intizomiy jazo choralaridan biri", "Lavozimni pasaytirish intizomiy javobgarlik turi.", [["Ma’muriy jazo choralaridan biri", "Lavozimni pasaytirish intizomiy jazo."], ["Moddiy javobgarlik choralaridan biri", "Moddiy javobgarlik zararni qoplashni nazarda tutadi."], ["Rotatsiya choralaridan biri", "Rotatsiya lavozimni almashtirish, jazo emas."]]], ["my.gov.uz qanday portal?", "Yagona interaktiv davlat xizmatlari portali", "Portal elektron davlat xizmatlaridan foydalanishning yagona nuqtasi.", [["Ochiq ma’lumotlar portali", "Bu portal davlat xizmatlari uchun emas."], ["Normativ-huquqiy hujjatlar milliy bazasi", "Bu hujjatlar bazasi, xizmatlar portali emas."], ["Davlat xaridlari portali", "Bu xaridlar uchun portal."]]], ["Davlat xizmatchilari xizmatni davlat organidagi nima asosida olib borishi lozim?", "Davlat organida nazarda tutilgan shtat jadvali asosida", "Lavozimlar tarkibi shtat jadvalida belgilanadi.", [["Davlat organida nazarda tutilgan ichki tartib qoidalari asosida", "Ichki tartib qoidalari shtat jadvalini almashtirmaydi."], ["Davlat organida tasdiqlangan lavozim yo‘riqnomasi asosida", "Yo‘riqnoma vazifani belgilaydi, xizmat shtat jadvali asosida olib boriladi."], ["Davlat organida nazarda tutilgan ish rejasi asosida", "Ish rejasi xizmat olib borish asosi emas."]]], ["Davlat fuqarolik xizmatiga kirish qanday asosda amalga oshiriladi?", "Lavozimga tayinlash yoki tanlov asosida", "Kirish tayinlash yoki tanlov orqali bo‘ladi.", [["Lavozimga saylash yoki tanlov asosida", "Davlat fuqarolik xizmatida saylov emas, tayinlash qo‘llanadi."], ["Lavozimga tayinlash yoki shartnoma asosida", "Shartnoma kirish asosi sifatida ko‘rsatilmagan."], ["Lavozimga tayinlash yoki tavsiya asosida", "Tavsiya kirish asosi emas."]]], ["Ruxsat berish va litsenziyalash bilan bog‘liq jarayon ma’muriy protsessning qaysi turiga kiradi?", "Tartib-taomillar bilan bog‘liq ma’muriy protsess", "Ruxsat va litsenziya berish ma’muriy tartib-taomil hisoblanadi.", [["Yustitsiyaviy shikoyat bilan bog‘liq ma’muriy protsess", "Yustitsiyaviy protsess shikoyat bo‘yicha qonuniylikni tiklaydi."], ["Yurisdiksiyaviy huquqbuzarlik bilan bog‘liq protsess", "Yurisdiksiyaviy protsess huquqbuzarlik ishlarini ko‘radi."], ["Ichki boshqaruv bilan bog‘liq ma’muriy protsess", "Bu protsess ichki boshqaruv jarayonlarini qamraydi."]]], ["Yustitsiyaviy ma’muriy protsessning mazmuni nimadan iborat?", "Shikoyat asosida organ faoliyatida qonuniylikni tiklash va ma’muriy hujjat qabul qilish jarayoni", "Yustitsiyaviy protsess shikoyatni ko‘rib, qonuniylikni ta’minlaydi.", [["Huquqbuzarlik haqidagi ish asosida organ faoliyatida qonuniylikni tiklash va ma’muriy hujjat qabul qilish jarayoni", "Asos shikoyat, huquqbuzarlik ishi yurisdiksiyaviy protsessga xos."], ["Shikoyat asosida organ faoliyatida samaradorlikni oshirish va ma’muriy hujjat qabul qilish jarayoni", "Maqsad samaradorlik emas, qonuniylikni tiklash."], ["Shikoyat asosida sud faoliyatida qonuniylikni tiklash va ma’muriy hujjat qabul qilish jarayoni", "Protsess ma’muriy organ faoliyatiga qaratiladi, sudga emas."]]], ["Yurisdiksiyaviy ma’muriy protsessning mazmuni nimadan iborat?", "Ma’muriy huquqbuzarlik ishlarini ko‘rib, huquq-tartibot va jamoat tartibini ta’minlash", "Yurisdiksiyaviy protsess huquqbuzarlik ishlarini hal etadi.", [["Ma’muriy shikoyat ishlarini ko‘rib, huquq-tartibot va jamoat tartibini ta’minlash", "Shikoyat ishlari yustitsiyaviy protsessga xos."], ["Ma’muriy huquqbuzarlik ishlarini ko‘rib, qonuniylik va intizomni tiklash", "Maqsad huquq-tartibot va jamoat tartibini ta’minlash."], ["Ma’muriy huquqbuzarlik ishlarini ko‘rib, xizmat ko‘rsatish sifatini ta’minlash", "Xizmat sifati tartib-taomillarga oid."]]], ["Ma’muriy protsessning eng so‘nggi bosqichi qaysi?", "Huquqiy aktni (qarorni) ijro etish", "Ijro qaror qabul qilingandan keyingi yakuniy bosqich.", [["Huquqiy aktni (qarorni) qabul qilish", "Qabul qilish ijro etishdan oldin keladi."], ["Huquqiy aktni (qarorni) shikoyat qilish", "Shikoyat qilish ijrodan oldin ham bo‘lishi mumkin, so‘nggi bosqich emas."], ["Huquqiy aktni (qarorni) rasmiylashtirish", "Rasmiylashtirish ijrodan oldin amalga oshadi."]]], ["Ma’muriy-protsessual faoliyatni qaysi ikki qismga ajratish mumkin?", "Ma’muriy ish yuritish va ma’muriy yurisdiksiyaviy faoliyat", "Faoliyat ish yuritish va yurisdiksiyaviy qismlarga bo‘linadi.", [["Ma’muriy ish yuritish va ma’muriy yustitsiyaviy faoliyat", "Yustitsiyaviy faoliyat bu bo‘linishda ikkinchi qism emas."], ["Ma’muriy tartib-taomil va ma’muriy yurisdiksiyaviy faoliyat", "Birinchi qism ma’muriy ish yuritishdir."], ["Ma’muriy ish yuritish va ma’muriy nazorat faoliyati", "Ikkinchi qism yurisdiksiyaviy faoliyatdir."]]], ["Ma’muriy majburlov choralarini qo‘llash ma’muriy protsessning qaysi turiga xos?", "Yurisdiksiyaviy ma’muriy protsessga", "Majburlov choralari huquqbuzarlik bo‘yicha qo‘llanadi.", [["Yustitsiyaviy ma’muriy protsessga", "Yustitsiyaviy protsess qonuniylikni tiklashga qaratilgan."], ["Tartib-taomillar bilan bog‘liq ma’muriy protsessga", "Bu protsess ruxsat berish va litsenziyalashga oid."], ["Boshqaruv bilan bog‘liq ma’muriy protsessga", "Bu protsess ichki boshqaruv jarayonlari."]]], ["Quyidagilardan qaysi biri ma’muriy protsess turlariga kirmaydi?", "Xo‘jalik (iqtisodiy) protsess", "Xo‘jalik protsessi odil sudlov turi.", [["Yurisdiksiyaviy ma’muriy protsess", "Bu ma’muriy protsess turlariga kiradi."], ["Yustitsiyaviy ma’muriy protsess", "Bu ma’muriy protsess turlariga kiradi."], ["Tartib-taomillar bilan bog‘liq ma’muriy protsess", "Bu ma’muriy protsess turlariga kiradi."]]], ["Quyidagilardan qaysi biri ma’muriy organlarga kirmaydi?", "Qonun chiqaruvchi hokimiyat organlari", "Ular ma’muriy boshqaruv vakolatiga ega emas.", [["Vazirliklar va davlat qo‘mitalari", "Bu ma’muriy organlar qatoriga kiradi."], ["Mahalliy ijro hokimiyati organlari (hokimliklar)", "Bu ma’muriy organlar qatoriga kiradi."], ["Agentliklar va inspeksiyalar", "Bu ma’muriy organlar qatoriga kiradi."]]], ["Ta’sir choralari ko‘zlangan qonuniy maqsadga erishish uchun mos va yetarli bo‘lishi qaysi prinsip mazmuni?", "Mutanosiblik prinsipi", "Mutanosiblik chora va maqsad nisbatini talab qiladi.", [["Qonuniylik prinsipi", "Qonuniylik qonunga rioya etishni bildiradi."], ["Xolislik prinsipi", "Xolislik betaraflikni bildiradi."], ["Adolat prinsipi", "Adolat tenglik va haqqoniylikni bildiradi."]]], ["Manfaatdor shaxslar taqdim etgan haqiqiy holatlar to‘g‘risidagi hujjatlar va ma’lumotlar qachongacha ishonchli hisoblanadi?", "Aksi isbotlanmaguniga qadar", "Ishonchlilik prinsipiga ko‘ra, aksi isbotlanmaguncha ishonchli.", [["Aksi sudda isbotlanmaguniga qadar", "Isbotlash faqat sudda emas, ma’muriy organda ham mumkin."], ["Tekshirib chiqilgunga qadar", "Ishonchlilik tekshiruv bilan emas, aksi isbotlanishi bilan bekor bo‘ladi."], ["Ish bo‘yicha qaror qabul qilinguniga qadar", "Ishonchlilik qaror qabul qilinishi bilan tugamaydi."]]], ["Qonunchilikning bartaraf etib bo‘lmaydigan qarama-qarshiliklari va noaniqliklari kimning foydasiga talqin etiladi?", "Manfaatdor shaxslar foydasiga", "Bu manfaatdor shaxslar huquqlarining ustunligi prinsipi.", [["Ma’muriy organ foydasiga", "Shubha organ foydasiga emas, shaxs foydasiga hal etiladi."], ["Qonun chiqaruvchi organ foydasiga", "Talqin qonun chiqaruvchi foydasiga emas."], ["Davlat manfaatlari foydasiga", "Davlat manfaati talqin qoidasi emas."]]], ["Ma’muriy tartib-taomil uchun boshqa organlardan hujjat va ma’lumot olish talab etilsa, ish qaysi prinsip bo‘yicha amalga oshiriladi?", "“Bir darcha” prinsipi", "Organ hujjatlarni idoralararo hamkorlik orqali o‘zi oladi.", [["“Yagona hujjat” prinsipi", "Bunday prinsip hujjatlarni boshqa organlardan olishni nazarda tutmaydi."], ["“Ochiq eshiklar” prinsipi", "Bu prinsip qabul tartibini emas, ochiqlikni bildiradi."], ["“Ikki bosqichli” prinsipi", "Bu prinsip tartib-taomillar prinsipi sifatida belgilanmagan."]]], ["Diskretsion vakolat nima?", "Qonunda yo‘l qo‘yilgan choralardan birini o‘z ixtiyoriga ko‘ra qo‘llash yoki qo‘llamaslik huquqi", "Ixtiyor qonun doirasidagi tanlov imkoniyati.", [["Qonunda yo‘l qo‘yilmagan choralardan birini o‘z ixtiyoriga ko‘ra qo‘llash yoki qo‘llamaslik huquqi", "Diskretsiya qonun doirasida bo‘ladi."], ["Qonunda yo‘l qo‘yilgan choralardan birini qo‘llash uchun yuqori organ ruxsatini olish majburiyati", "Diskretsiya ixtiyoriy tanlashni bildiradi."], ["Qonunda yo‘l qo‘yilgan choralardan birini qo‘llashda ixtiyor huquqidan mahrum bo‘lish", "Diskretsiya ixtiyor huquqini beradi."]]], ["Idoralararo hamkorlik hisoblanmaydigan munosabatlar qaysilar?", "Bo‘ysunuv munosabatidagi organlar o‘rtasidagi munosabatlar", "Hamkorlik bir-biriga bo‘ysunmaydigan organlar o‘rtasida.", [["Bo‘ysunmaydigan organlar o‘rtasidagi hujjat almashinuvi", "Bu idoralararo hamkorlik hisoblanadi."], ["Teng huquqli organlarning o‘zaro ma’lumot so‘rovi", "Bu idoralararo hamkorlik hisoblanadi."], ["Boshqa idoraga qarashli organlar o‘rtasidagi hamkorlik", "Bu idoralararo hamkorlik hisoblanadi."]]], ["Qabul qilinayotgan ma’muriy hujjat yoki amalga oshirilayotgan ma’muriy harakat qaratilgan shaxs – bu ...", "Adresat (manfaatdor shaxs)", "Hujjat yoki harakat adresatiga qaratiladi.", [["Murojaatchi (ariza beruvchi)", "Murojaatchi hujjat qaratilgan shaxs bo‘lmasligi mumkin."], ["Vakil (ishonchli shaxs)", "Vakil adresat nomidan harakat qiladi."], ["Mansabdor shaxs (hujjatni tayyorlovchi)", "U hujjat chiqaruvchi, qaratilgan shaxs emas."]]], ["Prezidentning 2022-yil 21-dekabrdagi PF-269-son farmoniga ko‘ra, 26 ta davlat organida 40 ta rahbar o‘rinbosari lavozimi qanday choralar natijasida qisqartirildi?", "Sohaga oid bo‘lmagan vazifalarni qisqartirish va raqamli texnologiyalarni joriy etish orqali tuzilma o‘rtacha 15 foizga maqbullashtirildi", "Farmonda aynan vazifalarni qisqartirish va raqamlashtirish orqali tuzilmani maqbullashtirish ko‘rsatilgan.", [["Sohaga oid vazifalarni kengaytirish va raqamli texnologiyalarni joriy etish orqali tuzilma o‘rtacha 15 foizga maqbullashtirildi", "Vazifalar kengaytirilmagan, sohaga oid bo‘lmaganlari qisqartirilgan."], ["Sohaga oid bo‘lmagan vazifalarni qisqartirish va raqamli texnologiyalarni joriy etish orqali tuzilma o‘rtacha 25 foizga maqbullashtirildi", "Mexanizm to‘g‘ri, lekin ko‘rsatkich noto‘g‘ri: o‘rtacha 15 foiz."], ["Markaziy apparatlarni birlashtirish va hududiy boshqarmalarni ko‘paytirish orqali tuzilma o‘rtacha 15 foizga maqbullashtirildi", "Farmonda birlashtirish emas, vazifalarni qisqartirish nazarda tutilgan."]]], ["Majburiy tartibda davolash chorasi kimlarga nisbatan qo‘llanadi?", "Jamoat tartibini buzayotgan yoki aholi salomatligiga xavf tug‘dirayotgan surunkali alkogolizm, giyohvandlik yoki zaharvandlikka mubtalo bemorlarga", "Bu chora sud qaroriga ko‘ra aynan shunday xavf tug‘diruvchi bemorlarga qo‘llanadi.", [["Jamoat tartibini buzayotgan yoki aholi salomatligiga xavf tug‘dirayotgan har qanday surunkali kasallikka chalingan, davolanishdan bosh tortgan bemorlarga", "Chora faqat alkogolizm, giyohvandlik yoki zaharvandlik bilan cheklanadi."], ["Jamoat tartibini buzmasa-da, o‘z salomatligiga zarar yetkazayotgan surunkali alkogolizm, giyohvandlik yoki zaharvandlikka mubtalo bemorlarga", "Jamoat tartibini buzish yoki aholi salomatligiga xavf mezoni zarur."], ["Jamoat tartibini buzayotgan yoki aholi salomatligiga xavf tug‘dirayotgan ruhiy kasallik yoki o‘tkir yuqumli kasallikka mubtalo bemorlarga", "Bu boshqa tartibdagi davolash, shu chora kasalliklari qatoriga kirmaydi."]]], ["Axborot va aloqa sohasidagi ommaviy xizmatlar keltirilgan qatorni ko‘rsating.", "Nashriyot xizmatlari, teleradioeshittirish, telekommunikatsiya, dasturiy ta’minot ishlab chiqish va IT-konsalting", "Barcha xizmatlar axborot va aloqa sohasiga oid.", [["Nashriyot xizmatlari, teleradioeshittirish, sug‘urta, dasturiy ta’minot ishlab chiqish va IT-konsalting", "Sug‘urta moliyaviy xizmat, axborot-aloqaga kirmaydi."], ["Teleradioeshittirish, telekommunikatsiya, kitob savdosi va dasturiy ta’minot ishlab chiqish", "Kitob savdosi savdo sohasiga oid."], ["Nashriyot xizmatlari, pochta tashish, telekommunikatsiya va transport logistikasi", "Transport logistikasi transport sohasi xizmati."]]], ["Xususiy sektor orqali amalga oshiriladigan ommaviy xizmatlarda davlat qanday rolni bajaradi?", "Faqat nazorat funksiyasini saqlab qoladi", "Xizmatni xususiy sektor ko‘rsatadi, davlatda nazorat qoladi.", [["Nazorat va xizmat funksiyasini saqlab qoladi", "Xizmatni xususiy sektor ko‘rsatadi."], ["Faqat tartibga solish funksiyasini saqlab qoladi", "Davlatda nazorat funksiyasi qoladi."], ["Faqat moliyalashtirish funksiyasini saqlab qoladi", "Moliyalashtirish nazorat o‘rnini bosmaydi."]]], ["Davlat fuqarolik xizmati faoliyati qaysi lavozimlardagi xizmatchilarga aloqador?", "Davlat fuqarolik xizmati lavozimlarining davlat reyestriga kiritilgan lavozimlardagi xizmatchilarga", "Faoliyat reyestrga kiritilgan lavozimlarga nisbatan amal qiladi.", [["Davlat organlaridagi barcha lavozimlardagi xodimlarga, texnik xodimlarni ham qo‘shgan holda", "Texnik va xizmat ko‘rsatish xodimlari fuqarolik xizmatchisi emas."], ["Vazirlar Mahkamasi tasdiqlagan lavozimlar ro‘yxatidagi xizmatchilarga", "Mezon Vazirlar Mahkamasi ro‘yxati emas, davlat reyestri."], ["Mahalliy hokimliklar va sud organlaridagi xizmatchilarga", "Sudyalar fuqarolik xizmatchisi hisoblanmaydi."]]], ["Davlat xizmatini o‘tash – xizmat o‘tashning asosiy mazmuni, bosqichlari, tartib va jarayonlarini belgilab beruvchi ...", "Huquqiy, tashkiliy va ijtimoiy chora-tadbirlar tizimi", "Ta’rif aynan shu uch yo‘nalishni qamraydi.", [["Huquqiy, tashkiliy va iqtisodiy chora-tadbirlar tizimi", "Uchinchi yo‘nalish ijtimoiy, iqtisodiy emas."], ["Intizomiy, tashkiliy va ijtimoiy chora-tadbirlar tizimi", "Intizomiy emas, huquqiy yo‘nalish nazarda tutiladi."], ["Huquqiy, moliyaviy va ijtimoiy chora-tadbirlar tizimi", "Moliyaviy chora-tadbirlar ta’rifga kirmaydi."]]], ["Davlat fuqarolik xizmatini o‘tash bo‘yicha mehnat shartnomasida quyidagilardan qaysi biri belgilanadi?", "Ish vaqti, lavozim yo‘riqnomasi, faoliyat samaradorligini baholash va rotatsiya tartibi", "Bular mehnat shartnomasida belgilanadi.", [["Ish vaqti, lavozim yo‘riqnomasi, sudlanganlik holatini aniqlash va rotatsiya tartibi", "Sudlanganlik holati qabul talabi, shartnoma sharti emas."], ["Ish vaqti, shaxsiy mulk tarkibi va daromadlarini baholash hamda rotatsiya tartibi", "Mulk tarkibi shartnomada belgilanmaydi."], ["Ish vaqti, tadbirkorlik faoliyati ruxsati, samaradorlikni baholash va rotatsiya tartibi", "Tadbirkorlik ruxsati shartnoma sharti emas."]]], ["Qonunga xilof qilmishiga nisbatan qonunchilikda nazarda tutilgan u yoki bu turdagi jazo choralarini qo‘llash – bu ...", "Yuridik javobgarlik", "Qonunbuzarlik uchun jazo choralari qo‘llanishi yuridik javobgarlikdir.", [["Intizomiy javobgarlik", "Bu yuridik javobgarlikning faqat bir turi."], ["Ma’muriy majburlov", "Bu majburlov choralari, javobgarlikning umumiy ta’rifi emas."], ["Ma’naviy javobgarlik", "Bu axloqiy tushuncha, qonunchilikda belgilanmagan."]]], ["Ma’muriy protsess deganda nima tushuniladi?", "Ma’muriy-protsessual shaklda ma’muriy-huquqiy aktlarni qabul qilish va ijro etish orqali ishni hal etishga qaratilgan ijro organlarining hokimiyat faoliyati", "Ta’rif protsessual shakl va akt qabul qilish-ijro etishni o‘z ichiga oladi.", [["Sud shaklida ma’muriy ishlarni ko‘rib, hukm chiqarish orqali ishni hal etishga qaratilgan sudyalarning hokimiyat faoliyati", "Bu sud protsessi, ijro organlari faoliyati emas."], ["Ma’muriy-protsessual shaklda normativ hujjatlarni qabul qilish va ijro etish orqali qoidalarni belgilashga qaratilgan ijro organlarining hokimiyat faoliyati", "Bu norma ijodkorligi, aniq ishni hal etish emas."], ["Ma’muriy-protsessual shaklda ma’muriy-huquqiy aktlarni qabul qilish va kelishish orqali ishni hal etishga qaratilgan ijro organlarining ixtiyoriy faoliyati", "Protsess hokimiyat faoliyati, ixtiyoriy kelishuv emas."]]], ["Ma’muriy protsessda doim qanday subyekt ishtirok etadi?", "Davlat organi yoki uning mansabdor shaxsi", "Hokimiyat vakolatiga ega tomon har doim bo‘ladi.", [["Davlat organi yoki uning tuzilmaviy xodimi", "Oddiy xodim hokimiyat vakolatiga ega emas."], ["Davlat organi yoki prokuratura vakili", "Prokuror doimiy ishtirokchi emas."], ["Sud organi yoki uning mansabdor shaxsi", "Sud ma’muriy protsessning doimiy subyekti emas."]]], ["Ma’muriy protsess natijasi sifatida nima qabul qilinadi?", "Ma’muriy-huquqiy akt", "Protsess ma’muriy-huquqiy akt bilan yakunlanadi.", [["Ma’muriy-huquqiy shartnoma", "Shartnoma protsess natijasi emas, shakllaridan biri."], ["Ma’muri
